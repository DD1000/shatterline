// EMP strips both for good the moment they cross its field; PRISM's beam goes straight through.
// Light shield levels use thinner shields (25% of HP) so you can get by without a shield buster.

  LANG = l; LANG_CHOSEN = true;

// =====================================================================
//  MAP GEOMETRY (one or more lanes into one core)
// =====================================================================
function makeLane(turnPts) {
  const pts = turnPts.map(([c, r]) => ({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 }));
  const segs = []; let len = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], l = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, l, start: len, ang: Math.atan2(b.y - a.y, b.x - a.x) }); len += l;
  }
  function at(d) {
    d = clamp(d, 0, len);
    for (const s of segs) {
      if (d <= s.start + s.l) { const t = (d - s.start) / s.l; return { x: lerp(s.a.x, s.b.x, t), y: lerp(s.a.y, s.b.y, t), ang: s.ang }; }
    }
    const s = segs[segs.length - 1]; return { x: s.b.x, y: s.b.y, ang: s.ang };
  }
  return { tp: turnPts, pts, segs, len, at, start: pts[0], end: pts[pts.length - 1] };
}
// paths: full routes enemies walk (portal -> core). lanes: what gets drawn (branches stop at the merge).
const MAP = { paths: [], lanes: [], tiles: new Set(), core: { x: 0, y: 0 }, portals: [] };
function setMap(paths, lanes) {
  lanes = lanes || paths;
  MAP.paths = paths.map(makeLane);
  MAP.lanes = lanes.map(makeLane);
  MAP.tiles = new Set();
  for (const p of lanes) for (const [c, r] of expandTiles(p)) MAP.tiles.add(r * COLS + c);
  MAP.core = MAP.paths[0].end;
  MAP.portals = MAP.paths.map(p => p.start);
  // flyers ignore the track: a straight flight line from each portal to the core
  MAP.flights = MAP.paths.map(p => makeLane([p.tp[0], p.tp[p.tp.length - 1]]));
}

// =====================================================================
//  EFFECTS: particles, rings, lightning, floating text
// =====================================================================
const FX = {
  parts: [], rings: [], zaps: [], texts: [], lines: [],
  add(p) {                                  // particle budget (smaller when the device is struggling)
    const n = this.parts.length;

    this.parts.push(p);
  },
  spark(x, y, color, n, sp = 160, life = 0.35) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(sp * 0.3, sp);

    }
  },
  shards(x, y, color, n, sp = 150, size = 4) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(sp * 0.35, sp);

    }

  dot(x, y, color, size = 3, life = 0.3, vx = 0, vy = 0) {

  },
  flash(x, y, r, color, life = 0.18) { this.add({ k: 3, x, y, r, life, max: life, color }); },
  ring(x, y, r0, r1, color, life = 0.4, w = 3) { if (this.rings.length > 80) this.rings.shift(); this.rings.push({ x, y, r0, r1, color, life, max: life, w }); },
  line(x1, y1, x2, y2, color, life = 0.3, w = 5) { this.lines.push({ x1, y1, x2, y2, color, life, max: life, w }); },
  zap(pts, color, life = 0.16) { this.zaps.push({ pts, color, life, max: life, t: 0 }); },
  text(x, y, str, color, size = 11, opts = {}) {

  shatter(x, y, color, r, big) {

    this.shards(x, y, color, big ? 46 : Math.round(7 + r * 0.5), big ? 300 : 150, big ? 7 : Math.max(3, r * 0.45));

  },
  clear() { this.parts.length = 0; this.rings.length = 0; this.zaps.length = 0; this.texts.length = 0; this.lines.length = 0; },
};

let bgCanvas = document.createElement('canvas');
function buildBackground(theme) {
  bgCanvas.width = cvs.width; bgCanvas.height = cvs.height;
  const g = bgCanvas.getContext('2d'), k = DPR * SCALE;
  g.setTransform(k, 0, 0, k, 0, 0);
  const cx = MAP_X + W / 2, cy = MAP_Y + ROWS * TILE / 2;
  const gr = g.createRadialGradient(cx, cy, 20, cx, cy, Math.max(LW, LH) * 0.75);
  gr.addColorStop(0, theme.bg2); gr.addColorStop(1, theme.bg);
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  // lattice of dots across the whole screen, aligned to the map grid
  g.fillStyle = hexA(theme.grid, 0.55);
  const ox = MAP_X % TILE, oy = MAP_Y % TILE;
  for (let x = ox - TILE; x < LW + TILE; x += TILE)
    for (let y = oy - TILE; y < LH + TILE; y += TILE) g.fillRect(x - 1, y - 1, 2, 2);
  // buildable tiles
  g.save(); g.translate(MAP_X, MAP_Y);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (MAP.tiles.has(r * COLS + c)) continue;
    const x = c * TILE, y = r * TILE;
    g.fillStyle = theme.tile;
    g.beginPath(); g.roundRect ? g.roundRect(x + 3, y + 3, TILE - 6, TILE - 6, 6) : g.rect(x + 3, y + 3, TILE - 6, TILE - 6); g.fill();
    g.strokeStyle = hexA(theme.grid, 0.9); g.lineWidth = 1;
    const m = 5;
    g.beginPath();
    g.moveTo(x + 3, y + 3 + m); g.lineTo(x + 3, y + 3); g.lineTo(x + 3 + m, y + 3);
    g.moveTo(x + TILE - 3 - m, y + TILE - 3); g.lineTo(x + TILE - 3, y + TILE - 3); g.lineTo(x + TILE - 3, y + TILE - 3 - m);
    g.stroke();
  }
  // path channel
  g.lineJoin = 'round'; g.lineCap = 'round';
  const trace = () => { g.beginPath(); for (const ln of MAP.lanes) ln.pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); };
  trace(); g.globalAlpha = 0.18; g.lineWidth = 42; g.strokeStyle = theme.edge; g.stroke();
  trace(); g.globalAlpha = 1; g.lineWidth = 31; g.strokeStyle = theme.edge; g.stroke();
  trace(); g.lineWidth = 27.5; g.strokeStyle = theme.path; g.stroke();
  trace(); g.globalAlpha = 0.35; g.lineWidth = 1; g.strokeStyle = theme.edge; g.setLineDash([2, 6]); g.stroke(); g.setLineDash([]);
  g.globalAlpha = 1;
  g.restore();
  // vignette
  const vg = g.createRadialGradient(cx, cy, Math.min(LW, LH) * 0.35, cx, cy, Math.max(LW, LH) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg; g.fillRect(0, 0, LW, LH);
}

// energy flowing along the path toward the core (drawn in map space)
function drawPathFlow(theme, t) {
  ctx.save();
  additive(true);
  ctx.beginPath(); for (const ln of MAP.lanes) ln.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.setLineDash([3, 17]); ctx.lineDashOffset = -t * 42;
  ctx.globalAlpha = 0.6; ctx.lineWidth = 2.5; ctx.strokeStyle = theme.flow; ctx.stroke();
  ctx.setLineDash([]);
  additive(false);
  ctx.restore();

function drawPortals(t, pulse) { MAP.portals.forEach((p, i) => drawPortal(p, t + i * 1.7, pulse)); }
function drawPortal(pt, t, pulse) {
  const { x, y } = pt, c = '#ff3d9a';
  additive(true); glow(x, y, 34 + pulse * 14, c, 0.55 + pulse * 0.4); additive(false);
  for (let i = 0; i < 3; i++) {
    polyPath(x, y, 15 - i * 4 + pulse * 3, 5 - (i % 2), t * (i % 2 ? -1.6 : 1.1) + i);
    ctx.lineWidth = 1.6; ctx.strokeStyle = hexA(i ? '#a066ff' : c, 0.9 - i * 0.2); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
}

function drawCore(t, lives, maxLives, hit) {
  const { x, y } = MAP.core;
  const f = Math.max(0, lives / maxLives);
  const c = f > 0.5 ? '#bff8ff' : f > 0.25 ? '#ffd27a' : '#ff4a5a';
  const s = 1 + Math.sin(t * 3) * 0.04 + hit * 0.25;
  additive(true); glow(x, y, 46 * s, c, 0.55 + hit * 0.5); additive(false);
  polyPath(x, y, 17 * s, 4, t * 0.4); ctx.fillStyle = '#0a0817'; ctx.fill(); ctx.fillStyle = hexA(c, 0.25); ctx.fill(); neon(c, 2.4);
  polyPath(x, y, 9 * s, 4, -t * 0.9); ctx.fillStyle = hexA(c, 0.6); ctx.fill(); neon('#ffffff', 1.2);

  ctx.beginPath(); ctx.arc(x, y, 23 * s, -Math.PI / 2, -Math.PI / 2 + TAU * f);
  ctx.lineWidth = 2; ctx.strokeStyle = hexA(c, 0.8); ctx.stroke();

// =====================================================================
//  PROGRESS (saved on this device)
// =====================================================================
const Save = {
  d: { max: 1, stars: {}, loadout: ['bolt'], known: ['bolt'], done: false },
  load() {
    try {
      const d = JSON.parse(localStorage.getItem('shatterline.save') || 'null');
      if (d && d.max) this.d = Object.assign(this.d, d);
    } catch (e) {}
    this.d.max = clamp(this.d.max | 0, 1, LEVELS.length);
    // players who had cleared the old final level carry on into the new ones
    if (this.d.done && this.d.max < LEVELS.length && this.stars(this.d.max) > 0) { this.d.max += 1; this.d.done = false; }
  },
  // highest level you can open: your progress, or everything while test mode is on
  open() { return this.d.testAll ? LEVELS.length : this.d.max; },
  store() { try { localStorage.setItem('shatterline.save', JSON.stringify(this.d)); } catch (e) {} },
  stars(n) { return this.d.stars[n] || 0; },
  total() { return Object.values(this.d.stars).reduce((a, b) => a + b, 0); },
  unlockedTowers() { return TOWER_ORDER.filter(t => TOWERS[t].unlock <= this.open()); },
  complete(n, stars) {
    const prev = this.stars(n);
    if (stars > prev) this.d.stars[n] = stars;
    let first = false;
    if (stars > 0 && n === this.d.max) { first = true; if (n < LEVELS.length) this.d.max = n + 1; else this.d.done = true; }
    this.store();
    return { first, prev };
  },
  // new towers go straight into the loadout so you try them
  syncLoadout() {
    const slots = slotsFor(this.open()), fresh = [];
    for (const t of this.unlockedTowers()) if (!this.d.known.includes(t)) { this.d.known.push(t); fresh.push(t); }
    let lo = this.d.loadout.filter(t => TOWERS[t] && TOWERS[t].unlock <= this.open());
    for (const t of fresh) { if (lo.includes(t)) continue; if (lo.length >= slots) lo.pop(); lo.push(t); }
    for (const t of this.unlockedTowers()) if (lo.length < Math.min(slots, this.unlockedTowers().length) && !lo.includes(t)) lo.push(t);
    this.d.loadout = lo.slice(0, slots);
    this.store();
    return fresh;
  },
};

const G = {

  levelNum: 0, level: null, waves: [], loadout: ['bolt'], stars: 0,
  spawners: [], waveStats: {}, enemies: [], towers: [], shots: [], shells: [], domes: [],
  grid: new Array(COLS * ROWS).fill(null), eid: 0,
  combo: 0, comboT: 0, comboPop: 0, bestCombo: 0, kills: 0, leaks: 0, leakTypes: {},
  shake: 0, flashA: 0, flashCol: '#fff', slowT: 0, coreHit: 0, portalPulse: 0,
  banner: null, toast: null, shout: null, menu: null, coins: [],
  dispGold: 0, goldBump: 0, livesBump: 0, endT: 0, demoT: 0, tutorial: false,

const theme = () => THEMES[G.theme];
const waveStat = w => G.waveStats[w] || (G.waveStats[w] = { alive: 0, toSpawn: 0, cleared: false });
const snd = (name, ...a) => { if (!G.demo || G.demoSound) Sound.play(name, ...a); };
const isBuildable = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !MAP.tiles.has(r * COLS + c);
const bossAlive = () => G.enemies.some(e => e.alive && e.rc.boss);
const towerRange = tw => (TOWERS[tw.type].lv[tw.lv].range || 0) * TILE;
function addShake(v) { G.shake = Math.min(1, G.shake + v * (REDUCED ? 0.3 : 1)); }
function vibrate(p) { try { if (!G.demo && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

function resetRun() {
  G.over = false; G.result = null; G.paused = false; G.speed = 1; G.time = 0; G.stars = 0;
  G.lives = G.maxLives = ECON.startLives; G.waveNum = 0; G.awaiting = true; G.nextTimer = null;

  G.banner = null; G.toast = null; G.shout = null; G.menu = null; G.press = null; G.coins = []; G.confirm = null;

function startDemo() {

  resetRun();
  G.gold = 0; G.dispGold = 0;
  [['bolt', 2, 3, 2], ['arc', 4, 6, 1], ['nova', 4, 9, 1], ['frost', 6, 3, 0], ['prism', 5, 11, 1], ['rail', 0, 6, 0]]

function startLevel(n) {
  QUALITY.fx = 1; QUALITY.t = 0; QUALITY.slow = 0; QUALITY.ema = 16;
  if (QUALITY.dpr < 2 && DPR < Math.min(2, window.devicePixelRatio || 1)) { QUALITY.dpr = Math.min(2, DPR + 0.25); layout(); }   // try one step sharper each level

// ---------------------------------------------------------------- waves
function buildSpawns(w) {
  const list = [], nl = MAP.paths.length, tl = new Array(nl).fill(0);
  for (const [type, count, gap, lane] of G.waves[w - 1]) {
    const lanes = lane < 0 ? [...Array(nl).keys()] : [Math.min(lane, nl - 1)];
    const t0 = Math.max(...lanes.map(i => tl[i]));
    for (let i = 0; i < count; i++) list.push({ type, at: t0 + i * gap, lane: lanes[i % lanes.length] });
    const end = t0 + (count - 1) * gap + ECON.groupGap;
    for (const i of lanes) tl[i] = end;
  }
  return list.sort((a, b) => a.at - b.at);
}
// How hard the music should push (0..1): bigger waves later in the level, more enemies on
// screen and the final wave all raise it. Boss fights switch to the boss theme on top of this.
function musicIntensity() {
  if (!G.level || !G.waveNum) return 0.1;
  const n = G.waves.length, waveFrac = (G.waveNum - 1) / Math.max(1, n - 1);
  let alive = 0; for (const e of G.enemies) if (e.alive) alive += e.rc.boss ? 6 : e.rc.leak;
  for (const sp of G.spawners) alive += (sp.list.length - sp.i) * 0.5;          // the rest of the wave is coming
  const crowd = Math.min(1, alive / 22);
  const x = 0.12 + 0.4 * waveFrac + 0.45 * crowd + (G.waveNum === n ? 0.1 : 0) + Math.min(0.08, G.levelNum / 500);
  return Math.min(1, x);
}
function isBossWave(w) { return w >= 1 && w <= G.waves.length && G.waves[w - 1].some(g => g[0] === 'boss'); }

function startWave(early) {
  if (G.over || G.waveNum >= G.waves.length) return;
  if (early && G.nextTimer !== null) {
    const bonus = G.noBounty ? 0 : Math.ceil(G.nextTimer * ECON.earlyBonus);
    if (bonus > 0) {
      G.gold += bonus; G.goldBump = 1;
      G.toast = { text: tr('early_call', bonus), color: '#ffd23d', t: 0, dur: 1.4 };
      snd('coin');
    }
  }
  G.awaiting = false; G.nextTimer = null; G.waveNum++;
  const w = G.waveNum, list = buildSpawns(w);
  G.spawners.push({ wave: w, list, i: 0, t: -0.8 });
  const ws = waveStat(w); ws.toSpawn = list.length;
  const boss = isBossWave(w), last = w === G.waves.length;
  const cond = w === 1 && G.level ? (G.level.noBounty ? tr('cond_noBounty') : G.level.air ? tr('cond_air') : G.level.shielded ? tr('cond_shielded') : '') : '';
  G.banner = { text: tr('wave', w), sub: boss ? tr('boss_incoming') : last ? tr('final_wave') : cond, color: boss ? '#ff2e4d' : theme().flow, t: 0, dur: cond ? 2.2 : 1.7 };
  snd(boss ? 'boss' : 'wave');
  Sound.setBoss(bossAlive());
  Sound.musicOn();
}

function spawnEnemy(type, wave, lane = 0, dist = 0, jitter = 0) {
  const rc = ENEMIES[type];
  const mul = G.demo ? 1.6 : G.level.hp(wave) * (ECON.hpScale || 1);
  const li = Math.min(lane, MAP.paths.length - 1), path = rc.flying ? MAP.flights[li] : MAP.paths[li];
  const e = {
    id: ++G.eid, type, rc, wave, lane, path, hp: rc.hp * mul, maxHp: rc.hp * mul, dist, speed: rc.speed * TILE,
    x: 0, y: 0, dir: 0, rot: rand(0, TAU), rot2: 0, flash: 0, punch: 0, slowT: 0, slowAmt: 0, brittle: false,
    age: jitter ? 0.3 : 0, blinkT: rand(1, 5), blink: 0, trailT: 0, alive: true, off: jitter,
    shield: 0, shieldMax: 0, lastHit: -9, dome: 0, domeMax: 0, domeHit: -9, domePing: 0, domeDead: false,
    warpT: rc.blink ? rc.blink.every * rand(0.7, 1.1) : 0, healT: rc.heal ? rc.heal.every * rand(0.5, 1) : 0,
  };
  const p = path.at(dist); e.x = p.x; e.y = p.y; e.dir = p.ang;
  // shields: this level's shielded types wear their own; an Aegis carries a dome for everyone near it
  if (!G.demo && G.level && G.level.shieldTypes.includes(type)) e.shield = e.shieldMax = e.maxHp * (G.level.shielded ? SHIELD_PCT : SHIELD_PCT_LIGHT);
  if (rc.dome) e.dome = e.domeMax = rc.dome.hp * mul;
  G.enemies.push(e); waveStat(wave).alive++;
  if (!jitter) G.portalPulse = 1;
  if (rc.boss && !G.demo) {
    G.shout = { text: tr('warden'), sub: tr('armored_boss'), color: rc.color, t: 0, dur: 1.6 };
    addShake(0.35); Sound.setBoss(true);
  }
  return e;
}

// --------------------------------------------------------------- towers
function placeTower(type, c, r) {
  const tw = { type, c, r, x: c * TILE + TILE / 2, y: r * TILE + TILE / 2, lv: 0, cd: 0.3, aim: -Math.PI / 2,
    kick: 0, spawn: 0, mode: 'first', spent: TOWERS[type].cost, retT: 0, target: null, idleT: rand(0, 2),
    buff: 0, heat: 0, beamT: null, acc: 0, accT: 0, dir: 1, tube: 0 };
  if (type === 'rail') { tw.dir = bestRailDir(c, r, TOWERS.rail.lv[0].range); tw.aim = railAngle(tw.dir); }
  if (type === 'mint') tw.cd = TOWERS.mint.lv[0].every;
  G.towers.push(tw); G.grid[r * COLS + c] = tw; return tw;
}

// ---- Rail: fires down one fixed line (up / right / down / left) ----
const RAIL_DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const railAngle = d => Math.atan2(RAIL_DIRS[d][1], RAIL_DIRS[d][0]);
function railTiles(c, r, dir, range) {
  const out = [], [dx, dy] = RAIL_DIRS[dir];
  for (let k = 1; k <= Math.floor(range + 1e-6); k++) {
    const cc = c + dx * k, rr = r + dy * k;
    if (cc < 0 || rr < 0 || cc >= COLS || rr >= ROWS) break;
    out.push([cc, rr]);
  }
  return out;
}
function bestRailDir(c, r, range) {
  let best = 1, bv = -1;
  for (let d = 0; d < 4; d++) {
    const n = railTiles(c, r, d, range).filter(([cc, rr]) => MAP.tiles.has(rr * COLS + cc)).length;
    if (n > bv) { bv = n; best = d; }
  }
  return best;
}
function railVictims(tw) {
  const range = TOWERS.rail.lv[tw.lv].range * TILE, [ax, ay] = RAIL_DIRS[tw.dir], v = [];
  for (const e of G.enemies) {
    if (!e.alive || e.rc.flying || e.age < 0.15) continue;
    const px = e.x - tw.x, py = e.y - tw.y, along = px * ax + py * ay;
    if (along < 0 || along > range + e.rc.r) continue;
    if (Math.abs(px * ay - py * ax) <= e.rc.r + 6) v.push(e);
  }
  return v;
}
function fireRail(tw, victims) {
  const d = TOWERS.rail, L = d.lv[tw.lv], c = d.color, range = L.range * TILE, [ax, ay] = RAIL_DIRS[tw.dir];
  tw.cd = 1 / L.rate; tw.kick = 1;
  const mx = tw.x + ax * 14, my = tw.y + ay * 14;
  for (const e of victims) { FX.spark(e.x, e.y, c, 5, 200, 0.3); damage(e, L.dmg * (1 + tw.buff), { big: true }); }
  FX.line(mx, my, tw.x + ax * range, tw.y + ay * range, c, 0.34, 5);
  FX.flash(mx, my, 30, c, 0.15);
  addShake(0.1); snd('rail');
}

function buildTower(type, c, r) {

  addShake(0.12); snd('build'); vibrate(15);

}
function upgradeCost(tw) { const n = TOWERS[tw.type].lv[tw.lv + 1]; return n ? n.cost : null; }
function upgradeTower(tw) {

function sellValue(tw) { return Math.floor(tw.spent * ECON.sellRate); }
function sellTower(tw) {

function inRange(tw, e, range) {
  const rr = range + e.rc.r * 0.5;
  return (e.x - tw.x) ** 2 + (e.y - tw.y) ** 2 <= rr * rr;
}
function findTarget(tw, range) {
  let best = null, bestV = -Infinity;
  const air = !!TOWERS[tw.type].air;
  for (const e of G.enemies) {
    if (!e.alive || e.age < 0.15 || !!e.rc.flying !== air || !inRange(tw, e, range)) continue;
    const v = tw.mode === 'first' ? e.dist / e.path.len * 1e4 : tw.mode === 'strong' ? e.hp + e.shield : -((e.x - tw.x) ** 2 + (e.y - tw.y) ** 2);
    if (v > bestV) { bestV = v; best = e; }
  }
  return best;
}

function computeBuffs() {
  for (const t of G.towers) t.buff = 0;
  for (const b of G.towers) {
    if (b.type !== 'beacon' || b.spawn < 1) continue;
    const L = TOWERS.beacon.lv[b.lv];
    for (const t of G.towers) {
      if (t === b || TOWERS[t.type].support || TOWERS[t.type].eco) continue;
      if ((t.c - b.c) ** 2 + (t.r - b.r) ** 2 <= L.range * L.range + 1e-6) t.buff = Math.max(t.buff, L.buff);
    }
  }
}

function fire(tw, tg) {
  const d = TOWERS[tw.type], L = d.lv[tw.lv], c = d.color, boost = 1 + tw.buff;
  tw.cd = 1 / L.rate; tw.kick = 1;
  tw.aim = Math.atan2(tg.y - tw.y, tg.x - tw.x);
  const mx = tw.x + Math.cos(tw.aim) * 14, my = tw.y + Math.sin(tw.aim) * 14;
  if (tw.type === 'bolt') {
    const crit = Math.random() < d.crit;
    G.shots.push({ x: mx, y: my, tg, lx: tg.x, ly: tg.y, dmg: L.dmg * boost * (crit ? 2.5 : 1), crit, color: c, sp: 560, vx: 0, vy: 0 });
    FX.flash(mx, my, 14, c, 0.08);
    snd('bolt');
  } else if (tw.type === 'arc') {
    const pts = [{ x: tw.x, y: tw.y + 1 }], hit = new Set();
    let cur = tg, dmg = L.dmg * boost;
    for (let i = 0; i < L.chains && cur; i++) {
      hit.add(cur); pts.push({ x: cur.x, y: cur.y });
      FX.spark(cur.x, cur.y, c, 3, 140, 0.25);
      damage(cur, dmg, { color: c });
      dmg *= 0.85;
      let nxt = null, nd = (1.7 * TILE) ** 2;
      for (const e of G.enemies) {
        if (!e.alive || e.rc.flying || hit.has(e)) continue;
        const dd = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2;
        if (dd < nd) { nd = dd; nxt = e; }
      }
      cur = nxt;
    }
    FX.zap(pts, c, 0.17);
    snd('arc');
  } else if (tw.type === 'nova') {
    const flight = 0.75;
    const slow = tg.slowT > 0 ? 1 - tg.slowAmt : 1;
    const p = tg.path.at(tg.dist + tg.speed * slow * flight);
    G.shells.push({ sx: mx, sy: my, tx: p.x, ty: p.y, t: 0, dur: flight, dmg: L.dmg * boost, splash: L.splash * TILE, color: c });
    FX.flash(mx, my, 22, c, 0.12);
    for (let i = 0; i < 4; i++) FX.dot(mx, my, '#ffb47a', 3, 0.35, rand(-30, 30), rand(-30, 30));
    snd('launch');
  } else if (tw.type === 'frost') {
    const range = L.range * TILE;
    FX.ring(tw.x, tw.y, 6, range, c, 0.5, 3);
    FX.ring(tw.x, tw.y, 4, range * 0.6, '#ffffff', 0.35, 1.5);
    for (const e of G.enemies) {
      if (!e.alive || e.rc.flying || !inRange(tw, e, range)) continue;
      e.slowT = 1.3; e.slowAmt = Math.max(e.slowAmt, L.slow); if (L.brittle) e.brittle = true;
      for (let i = 0; i < 2; i++) FX.dot(e.x + rand(-6, 6), e.y + rand(-6, 6), '#dfe8ff', 2.2, 0.4, 0, -20);
      damage(e, L.dmg * boost, { pierce: true, quiet: true });
    }
    snd('frost');
  } else if (tw.type === 'emp') {
    const range = L.range * TILE;
    FX.ring(tw.x, tw.y, 6, range, c, 0.45, 3.5);
    FX.ring(tw.x, tw.y, 4, range * 0.55, '#ffffff', 0.3, 1.5);
    let zaps = 0;
    for (const e of G.enemies) {
      if (!e.alive || e.rc.flying || !inRange(tw, e, range)) continue;
      if (zaps++ < 3 && Math.random() < 0.5) FX.zap([{ x: tw.x, y: tw.y }, { x: e.x, y: e.y }], c, 0.1);
      damage(e, L.dmg * boost, { pierce: true, quiet: true });
    }
    snd('emp');
  } else if (tw.type === 'flak') {
    tw.tube ^= 1;
    const sd = tw.tube ? 3.2 : -3.2, sx = mx - Math.sin(tw.aim) * sd, sy = my + Math.cos(tw.aim) * sd;
    G.missiles.push({ x: sx, y: sy, vx: Math.cos(tw.aim) * 150, vy: Math.sin(tw.aim) * 150, tg, dmg: L.dmg * boost, splash: L.splash * TILE, color: c, t: 0 });
    FX.flash(sx, sy, 16, c, 0.1);
    snd('flak');
  }
}

// ------------------------------------------------------ damage & death
function damage(e, amt, o = {}) {
  if (!e.alive) return;
  if (e.rc.armor && !o.pierce) amt = Math.max(amt * 0.3, amt - e.rc.armor);
  if (e.brittle) amt *= 1.2;
  e.lastHit = G.time; e.flash = 0.07;
  const dm = o.throughShield || e.rc.flying ? null : domeOver(e);
  if (dm) {                                 // inside an Aegis dome: the dome soaks the hit first
    const hit = amt * SHIELD_FACTOR;
    dm.domePing = 0.15; dm.domeHit = G.time;
    if (hit < dm.dome) {
      dm.dome -= hit;
      if (!o.quiet && Math.random() < 0.4) FX.text(e.x + rand(-6, 6), e.y - e.rc.r - 4, `${Math.max(1, Math.round(hit))}`, '#8fc8ff', 9, { life: 0.45 });
      if (Math.random() < 0.3) FX.spark(e.x, e.y, '#9fd6ff', 2, 90, 0.2);
      return;
    }
    amt -= dm.dome / SHIELD_FACTOR; domeShatter(dm, false);
    if (amt <= 0) return;
  }
  if (e.shield > 0 && !o.throughShield) {
    const hit = amt * SHIELD_FACTOR;
    e.shieldPing = 0.15;
    if (hit < e.shield) {                  // the shield soaks it up
      e.shield -= hit;
      if (!o.quiet && Math.random() < 0.5) FX.text(e.x + rand(-6, 6), e.y - e.rc.r - 4, `${Math.max(1, Math.round(hit))}`, '#8fc8ff', 9, { life: 0.45 });
      if (Math.random() < 0.4) FX.spark(e.x, e.y, '#9fd6ff', 2, 90, 0.2);
      return;
    }
    amt -= e.shield / SHIELD_FACTOR;
    shieldShatter(e);
    if (amt <= 0) return;
  }
  e.hp -= amt; e.punch = Math.min(0.4, e.punch + 0.16);
  if (!o.quiet) {
    const n = Math.max(1, Math.round(amt));
    if (o.crit) FX.text(e.x + rand(-5, 5), e.y - e.rc.r - 6, `${n}!`, '#fff36a', 15, { life: 0.8, vy: -55 });
    else {                                  // small hits add up into one number every ~0.15s per enemy
      e.numAcc = (e.numAcc || 0) + amt;
      if (o.big || G.time - (e.numT || -9) >= 0.15) {
        FX.text(e.x + rand(-6, 6), e.y - e.rc.r - 4, `${Math.max(1, Math.round(e.numAcc))}`, o.big ? '#ffd0a8' : 'rgba(235,235,255,0.9)', o.big ? 13 : 10, { life: 0.6 });
        e.numAcc = 0; e.numT = G.time;
      }
    }
  }
  if (e.hp <= 0) kill(e);
}

const MILESTONES = { 10: 'NICE', 25: 'AWESOME', 50: 'UNREAL', 100: 'LEGENDARY', 200: 'GODLIKE' };
function shieldShatter(e) {
  e.shield = 0;
  FX.shards(e.x, e.y, '#9fd6ff', 12, 180, 3.5); FX.ring(e.x, e.y, e.rc.r, e.rc.r * 3, '#9fd6ff', 0.35, 2);
  snd('shield');
}
function domeOver(e) {
  for (const a of G.domes) {
    if (!a.alive || a.dome <= 0) continue;
    const R = a.rc.dome.r * TILE;
    if ((e.x - a.x) ** 2 + (e.y - a.y) ** 2 <= R * R) return a;
  }
  return null;
}
function domeShatter(a, byEmp) {
  const R = a.rc.dome.r * TILE;
  a.dome = 0; if (byEmp) a.domeDead = true;
  FX.ring(a.x, a.y, R * 0.9, R * 1.4, '#9fd6ff', 0.45, 3); FX.shards(a.x, a.y, '#9fd6ff', 18, 220, 3.5);
  if (a.alive) FX.text(a.x, a.y - R * 0.6, tr('dome_down'), '#9fd6ff', 10, { font: FONT_D, life: 0.8 });
  snd('shield'); addShake(0.06);
}
// EMP field: any shield that crosses it is stripped for good (personal shields and whole domes)
function empField(tw, range) {
  const c = TOWERS.emp.color;
  for (const e of G.enemies) {
    if (!e.alive || e.rc.flying) continue;
    let zap = false;
    if (e.shieldMax > 0 && inRange(tw, e, range)) {
      e.shield = 0; e.shieldMax = 0; zap = true;
      FX.shards(e.x, e.y, '#9fd6ff', 10, 170, 3); FX.ring(e.x, e.y, e.rc.r, e.rc.r * 3, '#9fd6ff', 0.35, 2);
      FX.text(e.x, e.y - e.rc.r - 8, tr('stripped'), '#9fd6ff', 9, { font: FONT_D, life: 0.6 });
    }
    if (e.domeMax > 0 && !e.domeDead && inRange(tw, e, range + e.rc.dome.r * TILE * 0.5)) { domeShatter(e, true); zap = true; }
    if (zap) {
      FX.zap([{ x: tw.x, y: tw.y }, { x: e.x, y: e.y }], c, 0.2); tw.kick = 1;
      if (G.time - (G.stripSnd || 0) > 0.1) { G.stripSnd = G.time; snd('emp'); }
    }
  }
}

function kill(e) {
  if (e.dome > 0) domeShatter(e, false);
  e.alive = false; G.kills++;
  waveStat(e.wave).alive--;
  const big = !!e.rc.boss;
  FX.shatter(e.x, e.y, e.rc.color, e.rc.r, big || e.rc.r >= 17);
  G.combo = G.comboT > 0 ? G.combo + 1 : 1; G.comboT = 1.6; G.comboPop = 1;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  snd('kill', G.combo);
  if (!G.noBounty) {
    G.gold += e.rc.gold;
    spawnCoins(e.x, e.y, big ? 18 : Math.min(5, Math.ceil(e.rc.gold / 3)));
  }
  const m = MILESTONES[G.combo];
  if (m) {
    const bonus = G.noBounty ? 0 : Math.floor(G.combo / 2);
    G.gold += bonus;
    G.shout = { text: tr('m_' + G.combo), sub: bonus ? tr('combo_gold', G.combo, bonus) : tr('combo_only', G.combo), color: `hsl(${(190 + G.combo * 9) % 360},100%,65%)`, t: 0, dur: 1.3 };
    snd('combo', Object.keys(MILESTONES).indexOf(String(G.combo)));
    addShake(0.15);
  }
  addShake(big ? 0.9 : e.rc.r > 12 ? 0.15 : 0.04);
  if (e.rc.split) {
    for (let i = 0; i < e.rc.split.n; i++) {
      const m2 = spawnEnemy(e.rc.split.type, e.wave, e.lane, Math.max(0, e.dist - i * 9), 1);
      m2.x = e.x; m2.y = e.y;
    }
  }
  if (big) {
    G.slowT = 0.9; G.flashA = 0.6; G.flashCol = '#ffffff';
    snd('bossDie'); vibrate([60, 40, 120]);
    FX.shatter(e.x, e.y, '#ffffff', 16, false);
    G.shout = { text: tr('shattered'), sub: G.noBounty ? tr('warden_down') : tr('warden_down_gold', e.rc.gold), color: e.rc.color, t: 0, dur: 1.6 };
    Sound.setBoss(bossAlive());
  }
}

function flakBurst(m) {
  for (const e of G.enemies) {
    if (!e.alive || !e.rc.flying) continue;
    const d = Math.hypot(e.x - m.x, e.y - 5 - m.y);
    if (d <= m.splash + e.rc.r * 0.5) damage(e, e === m.tg ? m.dmg : m.dmg * 0.6, {});
  }
  FX.flash(m.x, m.y, m.splash * 1.8, m.color, 0.2);
  FX.ring(m.x, m.y, 3, m.splash, m.color, 0.3, 2.5);
  FX.spark(m.x, m.y, '#ffd0c8', 7, 180, 0.3);
  snd('flakHit');
}

function leak(e) {
  e.alive = false; waveStat(e.wave).alive--;
  const { x, y } = MAP.core;
  FX.shatter(x, y, '#ff3b4f', 10, false);
  if (G.demo) return;
  G.lives = Math.max(0, G.lives - e.rc.leak); G.leaks += e.rc.leak;
  G.leakTypes[e.type] = (G.leakTypes[e.type] || 0) + e.rc.leak;
  if (e.shieldMax > 0 || e.domeMax > 0 || domeOver(e)) G.shieldLeaks += e.rc.leak;
  G.coreHit = 1; G.livesBump = 1; G.flashA = 0.35; G.flashCol = '#ff2e4d';
  G.comboT = 0;
  addShake(0.45); snd('leak'); vibrate(80);
  FX.text(x, y - 30, `-${e.rc.leak}`, '#ff5a6a', 18, { font: FONT_D, life: 1 });
  if (G.lives <= 0) endGame(false);
}

function endGame(win) {
  if (G.over) return;
  G.over = true; G.result = win ? 'win' : 'lose'; G.endT = win ? 1.4 : 2.0; G.menu = null;
  G.stars = win ? starsForLives(G.lives, G.maxLives) : 0;
  Sound.musicOff();
  if (G.demo) return;
  const n = G.levelNum, wasMax = Save.d.max;
  const r = Save.complete(n, G.stars);
  G.firstClear = r.first; G.prevStars = r.prev;
  G.unlockedTower = r.first && Save.d.max > wasMax ? TOWER_ORDER.find(t => TOWERS[t].unlock === Save.d.max) || null : null;
  G.unlockedSlot = r.first && Save.d.max === SLOT_UNLOCK_LEVEL && wasMax < SLOT_UNLOCK_LEVEL;
  if (r.first) G.mapAnim = { level: Save.d.max, t: 0 };
  if (win) {
    snd('win');
    for (let i = 0; i < 6; i++) setTimeout(() => {
      const x = rand(40, W - 40), y = rand(60, ROWS * TILE - 80), c = ['#2ef2ff', '#ffe23d', '#ff7a2e', '#a3b8ff', '#ff3d9a', '#8cff3d'][i];
      FX.shatter(x, y, c, 14, false); FX.ring(x, y, 4, 80, c, 0.8, 3); Sound.play('boom', false);
    }, i * 220);
  } else {
    const { x, y } = MAP.core;
    FX.shatter(x, y, '#ff2e4d', 26, true); FX.shatter(x, y, '#bff8ff', 14, true);
    G.slowT = 1.2; G.flashA = 0.7; G.flashCol = '#ff2e4d'; addShake(1);
    snd('lose'); vibrate([100, 60, 200]);
  }
}

function spawnCoins(wx, wy, n) {
  for (let i = 0; i < n; i++) {
    if (G.coins.length > 70) break;
    G.coins.push({ x: MAP_X + wx, y: MAP_Y + wy, vx: rand(-90, 90), vy: rand(-190, -70), t: -i * 0.025 });
  }
}

// ------------------------------------------------------------- update
function update(dt) {
  G.time += dt;
  if (G.over) return;
  if (G.demo) {
    G.demoT -= dt;
    if (G.demoT <= 0 && G.enemies.length < 14) {
      const pool = ['grunt', 'grunt', 'scout', 'scout', 'brute', 'splitter', 'aegis', 'blink', 'mender', 'titan'];
      spawnEnemy(pool[Math.floor(Math.random() * pool.length)], 3);
      G.demoT = rand(0.35, 0.9);
    }
  }
  // wave spawners
  for (let i = G.spawners.length - 1; i >= 0; i--) {
    const sp = G.spawners[i]; sp.t += dt;
    while (sp.i < sp.list.length && sp.list[sp.i].at <= sp.t) {
      const s = sp.list[sp.i];
      spawnEnemy(s.type, sp.wave, s.lane); sp.i++; waveStat(sp.wave).toSpawn--;
    }
    if (sp.i >= sp.list.length) {
      G.spawners.splice(i, 1);
      if (sp.wave === G.waveNum && G.waveNum < G.waves.length && !G.demo) G.nextTimer = ECON.nextDelay;
    }
  }
  if (G.nextTimer !== null) { G.nextTimer -= dt; if (G.nextTimer <= 0) startWave(false); }
  G.musT = (G.musT || 0) - dt;
  if (G.musT <= 0 && !G.demo) { G.musT = 0.25; Sound.setIntensity(musicIntensity()); }
  // enemies
  G.domes = G.enemies.filter(a => a.alive && a.domeMax > 0);
  for (const e of G.enemies) {
    if (!e.alive) continue;
    e.age += dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) { e.slowAmt = 0; e.brittle = false; } }
    const sl = e.slowT > 0 ? 1 - e.slowAmt : 1;
    e.dist += e.speed * sl * dt;
    // Blink: teleport ahead
    let warped = false;
    if (e.rc.blink && e.age > 0.8) {
      e.warpT -= dt;
      if (e.warpT <= 0) {
        e.warpT = e.rc.blink.every * rand(0.8, 1.2);
        const nd = Math.min(e.path.len - 30, e.dist + e.rc.blink.dist * TILE);
        if (nd > e.dist) {
          FX.flash(e.x, e.y, 26, e.rc.color, 0.25); FX.ring(e.x, e.y, 3, 18, e.rc.color, 0.3, 2);
          for (let i = 0; i < 5; i++) FX.dot(e.x + rand(-5, 5), e.y + rand(-5, 5), e.rc.color, 2, 0.4);
          e.dist = nd; warped = true; snd('blink');
        }
      }
    }
    if (e.dist >= e.path.len) { leak(e); continue; }
    const p = e.path.at(e.dist);
    const k = e.off && !warped ? Math.min(1, dt * 10) : 1;
    e.x = lerp(e.x, p.x, k); e.y = lerp(e.y, p.y, k);
    if (warped) { FX.flash(e.x, e.y, 30, e.rc.color, 0.25); FX.ring(e.x, e.y, 18, 3, '#ffffff', 0.25, 2); }
    let da = p.ang - e.dir; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    e.dir += da * Math.min(1, dt * 12);
    e.rot += (e.rc.spin || 0) * dt; if (e.rc.inner) e.rot2 += e.rc.inner.spin * dt;
    e.flash -= dt; e.punch = Math.max(0, e.punch - dt * 2.5);
    e.blinkT -= dt; if (e.blinkT <= 0) { e.blink = 0.12; e.blinkT = rand(2, 5); } if (e.blink > 0) e.blink -= dt;
    if (e.rc.trail) { e.trailT -= dt; if (e.trailT <= 0) { e.trailT = QUALITY.fx < 1 ? 0.12 : 0.07; FX.dot(e.x, e.y, e.rc.color, 2.2, 0.25); } }
    if (e.slowT > 0 && Math.random() < dt * 6) FX.dot(e.x + rand(-8, 8), e.y + rand(-8, 8), '#dfe8ff', 1.6, 0.35, 0, -15);
    // shields regrow when left alone (never after an EMP has stripped them)
    if (e.shieldPing > 0) e.shieldPing -= dt;
    if (e.shieldMax && e.shield < e.shieldMax && G.time - e.lastHit > 2) e.shield = Math.min(e.shieldMax, e.shield + e.shieldMax * 0.35 * dt);
    if (e.domeMax) {
      if (e.domePing > 0) e.domePing -= dt;
      if (!e.domeDead && e.dome < e.domeMax && G.time - e.domeHit > 3) {
        const was = e.dome; e.dome = Math.min(e.domeMax, e.dome + e.domeMax * 0.3 * dt);
        if (was <= 0) FX.ring(e.x, e.y, 6, e.rc.dome.r * TILE, '#9fd6ff', 0.4, 2);
      }
    }
    // Mender: heal pulse
    if (e.rc.heal) {
      e.healT -= dt;
      if (e.healT <= 0) {
        e.healT = e.rc.heal.every;
        const R2 = (e.rc.heal.radius * TILE) ** 2;
        let healed = 0;
        for (const o of G.enemies) {
          if (!o.alive || o.hp >= o.maxHp || (o.x - e.x) ** 2 + (o.y - e.y) ** 2 > R2) continue;
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * e.rc.heal.pct); healed++;
          FX.text(o.x, o.y - o.rc.r - 6, '+', e.rc.color, 14, { life: 0.5 });
        }
        FX.ring(e.x, e.y, 4, e.rc.heal.radius * TILE, e.rc.color, 0.55, 2.5);
        if (healed) snd('heal');
      }
    }
  }
  // towers
  computeBuffs();
  for (const tw of G.towers) {
    tw.cd -= dt; tw.kick = Math.max(0, tw.kick - dt * 5); tw.spawn = Math.min(1, tw.spawn + dt * 4);
    const d = TOWERS[tw.type];
    if (d.eco) {
      if (G.awaiting || G.waveNum === 0 || G.demo) tw.cd += dt;          // only pays while waves run
      else if (tw.cd <= 0 && tw.spawn >= 1) mintPulse(tw);
      continue;
    }
    if (d.support) continue;
    if (tw.type === 'rail') {
      tw.aim = railAngle(tw.dir);
      if (tw.cd <= 0 && tw.spawn >= 1) { const v = railVictims(tw); if (v.length) fireRail(tw, v); }
      continue;
    }
    const range = towerRange(tw);
    if (tw.type === 'emp' && tw.spawn >= 1) empField(tw, range);
    tw.retT -= dt;
    const sticky = tw.type === 'prism' && tw.target && tw.target.alive && inRange(tw, tw.target, range);
    if (!sticky && (tw.retT <= 0 || !tw.target || !tw.target.alive)) { tw.target = findTarget(tw, range); tw.retT = 0.1; }
    const tg = tw.target;
    if (tg && tw.type !== 'frost' && tw.type !== 'arc') {
      const want = Math.atan2(tg.y - tw.y, tg.x - tw.x);
      let da = want - tw.aim; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      tw.aim += da * Math.min(1, dt * 14);
    }
    if (tw.type === 'prism') {
      const L = d.lv[tw.lv];
      if (tg && tg.alive && inRange(tw, tg, range) && tw.spawn >= 1) {
        if (tw.beamT !== tg) { tw.beamT = tg; tw.heat = 0; }
        tw.heat = Math.min(1, tw.heat + dt / 2.5);
        const dmg = L.dps * (1 + (L.heat - 1) * tw.heat) * (1 + tw.buff) * dt;
        tw.acc += dmg; tw.accT -= dt;
        if (tw.accT <= 0) { if (tw.acc >= 1) FX.text(tg.x + rand(-5, 5), tg.y - tg.rc.r - 5, `${Math.round(tw.acc)}`, '#ffb3f7', 10 + tw.heat * 4, { life: 0.5 }); tw.acc = 0; tw.accT = 0.3; }
        if (Math.random() < dt * 25) FX.spark(tg.x, tg.y, d.color, 1, 140, 0.2);
        snd('beam', tw.heat);
        damage(tg, dmg, { pierce: true, quiet: true, throughShield: true });
      } else { tw.beamT = null; tw.heat = Math.max(0, tw.heat - dt * 2); }
      continue;
    }
    if (tg && tw.cd <= 0 && tw.spawn >= 1) fire(tw, tg);
    if (tw.type === 'arc') { tw.idleT -= dt; if (tw.idleT <= 0) { tw.idleT = rand(0.4, 1.4); FX.zap([{ x: tw.x, y: tw.y + 1 }, { x: tw.x + rand(-13, 13), y: tw.y + rand(-13, 13) }], '#ffe23d', 0.08); } }
  }
  // bolts
  for (let i = G.shots.length - 1; i >= 0; i--) {
    const s = G.shots[i];
    if (s.tg.alive) { s.lx = s.tg.x; s.ly = s.tg.y; }
    const dx = s.lx - s.x, dy = s.ly - s.y, dd = Math.hypot(dx, dy), step = s.sp * dt;
    if (dd <= step + (s.tg.alive ? s.tg.rc.r * 0.6 : 2)) {
      if (s.tg.alive) {
        damage(s.tg, s.dmg, { crit: s.crit });
        FX.spark(s.lx, s.ly, s.color, s.crit ? 7 : 3, s.crit ? 220 : 140, 0.22);
        if (s.crit) { FX.flash(s.lx, s.ly, 26, '#fff36a', 0.12); snd('crit'); } else snd('hit');
      }
      G.shots.splice(i, 1); continue;
    }
    s.vx = dx / dd * s.sp; s.vy = dy / dd * s.sp; s.x += s.vx * dt; s.y += s.vy * dt;
  }
  // nova shells
  for (let i = G.shells.length - 1; i >= 0; i--) {
    const s = G.shells[i]; s.t += dt;
    const f = Math.min(1, s.t / s.dur);
    s.x = lerp(s.sx, s.tx, f); s.y = lerp(s.sy, s.ty, f); s.h = Math.sin(Math.PI * f) * 46;
    if (Math.random() < 0.7) FX.dot(s.x, s.y - s.h, '#ff9a5c', 2.4, 0.3);
    if (f >= 1) {
      G.shells.splice(i, 1);
      for (const e of G.enemies) {
        if (!e.alive || e.rc.flying) continue;
        const d = Math.hypot(e.x - s.tx, e.y - s.ty);
        if (d <= s.splash + e.rc.r * 0.5) damage(e, s.dmg * (1 - 0.4 * Math.min(1, d / s.splash)), { pierce: true, big: true });
      }
      FX.flash(s.tx, s.ty, s.splash * 2.2, s.color, 0.3);
      FX.ring(s.tx, s.ty, 4, s.splash, s.color, 0.4, 4);
      FX.ring(s.tx, s.ty, 2, s.splash * 0.55, '#ffffff', 0.25, 2);
      FX.spark(s.tx, s.ty, '#ffc08a', 12, 240, 0.4);
      FX.shards(s.tx, s.ty, s.color, 6, 160, 3);
      addShake(0.16); snd('boom', false);
    }
  }
  // FLAK missiles: home in on flyers, burst with a small anti-air splash
  for (let i = G.missiles.length - 1; i >= 0; i--) {
    const m = G.missiles[i]; m.t += dt;
    if (!m.tg || !m.tg.alive) {
      m.tg = null; let bd = 130 * 130;
      for (const e of G.enemies) if (e.alive && e.rc.flying) { const dd = (e.x - m.x) ** 2 + (e.y - m.y) ** 2; if (dd < bd) { bd = dd; m.tg = e; } }
    }
    const sp = Math.min(430, 150 + m.t * 700);
    if (m.tg) {
      const dx = m.tg.x - m.x, dy = m.tg.y - 5 - m.y, dd = Math.hypot(dx, dy);
      if (dd < m.tg.rc.r + 6) { flakBurst(m); G.missiles.splice(i, 1); continue; }
      let cur = Math.atan2(m.vy, m.vx), da = Math.atan2(dy, dx) - cur;
      while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      cur += clamp(da, -10 * dt, 10 * dt);
      m.vx = Math.cos(cur) * sp; m.vy = Math.sin(cur) * sp;
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (Math.random() < 0.85) FX.dot(m.x, m.y, '#ffb3aa', 1.8, 0.3);
    if (m.t > 2.2) { FX.spark(m.x, m.y, m.color, 4, 120, 0.25); G.missiles.splice(i, 1); }
  }
  if (G.enemies.some(e => !e.alive)) G.enemies = G.enemies.filter(e => e.alive);
  if (!G.demo) {
    for (let w = 1; w <= G.waveNum; w++) {
      const ws = G.waveStats[w];
      if (ws && !ws.cleared && ws.toSpawn <= 0 && ws.alive <= 0) {
        ws.cleared = true;
        if (G.waveNum === G.waves.length && Object.values(G.waveStats).every(s => s.cleared)) { endGame(true); break; }
        const b = G.noBounty ? 0 : ECON.clearBonus(w);
        G.gold += b; G.goldBump = 1;
        G.toast = { text: b ? tr('wave_clear_gold', w, b) : tr('wave_clear', w), color: '#7dffb0', t: 0, dur: 1.6 };
        snd('clear');
      }
    }
  }
  if (G.comboT > 0) G.comboT -= dt;
}

// visual-only timers that should run even when the sim is paused/over
function updateVisuals(dt, rdt) {
  FX.update(dt);
  G.shake = Math.max(0, G.shake - rdt * 1.8);
  G.flashA = Math.max(0, G.flashA - rdt * 1.6);
  G.coreHit = Math.max(0, G.coreHit - rdt * 3);
  G.portalPulse = Math.max(0, G.portalPulse - rdt * 4);
  G.goldBump = Math.max(0, G.goldBump - rdt * 5);
  G.livesBump = Math.max(0, G.livesBump - rdt * 3);
  G.comboPop = Math.max(0, G.comboPop - rdt * 5);
  G.dispGold += (G.gold - G.dispGold) * Math.min(1, rdt * 12);
  if (Math.abs(G.gold - G.dispGold) < 0.5) G.dispGold = G.gold;
  for (const k of ['banner', 'toast', 'shout']) { const b = G[k]; if (b) { b.t += rdt; if (b.t >= b.dur) G[k] = null; } }
  const tx = MAP_X + 20, ty = HUD_H / 2;
  for (let i = G.coins.length - 1; i >= 0; i--) {
    const c = G.coins[i]; c.t += rdt;
    if (c.t < 0) continue;
    if (c.t < 0.3) { c.vy += 620 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; }
    else {
      const k = Math.min(1, rdt * (5 + (c.t - 0.3) * 30));
      c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
      if (Math.hypot(tx - c.x, ty - c.y) < 7 || c.t > 1.6) {
        G.coins.splice(i, 1);
        G.goldBump = 1; snd('coin');
      }
    }
  }
}
// =====================================================================
//  WORLD RENDER (map space)
// =====================================================================
function layout() {
  const rect = cvs.getBoundingClientRect();
  const vw = Math.max(1, rect.width), vh = Math.max(1, rect.height);
  DPR = Math.min(2, window.devicePixelRatio || 1, QUALITY.dpr);
  glyphCache.clear(); textCache.clear(); if (typeof glowTextCache !== 'undefined') glowTextCache.clear();   // sprites are per pixel density
  cvs.width = Math.round(vw * DPR); cvs.height = Math.round(vh * DPR);
  SCALE = Math.min(vw / W, vh / MIN_H);
  LW = vw / SCALE; LH = vh / SCALE;
  MAP_X = (LW - W) / 2;
  const avail = LH - HUD_H - BAR_H;
  MAP_Y = HUD_H + Math.max(0, (avail - ROWS * TILE) / 2);
  buildBackground(theme());
}

let drawMenuUnder = null;   // hook: the UI draws range previews under towers

function drawWorld() {
  const th = theme(), k = DPR * SCALE;
  const sh = G.shake * G.shake * 10, sx = rand(-sh, sh), sy = rand(-sh, sh);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.drawImage(bgCanvas, sx * k, sy * k);
  ctx.setTransform(k, 0, 0, k, (MAP_X + sx) * k, (MAP_Y + sy) * k);

  drawPathFlow(th, G.time);
  if ((G.level && G.level.air) || G.enemies.some(e => e.rc.flying)) drawFlightLines(G.time);
  drawPortals(G.time, G.portalPulse);
  drawCore(G.time, G.demo ? G.maxLives : G.lives, G.maxLives, G.coreHit);
  if (drawMenuUnder) drawMenuUnder();

  // beacon links
  for (const b of G.towers) {
    if (b.type !== 'beacon') continue;
    const L = TOWERS.beacon.lv[b.lv];
    for (const t of G.towers) {
      if (t === b || t.buff <= 0 || (t.c - b.c) ** 2 + (t.r - b.r) ** 2 > L.range * L.range + 1e-6) continue;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y);
      ctx.setLineDash([2, 5]); ctx.lineDashOffset = -G.time * 20;
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(244,240,255,0.45)'; ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for (const tw of G.towers) {
    const sp = tw.spawn;
    const charge = tw.type === 'mint' && !G.awaiting && G.waveNum > 0 ? 1 - clamp(tw.cd / TOWERS.mint.lv[tw.lv].every, 0, 1) : null;
    drawTowerGlyph(tw.type, tw.x, tw.y, { lv: tw.lv, aim: tw.aim, kick: tw.kick, t: G.time, heat: tw.heat, charge, scale: 1 + (1 - easeOut(sp)) * 0.8, alpha: Math.min(1, sp * 1.5) });
    if (tw.buff > 0) { ctx.beginPath(); ctx.arc(tw.x + 12, tw.y - 12, 3, 0, TAU); ctx.fillStyle = '#f4f0ff'; ctx.fill(); }
  }
  // nova shell shadows
  for (const s of G.shells) {
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 6 * (1 - s.h / 70), 3 * (1 - s.h / 70), 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  }
  // Aegis domes: a soft bubble that travels with the Aegis (drawn under the enemies)
  for (const a of G.enemies) {
    if (!a.alive || !a.domeMax || a.domeDead) continue;
    const f = a.dome / a.domeMax;
    const R = a.rc.dome.r * TILE * (a.age < 0.4 ? easeOutBack(a.age / 0.4) : 1), ping = Math.max(0, a.domePing || 0) * 6;
    if (f <= 0) {                                           // broken: faint outline while it regrows
      ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(a.x, a.y, R, 0, TAU);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(159,214,255,0.25)'; ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    const gr = ctx.createRadialGradient(a.x, a.y, R * 0.2, a.x, a.y, R);
    gr.addColorStop(0, 'rgba(74,168,255,0)'); gr.addColorStop(0.75, hexA('#4aa8ff', 0.06 + 0.08 * f + ping * 0.05)); gr.addColorStop(1, hexA('#9fd6ff', 0.18 + 0.2 * f + ping * 0.1));
    ctx.beginPath(); ctx.arc(a.x, a.y, R, 0, TAU); ctx.fillStyle = gr; ctx.fill();
    ctx.lineWidth = 1.2 + 1.8 * f + ping; ctx.strokeStyle = hexA(ping > 0 ? '#ffffff' : '#9fd6ff', 0.35 + 0.5 * f); ctx.stroke();
    // slowly turning hex rim, so it reads as a force field rather than a range circle
    const t = G.time * 0.6 + a.id;
    ctx.lineWidth = 1; ctx.strokeStyle = hexA('#9fd6ff', 0.25 + 0.35 * f);
    for (let i = 0; i < 12; i++) {
      const an = t + i * TAU / 12;
      polyPath(a.x + Math.cos(an) * R * 0.86, a.y + Math.sin(an) * R * 0.86, 4.5, 6, an); ctx.stroke();
    }
  }
  // all ground-enemy glows in one additive pass, then the bodies
  additive(true);
  for (const e of G.enemies) {
    if (e.rc.flying) continue;
    const sc = (e.age < 0.3 ? easeOutBack(e.age / 0.3) : 1) * (1 + e.punch * 0.5);
    if (sc > 0.01) glow(e.x, e.y, e.rc.r * sc * (e.rc.boss ? 3.4 : 3.0), e.rc.color, e.rc.boss ? 0.8 : 0.7);
  }
  additive(false);
  for (const e of G.enemies) {
    const sp = e.age < 0.3 ? easeOutBack(e.age / 0.3) : 1;
    drawGlyph(e.rc, e.x, e.y, { rot: e.rot, rot2: e.rot2, scale: sp * (1 + e.punch * 0.5), flash: e.flash, dir: e.dir, t: G.time + e.id, blink: e.blink > 0, frozen: e.slowT > 0, shield: e.shieldMax ? e.shield / e.shieldMax : 0, ping: e.shieldPing, fast: true, noGlow: !e.rc.flying });
    if (e.hp < e.maxHp && !e.rc.boss) {
      const w = Math.max(14, e.rc.r * 2.2), f = Math.max(0, e.hp / e.maxHp), y = e.y - e.rc.r - 7;
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(e.x - w / 2 - 1, y - 1, w + 2, 4);
      ctx.fillStyle = e.rc.color; ctx.fillRect(e.x - w / 2, y, w * f, 2);
    }
  }
  // prism beams
  additive(true);
  ctx.lineCap = 'round';
  for (const tw of G.towers) {
    const tg = tw.beamT;
    if (tw.type !== 'prism' || !tg || !tg.alive) continue;
    const h = tw.heat, c = TOWERS.prism.color, fl = 0.8 + Math.random() * 0.2;
    ctx.beginPath(); ctx.moveTo(tw.x, tw.y); ctx.lineTo(tg.x, tg.y);
    ctx.globalAlpha = 0.3 * fl; ctx.lineWidth = 6 + h * 8; ctx.strokeStyle = c; ctx.stroke();
    ctx.globalAlpha = fl; ctx.lineWidth = 2 + h * 3; ctx.stroke();
    ctx.lineWidth = 1 + h; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.globalAlpha = 1;
    glow(tg.x, tg.y, 12 + h * 12, c, 0.8);
  }
  ctx.lineCap = 'butt';
  // bolts
  for (const s of G.shots) {
    const n = Math.hypot(s.vx, s.vy) || 1, bx = s.x - s.vx / n * (s.crit ? 16 : 11), by = s.y - s.vy / n * (s.crit ? 16 : 11);
    const c = s.crit ? '#fff36a' : s.color;
    glow(s.x, s.y, s.crit ? 14 : 9, c, 0.8);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(s.x, s.y);
    ctx.lineWidth = s.crit ? 4 : 3; ctx.strokeStyle = c; ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.lineCap = 'butt';
  }
  for (const m of G.missiles) {
    const a = Math.atan2(m.vy, m.vx), cx = Math.cos(a), cy = Math.sin(a);
    glow(m.x, m.y, 11, m.color, 0.8);
    ctx.beginPath(); ctx.moveTo(m.x + cx * 5, m.y + cy * 5); ctx.lineTo(m.x - cx * 4 - cy * 2.5, m.y - cy * 4 + cx * 2.5); ctx.lineTo(m.x - cx * 4 + cy * 2.5, m.y - cy * 4 - cx * 2.5); ctx.closePath();
    ctx.fillStyle = '#ffe4e0'; ctx.fill();
  }
  for (const s of G.shells) {
    const y = s.y - s.h;
    glow(s.x, y, 16, s.color, 0.9);
    ctx.beginPath(); ctx.arc(s.x, y, 3.2, 0, TAU); ctx.fillStyle = '#fff4e0'; ctx.fill();
  }
  additive(false);
  FX.draw();
}

function drawCoins() {
  for (const c of G.coins) if (c.t >= 0) drawCoin(c.x, c.y, 4.2, 1);
}

// Air Raid levels: dotted flight lines from each portal straight to the core
function drawFlightLines(t) {
  ctx.save();
  for (const f of MAP.flights) {
    const a = f.start, b = f.end, ang = Math.atan2(b.y - a.y, b.x - a.x), len = f.len;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.setLineDash([2, 8]); ctx.lineDashOffset = -t * 25;
    ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(159,232,255,0.35)'; ctx.stroke(); ctx.setLineDash([]);
    for (let d = (t * 40) % 60; d < len - 20; d += 60) {         // drifting chevrons show the direction

// Tile-based range preview: every square the tower can reach lights up.
// Lanes (where enemies walk) light up brighter. `skip` hides tiles inside a smaller range.
function gridRange(c0, r0, range, color, o = {}) {
  const inR = (c, r, rg) => c >= 0 && r >= 0 && c < COLS && r < ROWS && (c - c0) ** 2 + (r - r0) ** 2 <= rg * rg + 1e-6;
  const pulse = 0.8 + Math.sin(G.clock * 4) * 0.2;
  const lo = Math.ceil(range);
  for (let r = r0 - lo; r <= r0 + lo; r++) for (let c = c0 - lo; c <= c0 + lo; c++) {
    if (!inR(c, r, range) || (c === c0 && r === r0)) continue;
    if (o.skip != null && inR(c, r, o.skip)) continue;
    const lane = MAP.tiles.has(r * COLS + c);
    ctx.fillStyle = hexA(color, (lane ? 0.34 : 0.11) * pulse);
    roundRect(c * TILE + 2, r * TILE + 2, TILE - 4, TILE - 4, 5); ctx.fill();
    if (lane) { ctx.lineWidth = 1; ctx.strokeStyle = hexA(color, 0.55 * pulse); ctx.stroke(); }
  }
  ctx.beginPath();
  for (let r = r0 - lo; r <= r0 + lo; r++) for (let c = c0 - lo; c <= c0 + lo; c++) {
    if (!inR(c, r, range)) continue;
    const x = c * TILE, y = r * TILE;
    if (!inR(c, r - 1, range)) { ctx.moveTo(x, y); ctx.lineTo(x + TILE, y); }
    if (!inR(c, r + 1, range)) { ctx.moveTo(x, y + TILE); ctx.lineTo(x + TILE, y + TILE); }
    if (!inR(c - 1, r, range)) { ctx.moveTo(x, y); ctx.lineTo(x, y + TILE); }
    if (!inR(c + 1, r, range)) { ctx.moveTo(x + TILE, y); ctx.lineTo(x + TILE, y + TILE); }
  }
  ctx.setLineDash(o.dashed ? [5, 4] : []);
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = hexA(color, 0.95); ctx.stroke();
  ctx.setLineDash([]); ctx.lineCap = 'butt';
}

function rangeCircle(x, y, r, color, dashed) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  if (!dashed) { ctx.fillStyle = hexA(color, 0.06); ctx.fill(); }
  ctx.setLineDash(dashed ? [6, 5] : []); ctx.lineWidth = 2; ctx.strokeStyle = hexA(color, 0.9); ctx.stroke(); ctx.setLineDash([]);
}
const ARROWS = ['↑', '→', '↓', '←'];
// Rail range: the squares along its fixed firing line
function lineRange(c, r, dir, range, color, dashed) {
  const pulse = 0.8 + Math.sin(G.clock * 4) * 0.2, [dx, dy] = RAIL_DIRS[dir];
  for (const [cc, rr] of railTiles(c, r, dir, range)) {
    const lane = MAP.tiles.has(rr * COLS + cc);
    ctx.fillStyle = hexA(color, (dashed ? 0.12 : lane ? 0.36 : 0.13) * pulse);
    roundRect(cc * TILE + 2, rr * TILE + 2, TILE - 4, TILE - 4, 5); ctx.fill();

  }

  ctx.beginPath(); ctx.moveTo(x + dx * 16, y + dy * 16); ctx.lineTo(x + dx * range * TILE, y + dy * range * TILE);
  ctx.setLineDash(dashed ? [6, 5] : []); ctx.lineWidth = 2; ctx.strokeStyle = hexA(color, 0.9); ctx.stroke(); ctx.setLineDash([]);
}

function statLine(a, b) {
  const s = [];
  const f = (k, lab, fmt = v => v) => { if (a[k] != null && b[k] != null && a[k] !== b[k]) s.push(`${lab} ${fmt(a[k])}→${fmt(b[k])}`); };
  f('dmg', tr('s_dmg')); f('dps', tr('s_dps')); f('gold', tr('s_gold')); f('every', tr('s_every'), v => v + tr('sec')); f('shield', tr('s_shield')); f('buff', tr('s_boost'), v => '+' + Math.round(v * 100) + '%');

// Line-wraps centered text. Latin words stay whole; each Chinese character can break,
// but closing punctuation (，。) never starts a line.
function wrapTokens(str) {
  const out = [], re = /[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g;
  let m;
  while ((m = re.exec(str))) {
    const t = m[0];
    if (/^\s+$/.test(t)) { out.push({ t: ' ', sp: true }); continue; }
    if (/^[，。、；：？！）」』]$/.test(t) && out.length && !out[out.length - 1].sp) { out[out.length - 1].t += t; continue; }
    out.push({ t });
  }
  return out;
}
function wrapText(str, cx, y, maxW, lh) {
  let line = '', yy = y;
  ctx.textAlign = 'center';
  for (const k of wrapTokens(str)) {
    if (k.sp) { if (line) line += ' '; continue; }
    const t = line + k.t;
    if (ctx.measureText(t.trim()).width > maxW && line.trim()) { ctx.fillText(line.trim(), cx, yy); line = k.t; yy += lh; } else line = t;
  }
  if (line.trim()) ctx.fillText(line.trim(), cx, yy);
}

function drawRotateHint() {
  if (LW < LH * 1.1 || !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) return;

const SAGA = { scroll: 0, vel: 0, drag: null, card: null, info: null, fresh: [], shake: 0, deco: null, target: null };
const NODE_GAP = 96;

const WORLD_GAP = 46;          // extra room between worlds for the world banner
function sagaHeight() { return 250 + (LEVELS.length - 1) * NODE_GAP + (THEMES.length - 1) * WORLD_GAP + 250; }
function nodePos(n) {
  const amp = Math.min(104, LW * 0.27);
  return { x: LW / 2 + Math.sin((n - 1) * 0.9) * amp, y: sagaHeight() - 250 - (n - 1) * NODE_GAP - Math.floor((n - 1) / LEVELS_PER_WORLD) * WORLD_GAP };
}
function clampScroll(s) { return clamp(s, 0, Math.max(0, sagaHeight() - LH)); }
function scrollToLevel(n, instant) {
  const s = clampScroll(nodePos(n).y - LH * 0.56);
  if (instant) { SAGA.scroll = s; SAGA.target = null; } else SAGA.target = s;
}
function worldBand(w) {        // y-range (content space) of a world's section
  const first = w * LEVELS_PER_WORLD + 1, last = Math.min(LEVELS.length, first + LEVELS_PER_WORLD - 1);
  const bottom = w === 0 ? sagaHeight() : nodePos(first).y + (NODE_GAP + WORLD_GAP) / 2;
  const top = last >= LEVELS.length ? 0 : nodePos(last).y - (NODE_GAP + WORLD_GAP) / 2;
  return { top, bottom };
}

function toMap() {
  G.state = 'map'; G.paused = false; G.menu = null; SAGA.card = null;

function openCard(n, fromLevel) {

function sagaDeco() {
  if (SAGA.deco && SAGA.deco.w === LW) return SAGA.deco.items;
  const R = seeded(99), items = [], H = sagaHeight();
  const kinds = ['grunt', 'scout', 'splitter', 'brute', 'aegis', 'blink', 'mender', 'titan', 'mite'];
  for (let i = 0; i < Math.round(70 * LEVELS.length / 40); i++) items.push({ x: R() * LW, y: R() * H, k: kinds[Math.floor(R() * kinds.length)], s: 0.7 + R() * 1.2, ph: R() * 6, sp: 0.2 + R() * 0.6 });
  SAGA.deco = { w: LW, items };
  return items;
}

function drawSaga(rdt) {
  const sc = SAGA.scroll, H = sagaHeight();
  // world bands
  for (let w = 0; w < THEMES.length; w++) {
    const b = worldBand(w), th = THEMES[w];
    const y0 = b.top - sc, y1 = b.bottom - sc;
    if (y1 < 0 || y0 > LH) continue;
    const gr = ctx.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, th.bg); gr.addColorStop(0.5, th.bg2); gr.addColorStop(1, th.bg);
    ctx.fillStyle = gr; ctx.fillRect(0, y0, LW, y1 - y0 + 1);
    ctx.fillStyle = hexA(th.grid, 0.6);
    const oy = (b.top - sc) % TILE;
    for (let x = (LW / 2) % TILE; x < LW; x += TILE) for (let y = Math.max(y0, oy); y < Math.min(y1, LH); y += TILE) ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  // drifting glyphs
  for (const d of sagaDeco()) {
    const y = d.y - sc; if (y < -30 || y > LH + 30) continue;
    ctx.globalAlpha = 0.13;
    drawGlyph(ENEMIES[d.k], d.x + Math.sin(G.clock * d.sp + d.ph) * 10, y, { rot: G.clock * d.sp, rot2: -G.clock, scale: d.s, dir: d.ph, t: G.clock + d.ph });
    ctx.globalAlpha = 1;
  }
  // trail
  const pts = LEVELS.map(l => nodePos(l.n));
  const trace = (from, to) => {
    ctx.beginPath(); ctx.moveTo(pts[from].x, pts[from].y - sc);
    for (let i = from + 1; i <= to; i++) {
      const a = pts[i - 1], b = pts[i];
      ctx.bezierCurveTo(a.x, a.y - sc - NODE_GAP * 0.45, b.x, b.y - sc + NODE_GAP * 0.45, b.x, b.y - sc);
    }
  };
  ctx.lineCap = 'round';
  trace(0, pts.length - 1); ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(5,4,14,0.8)'; ctx.stroke();
  ctx.lineWidth = 2; ctx.setLineDash([3, 9]); ctx.strokeStyle = 'rgba(160,150,220,0.3)'; ctx.stroke(); ctx.setLineDash([]);
  const reach = Math.min(Save.d.max, LEVELS.length) - 1;
  if (reach > 0) {
    trace(0, reach);
    ctx.lineWidth = 7; ctx.strokeStyle = hexA(THEMES[LEVELS[reach].world].edge, 0.8); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = THEMES[LEVELS[reach].world].flow; ctx.setLineDash([4, 12]); ctx.lineDashOffset = G.clock * 30; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.lineCap = 'butt';
  // world banners
  for (let w = 0; w < THEMES.length; w++) {
    const first = w * LEVELS_PER_WORLD + 1, th = THEMES[w];
    const y = (w === 0 ? nodePos(1).y + 62 : worldBand(w).bottom) - sc;
    if (y < -40 || y > LH + 40) continue;
    ctx.fillStyle = hexA(th.edge, 0.5); ctx.fillRect(0, y, LW, 1);
    roundRect(LW / 2 - 100, y - 17, 200, 34, 17); ctx.fillStyle = hexA(th.bg, 0.95); ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = th.edge; ctx.stroke();
    setFont(8.5, FONT_UI); spacing(1.5); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(230,230,255,0.7)';
    ctx.fillText(first > Save.open() ? tr('world_from', w + 1, first) : tr('world_n', w + 1), LW / 2, y - 6); spacing(0);
    setFont(13, FONT_D, 400); ctx.fillStyle = th.flow; ctx.fillText(wName(w), LW / 2, y + 8);
  }
  // nodes
  for (const lv of LEVELS) {
    const p = pts[lv.n - 1], y = p.y - sc;
    if (y < -60 || y > LH + 60) continue;
    drawNode(lv, p.x, y);
  }
  // top of the map
  const ty = 60 - sc;
  if (ty > -40) {
    setFont(12, FONT_D, 400); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(230,230,255,0.55)';
    ctx.fillText(tr('more_levels'), LW / 2, ty);
  }
}

function drawNode(lv, x, y) {
  const n = lv.n, th = THEMES[lv.world], st = Save.stars(n);
  const unlocked = n <= Save.open(), current = n === Save.d.max && !Save.d.done && st === 0;
  const anim = G.mapAnim && G.mapAnim.level === n ? G.mapAnim : null;
  let s = 1;
  if (anim) { const a = clamp((anim.t - 0.3) / 0.5, 0, 1); s = a <= 0 ? 0.6 : easeOutBack(a); }
  const r = (lv.boss ? 26 : 21) * s * (current ? 1 + Math.sin(G.clock * 4) * 0.05 : 1);
  if (current) { additive(true); glow(x, y, 70, th.flow, 0.5 + Math.sin(G.clock * 4) * 0.2); additive(false); }
  const col = lv.boss ? '#ff2e4d' : th.flow;
  if (lv.boss) starPath(x, y, r * 1.12, r * 0.72, 8, G.clock * 0.2); else { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  ctx.fillStyle = unlocked ? '#0c0a1d' : '#08070f'; ctx.fill();
  if (unlocked) { ctx.fillStyle = hexA(col, st ? 0.35 : 0.18); ctx.fill(); }
  ctx.lineWidth = current ? 3 : 2; ctx.strokeStyle = unlocked ? col : '#34304f'; ctx.stroke();
  if (unlocked) { ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke(); }
  setFont(lv.boss ? 16 : 15, FONT_D, 400); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = unlocked ? '#ffffff' : '#57527c'; ctx.fillText(String(n), x, y + 1);
  if (!unlocked) {       // padlock
    const lx = x + r * 0.72, ly = y + r * 0.62;
    ctx.fillStyle = '#57527c'; ctx.fillRect(lx - 4, ly - 1, 8, 6);
    ctx.beginPath(); ctx.arc(lx, ly - 1, 2.6, Math.PI, 0); ctx.lineWidth = 1.5; ctx.strokeStyle = '#57527c'; ctx.stroke();
  }
  if (st > 0 || (unlocked && !current)) for (let i = 0; i < 3; i++) drawStar(x + (i - 1) * 14, y - r - 9 + (i === 1 ? -3 : 0), 6.5, i < st);
  if (current) {        // "you are here" marker
    const by = y - r - 22 + Math.sin(G.clock * 5) * 4;
    polyPath(x, by, 7, 4, G.clock); ctx.fillStyle = '#0a0817'; ctx.fill(); neon('#bff8ff', 2);
  }
  // unlock badges
  const side = x > LW / 2 ? -1 : 1, bx = x + side * (r + 30);
  if (lv.newTower) {
    drawTowerGlyph(lv.newTower, bx, y, { lv: 0, t: G.clock, scale: 0.55, ghost: true, alpha: unlocked ? 1 : 0.45 });
    setFont(8, FONT_UI); spacing(1); ctx.textAlign = 'center'; ctx.fillStyle = TOWERS[lv.newTower].color; ctx.fillText(tr('badge_tower'), bx, y + 18); spacing(0);
  } else if (lv.newEnemy) {
    ctx.globalAlpha = unlocked ? 1 : 0.45;
    drawGlyph(ENEMIES[lv.newEnemy], bx, y - 2, { rot: G.clock * 0.6, rot2: -G.clock, scale: Math.min(1, 10 / ENEMIES[lv.newEnemy].r), dir: 0, t: G.clock });
    ctx.globalAlpha = 1;
    setFont(8, FONT_UI); spacing(1); ctx.textAlign = 'center'; ctx.fillStyle = ENEMIES[lv.newEnemy].color; ctx.fillText(tr('badge_enemy'), bx, y + 18); spacing(0);
  } else if (lv.twoPortals) {
    setFont(8, FONT_UI); spacing(1); ctx.textAlign = 'center'; ctx.fillStyle = '#ff3d9a'; ctx.fillText(tr('two_portals'), bx, y); spacing(0);
  } else if (lv.noBounty || lv.air || lv.shielded) {
    const k = lv.noBounty ? 'noBounty' : lv.air ? 'air' : 'shielded', cd = CONDITIONS[k];
    ctx.globalAlpha = unlocked ? 1 : 0.5; conditionIcon(k, bx, y - 4, cd.color); ctx.globalAlpha = 1;
    setFont(8, FONT_UI); spacing(1); ctx.textAlign = 'center'; ctx.fillStyle = cd.color; ctx.fillText(condTag(k), bx, y + 16); spacing(0);
  }
  hit(x - r - 10, y - r - 10, (r + 10) * 2, (r + 10) * 2, () => {
    if (unlocked) openCard(n);

  });
}

function toggleLoadout(t) {
  const lo = Save.d.loadout, slots = slotsFor(Save.open());

  c.t = Math.min(1, c.t + rdt * 5);
  SAGA.shake = Math.max(0, SAGA.shake - rdt * 4);
  const lv = LEVELS[c.n - 1], th = THEMES[lv.world], needs = levelNeeds(lv);
  const CS = needs.length ? 44 * needs.length : 0;
  dim(0.72 * c.t); blocker();
  const cw = Math.min(344, LW - 20), ch = 524 + CS;
  const x0 = (LW - cw) / 2, y0 = Math.max(8, (LH - ch) / 2) + (1 - easeOutBack(c.t)) * 60;
  ctx.save(); ctx.globalAlpha = c.t;
  additive(true); glow(LW / 2, y0 + ch / 2, cw * 0.9, th.edge, 0.25); additive(false);
  roundRect(x0, y0, cw, ch, 18); ctx.fillStyle = '#0b0918'; ctx.fill();
  ctx.fillStyle = hexA(th.bg2, 0.8); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = lv.boss ? '#ff2e4d' : th.edge; ctx.stroke();
  const cx = LW / 2;
  circleButton(x0 + cw - 26, y0 + 26, 15, 'close', () => { SAGA.card = null; SAGA.confirm = null; Sound.play('tap'); });
  // header
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText(tr('level_n', c.n), cx, y0 + 38, 28, lv.boss ? '#ff5a6a' : th.flow, FONT_D, 14);
  setFont(10, FONT_UI); spacing(3); ctx.fillStyle = 'rgba(230,230,255,0.7)';
  ctx.fillText(tr('card_sub', lv.world + 1, wName(lv.world), lv.boss ? tr('boss_suffix') : '', lv.waves.length), cx, y0 + 64); spacing(0);
  const st = Save.stars(c.n);
  for (let i = 0; i < 3; i++) drawStar(cx + (i - 1) * 34, y0 + 96 - (i === 1 ? 4 : 0), 13, i < st);
  setFont(10, FONT_UI, 500); ctx.fillStyle = 'rgba(230,230,255,0.65)';
  ctx.fillText(tr('star_rules'), cx, y0 + 122);
  ctx.fillStyle = hexA(th.edge, 0.4); ctx.fillRect(x0 + 16, y0 + 138, cw - 32, 1);
  const lo = Save.d.loadout;
  // level conditions (No Bounty / Air Raid)
  needs.forEach((cd, i) => {
    const py = y0 + 146 + i * 44, has = needMet(cd, lo), pulse = has ? 0 : 0.5 + Math.sin(G.clock * 5) * 0.5;
    roundRect(x0 + 14, py, cw - 28, 38, 10); ctx.fillStyle = hexA(cd.color, 0.1 + pulse * 0.08); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = cd.color; ctx.stroke();
    conditionIcon(cd.key, x0 + 34, py + 19, cd.color);
    ctx.textAlign = 'left'; setFont(12, FONT_D, 400); ctx.fillStyle = cd.color; ctx.fillText(condTag(cd.key), x0 + 54, py + 12);
    setFont(10, FONT_UI, 500); ctx.fillStyle = '#e8e6ff'; ctx.fillText(condLine(cd.key), x0 + 54, py + 27);
    ctx.textAlign = 'right'; setFont(8.5, FONT_UI); spacing(1); ctx.fillStyle = has ? '#7dffb0' : '#ff8a96';
    const got = needOf(cd).find(t => lo.includes(t));
    ctx.fillText(has ? `${tName(got)} ✓` : `${tr('bring')} ${needNames(cd)}`, x0 + cw - 22, py + 12); spacing(0);
  });
  const Y = y0 + CS;          // everything below shifts down by the condition strip
  // enemies
  setFont(10, FONT_UI); spacing(3); ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.fillText(tr('enemies'), x0 + 18, Y + 156); spacing(0);
  const ens = levelEnemies(lv), gap = Math.min(54, (cw - 30) / ens.length);
  ens.forEach((k, i) => {
    const rc = ENEMIES[k], ex = cx + (i - (ens.length - 1) / 2) * gap, ey = Y + 192;
    const sel = SAGA.info && SAGA.info.kind === 'enemy' && SAGA.info.key === k;
    if (sel) { ctx.beginPath(); ctx.arc(ex, ey, 20, 0, TAU); ctx.fillStyle = hexA(rc.color, 0.15); ctx.fill(); }
    const shielded = lv.shieldTypes.includes(k);
    if (rc.dome) {                         // Aegis: show its dome
      ctx.beginPath(); ctx.arc(ex, ey, 21, 0, TAU); ctx.fillStyle = hexA('#4aa8ff', 0.12); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = hexA('#9fd6ff', 0.55 + Math.sin(G.clock * 3) * 0.2); ctx.stroke();
    }
    drawGlyph(rc, ex, ey, { rot: G.clock * (rc.spin || 0), rot2: G.clock * (rc.inner ? rc.inner.spin : 0), scale: Math.min(1.1, 12 / rc.r), dir: rc.flying ? -Math.PI / 2 : Math.sin(G.clock + i) * 0.5, t: G.clock + i, shield: shielded ? 1 : 0, ping: shielded ? Math.max(0, Math.sin(G.clock * 2.5 + i)) * 0.04 : 0 });
    setFont(8.5, FONT_UI); ctx.textAlign = 'center'; ctx.fillStyle = hexA(rc.color, 0.95);
    ctx.fillText(eName(k).toUpperCase(), ex, ey + 26 + (ens.length > 7 && i % 2 ? 10 : 0));   // stagger names when crowded
    let by = ey - 32;
    if (shielded || rc.dome) {             // blue SHIELD badge: this enemy is protected on this level
      const bw = LANG === 'zh' ? 28 : 40;
      roundRect(ex - bw / 2, by, bw, 13, 6.5); ctx.fillStyle = '#2a6fd6'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = '#9fd6ff'; ctx.stroke();
      setFont(7.5, FONT_UI); ctx.fillStyle = '#ffffff'; ctx.fillText(tr('shield_badge'), ex, by + 6.5); by -= 15;
    }
    if (k === lv.newEnemy) {
      roundRect(ex - 15, by, 30, 13, 6.5); ctx.fillStyle = '#ff3d9a'; ctx.fill();
      setFont(8, FONT_UI); ctx.fillStyle = '#ffffff'; ctx.fillText(tr('new'), ex, by + 6.5);
    }
    hit(ex - gap / 2, ey - 24, gap, 54, () => { SAGA.info = { kind: 'enemy', key: k }; Sound.play('tap'); });
  });
  // info line
  let info = null, icol = '#d9d6f5';
  const I = SAGA.info;
  if (I && I.kind === 'enemy') { info = `${eName(I.key)}: ${eDesc(I.key)}${lv.shieldTypes.includes(I.key) ? '  ' + tr('shielded_note') : ''}`; icol = ENEMIES[I.key].color; }
  else if (I && I.kind === 'tower') { const d = TOWERS[I.key]; info = d.unlock > Save.open() ? tr('info_unlock', tName(I.key), d.unlock) : `${tName(I.key)}: ${tDesc(I.key)}`; icol = d.color; }
  else if (I && I.kind === 'msg') { info = I.text; icol = '#ff8a96'; }
  else if (lv.newEnemy) { info = tr('info_new', eName(lv.newEnemy), eDesc(lv.newEnemy)); icol = ENEMIES[lv.newEnemy].color; }
  else if (lv.newTower) { info = tr('info_new_tower', tName(lv.newTower), tDesc(lv.newTower)); icol = TOWERS[lv.newTower].color; }
  else if (lv.twoPortals) { info = tr('info_two'); icol = '#ff3d9a'; }
  else if (lv.boss) { info = tr('info_boss'); icol = '#ff5a6a'; }
  else if (lv.hasShields && !lv.shielded) { info = tr('info_light'); icol = '#9fd6ff'; }
  if (info) { setFont(10.5, FONT_UI, 500); ctx.fillStyle = icol; wrapText(info, cx, Y + 244, cw - 36, 13); }
  ctx.fillStyle = hexA(th.edge, 0.4); ctx.fillRect(x0 + 16, Y + 266, cw - 32, 1);
  // loadout
  const slots = slotsFor(Save.open());
  setFont(10, FONT_UI); spacing(3); ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.fillText(tr('loadout'), x0 + 18, Y + 284); spacing(0);
  const shx = Math.sin(SAGA.shake * 30) * 4 * SAGA.shake;
  for (let i = 0; i < slots; i++) {
    const sx = x0 + cw - 18 - (slots - 1 - i) * 16 + shx;
    ctx.beginPath(); ctx.arc(sx - 4, Y + 284, 5, 0, TAU);
    ctx.fillStyle = i < lo.length ? TOWERS[lo[i]].color : 'rgba(0,0,0,0.5)'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  }
  setFont(10, FONT_UI); ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(230,230,255,0.7)';
  ctx.fillText(`${lo.length}/${slots}`, x0 + cw - 18 - slots * 16 - 2 + shx, Y + 284.5);
  const COLS5 = 5, gw = (cw - 28) / COLS5, gh = 70;
  const needed = needs.filter(cd => !needMet(cd, lo)).flatMap(needOf);
  TOWER_ORDER.forEach((t, i) => {
    const d = TOWERS[t], gx = x0 + 14 + (i % COLS5) * gw, gy = Y + 298 + Math.floor(i / COLS5) * (gh + 8);
    const open = d.unlock <= Save.open(), on = lo.includes(t), fresh = SAGA.fresh.includes(t);
    const want = needed.includes(t) && !on && open;
    roundRect(gx + 2, gy, gw - 4, gh, 10);
    ctx.fillStyle = on ? hexA(d.color, 0.16) : 'rgba(6,5,16,0.7)'; ctx.fill();
    ctx.lineWidth = on || want ? 2 : 1;
    ctx.strokeStyle = on ? d.color : want ? hexA(d.color, 0.5 + Math.sin(G.clock * 6) * 0.5) : open ? '#3d3868' : '#221f3a'; ctx.stroke();
    const gcx = gx + gw / 2;
    if (open) {
      drawTowerGlyph(t, gcx, gy + 26, { lv: 0, t: G.clock, scale: 0.66, ghost: true, alpha: on ? 1 : 0.55 });
      setFont(9, FONT_UI); ctx.textAlign = 'center'; ctx.fillStyle = on ? '#ffffff' : 'rgba(230,230,255,0.6)';
      ctx.fillText(tName(t), gcx, gy + 50);
      setFont(8.5, FONT_UI); ctx.fillStyle = on ? '#ffe38a' : 'rgba(255,227,138,0.5)'; ctx.fillText(`⬡ ${d.cost}`, gcx, gy + 62);
      if (on) {
        ctx.beginPath(); ctx.arc(gx + gw - 11, gy + 10, 7, 0, TAU); ctx.fillStyle = d.color; ctx.fill();
        setFont(9, FONT_UI); ctx.fillStyle = '#0b0918'; ctx.fillText(String(lo.indexOf(t) + 1), gx + gw - 11, gy + 10.5);
      }
      if (fresh || want) {
        roundRect(gx + 5, gy + 4, 30, 13, 6.5); ctx.fillStyle = want ? d.color : '#ff3d9a'; ctx.fill();
        setFont(7.5, FONT_UI); ctx.fillStyle = want ? '#0b0918' : '#ffffff'; ctx.fillText(want ? tr('need') : tr('new'), gx + 20, gy + 10.5);
      }
    } else {
      ctx.globalAlpha = c.t * 0.18; drawTowerGlyph(t, gcx, gy + 26, { lv: 0, t: 0, scale: 0.66, ghost: true }); ctx.globalAlpha = c.t;
      ctx.fillStyle = '#57527c'; ctx.fillRect(gcx - 5, gy + 24, 10, 8);
      ctx.beginPath(); ctx.arc(gcx, gy + 24, 3.4, Math.PI, 0); ctx.lineWidth = 1.8; ctx.strokeStyle = '#57527c'; ctx.stroke();
      setFont(8.5, FONT_UI); ctx.textAlign = 'center'; ctx.fillStyle = '#6d6894'; ctx.fillText(tr('level_n', d.unlock), gcx, gy + 56);
    }
    hit(gx, gy, gw, gh, () => { if (SAGA.confirm) return; if (open) toggleLoadout(t); else { SAGA.info = { kind: 'tower', key: t }; Sound.play('deny'); } });
  });
  ctx.restore();
  const go = () => { Save.store(); SAGA.card = null; SAGA.confirm = null; G.mapAnim = null; startLevel(c.n); Sound.play('build'); };
  pillButton(cx, y0 + ch - 42, 220, 56, tr('play'), '#7dffb0', () => {
    const missing = needs.find(cd => needOf(cd).length && !needMet(cd, Save.d.loadout));
    if (missing) { SAGA.confirm = missing; Sound.play('deny'); } else go();
  }, { pulse: true, size: 24 });
  if (SAGA.confirm) drawNeedConfirm(SAGA.confirm, x0, y0, cw, ch, go);
}

// "Are you sure?" when a level needs a tower that isn't in the loadout
function drawNeedConfirm(cd, x0, y0, cw, ch, go) {
  roundRect(x0, y0, cw, ch, 18); ctx.fillStyle = 'rgba(5,4,14,0.78)'; ctx.fill();
  hit(x0, y0, cw, ch, () => {});
  const bw = cw - 36, bh = 230, bx = x0 + 18, by = y0 + (ch - bh) / 2, cx = x0 + cw / 2, first = needOf(cd)[0], name = tName(first);
  additive(true); glow(cx, by + bh / 2, bw * 0.8, cd.color, 0.3); additive(false);
  roundRect(bx, by, bw, bh, 16); ctx.fillStyle = '#0b0918'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cd.color; ctx.stroke();
  conditionIcon(cd.key, cx, by + 30, cd.color);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText(condTag(cd.key), cx, by + 60, 20, cd.color, FONT_D, 10);
  setFont(11.5, FONT_UI, 500); ctx.fillStyle = '#e8e6ff';
  const msg = tr('confirm_' + cd.key, needNames(cd));
  wrapText(msg, cx, by + 88, bw - 30, 15);
  pillButton(cx, by + 150, bw - 40, 46, `${tr('add')} ${name}`, cd.color, () => {
    const lo = Save.d.loadout, slots = slotsFor(Save.open());
    if (!lo.includes(first)) {
      if (lo.length >= slots) {                    // drop the last tower that isn't needed by another condition
        const keep = levelNeeds(LEVELS[SAGA.card.n - 1]).flatMap(needOf);
        let i = lo.length - 1; while (i > 0 && keep.includes(lo[i])) i--;
        lo.splice(i, 1);
      }
      lo.push(first);
    }
    Save.store(); SAGA.confirm = null; SAGA.info = { kind: 'tower', key: first }; Sound.play('build');
  }, { size: 16, pulse: true });
  pillButton(cx, by + 202, bw - 90, 36, tr('play_without'), '#8a84b8', go, { size: 11 });
}

function updateSaga(rdt) {
  if (G.mapAnim) {
    const a = G.mapAnim, before = a.t;
    a.t += rdt;
    if (before < 0.3 && a.t >= 0.3) {
      const p = nodePos(a.level); Sound.play('pop');
      FX.ring(p.x, p.y - SAGA.scroll, 10, 70, THEMES[LEVELS[a.level - 1].world].flow, 0.6, 4);
      FX.shards(p.x, p.y - SAGA.scroll, THEMES[LEVELS[a.level - 1].world].flow, 16, 200, 4);
    }
    if (a.t > 1.2) G.mapAnim = null;
  }
  if (!SAGA.drag) {
    if (SAGA.target != null) {
      SAGA.scroll += (SAGA.target - SAGA.scroll) * Math.min(1, rdt * 6);
      if (Math.abs(SAGA.target - SAGA.scroll) < 0.5) SAGA.target = null;
    } else if (Math.abs(SAGA.vel) > 1) {
      SAGA.scroll = clampScroll(SAGA.scroll + SAGA.vel * rdt);
      SAGA.vel *= Math.pow(0.04, rdt);
    }
  }
  FX.update(rdt);
}

// ---------------------------------------------------------- dispatcher
function drawUI(rdt) {
  hits.length = 0;
  if (G.state === 'title') { drawTitle(); drawFlash(); return; }
  if (G.state === 'map') {
    ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, LW, LH);
    drawSaga(rdt);
    FX.draw();
    drawMapHud();
    drawCard(rdt);
    return;
  }
  drawPlayUI();
  drawFlash();
}
// =====================================================================
//  MAIN LOOP + INPUT
// =====================================================================
function toLogical(ev) {
  const r = cvs.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / SCALE, y: (ev.clientY - r.top) / SCALE };
}
cvs.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  Sound.init();
  const p = toLogical(ev);
  if (G.state === 'map' && !SAGA.card) {          // the level map scrolls with a drag
    SAGA.drag = { id: ev.pointerId, y0: p.y, s0: SAGA.scroll, x: p.x, y: p.y, moved: false, ly: p.y, lt: performance.now() };
    SAGA.vel = 0; SAGA.target = null;
    try { cvs.setPointerCapture(ev.pointerId); } catch (e) {}
    return;
  }
  G.pointerType = ev.pointerType;
  handleTap(p.x, p.y);
  if (G.press) { G.press.pid = ev.pointerId; try { cvs.setPointerCapture(ev.pointerId); } catch (e) {} }
}, { passive: false });
cvs.addEventListener('pointermove', ev => {
  if (G.press && G.press.pid === ev.pointerId) { const p = toLogical(ev); pressMove(p.x, p.y); return; }
  const d = SAGA.drag; if (!d || d.id !== ev.pointerId) return;
  const p = toLogical(ev), now = performance.now();
  if (Math.abs(p.y - d.y0) > 7) d.moved = true;
  if (d.moved) {
    SAGA.scroll = clampScroll(d.s0 - (p.y - d.y0));
    const dt = Math.max(1, now - d.lt);
    SAGA.vel = lerp(SAGA.vel, -(p.y - d.ly) / dt * 1000, 0.5);
  }
  d.ly = p.y; d.lt = now;
});
const endDrag = ev => {
  if (G.press && G.press.pid === ev.pointerId) {
    if (ev.type === 'pointercancel') { G.press = null; if (G.menu) G.menu.sel = null; return; }
    const p = toLogical(ev); pressEnd(p.x, p.y); return;
  }
  const d = SAGA.drag; if (!d || d.id !== ev.pointerId) return;
  SAGA.drag = null;
  if (!d.moved) handleTap(d.x, d.y);
  else if (performance.now() - d.lt > 80) SAGA.vel = 0;
};
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('wheel', ev => { if (G.state === 'map' && !SAGA.card) { ev.preventDefault(); SAGA.target = null; SAGA.scroll = clampScroll(SAGA.scroll + ev.deltaY); } }, { passive: false });
cvs.addEventListener('contextmenu', ev => ev.preventDefault());

window.addEventListener('keydown', ev => {
  if (G.state !== 'play' || G.over) return;
  if (ev.code === 'Space') { ev.preventDefault(); if (G.awaiting) startWave(false); else if (G.nextTimer !== null) startWave(true); }
  else if (ev.key === 'p' || ev.key === 'Escape') { G.paused = !G.paused; G.menu = null; G.confirm = null; }
  else if (ev.key === 'm') { Sound.setMuted(!Sound.muted); saveMute(); }
  else if (ev.key === 'f') G.speed = G.speed === 1 ? 2 : 1;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play' && !G.over) { G.paused = true; G.menu = null; } Sound.suspend(); }
  else Sound.resume();
});

// Watch the frame time during play. It learns this device's normal speed at the start of a level
// (so a phone capped at 30fps isn't mistaken for a slow one) and steps quality down if a busy wave
// keeps it well below that: fewer particles first, then fewer pixels.
function tuneQuality(rdt) {
  const Q = QUALITY;
  if (G.state !== 'play' || G.paused || G.over || document.hidden || rdt <= 0) return;
  Q.t += rdt; Q.ema += (rdt * 1000 - Q.ema) * 0.06;
  if (Q.t < 2.5) { Q.base = Q.ema; return; }
  if (Q.ema > Math.max(24, Q.base * 1.35)) Q.slow += rdt; else Q.slow = Math.max(0, Q.slow - rdt * 0.5);
  if (Q.slow > 1.2) {
    Q.slow = 0; Q.ema = Q.base;
    if (Q.fx > 0.5) Q.fx = 0.5;
    else if (DPR > 1.01) { Q.dpr = Math.max(1, DPR - 0.25); layout(); }
  }
}
let lastT = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  tuneQuality(rdt);
  G.clock += rdt;
  const k = DPR * SCALE;
  if (G.state === 'map') {
    updateSaga(rdt);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawUI(rdt);
    requestAnimationFrame(frame);
    return;
  }
  let ts = 1; if (G.slowT > 0) { G.slowT -= rdt; ts = 0.3; }
  const running = G.state === 'title' || (G.state === 'play' && !G.paused);
  const gdt = running ? rdt * ts * (G.state === 'play' ? G.speed : 1) : 0;
  if (gdt > 0) {
    const steps = Math.max(1, Math.ceil(gdt / (1 / 60)));
    for (let i = 0; i < steps; i++) update(gdt / steps);
  }
  if (G.state === 'play' && G.over) { G.endT -= rdt; if (G.endT <= 0) { G.state = 'end'; G.endShow = 0; G.unlockSnd = false; } }
  if (G.state === 'end') G.endShow += rdt;
  updateVisuals(G.state === 'end' ? rdt * ts : gdt, rdt);
  if (G.menu) G.menu.t = Math.min(1, G.menu.t + rdt * 7);
  drawWorld();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawUI(rdt);
  requestAnimationFrame(frame);
}

// ---- boot ------------------------------------------------------------
function snapshot() { return { muted: Sound.muted }; }
function start(data) {
  data = data || {};
  Save.load();
  try { if (localStorage.getItem('shatterline.muted') === '1') Sound.setMuted(true); } catch (e) {}
  if (data.muted) Sound.setMuted(true);
  G.theme = LEVELS[Save.d.max - 1].world;
  layout();
  startDemo(); G.state = 'title';
  buildBackground(theme());
  window.addEventListener('resize', () => { layout(); if (G.state !== 'map') buildBackground(theme()); SAGA.deco = null; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildBackground(theme()));
  requestAnimationFrame(frame);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(snapshot); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

// handles for automated playtests
window.__TD = { G, Save, LEVELS, startLevel, buildTower, upgradeTower, sellTower, upgradeCost, startWave, update, isBuildable, MAP, TOWERS, ENEMIES, ECON, LEVEL_CAL, toMap, openCard };
