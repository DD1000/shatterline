// ---------------------------------------------------- run analytics (v28)
// Every level you finish (won, lost, or quit after the first wave) is summed up and saved: towers,
// gold, lives, damage by tower, leaks, and a line per wave. Labs keep their last RUNS_PER_LAB runs,
// the campaign its last RUNS_KEPT. The lab screen's SEND LAB ANALYTICS copies a report for the chat.
const RUNS_PER_LAB = 5, RUNS_KEPT = 20;
function runSummary(result) {
  const R = G.run, lv = G.level, round = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [k, Math.round(v)]));
  return {
    t: Date.now(), n: G.levelNum, lab: lv.lab ? lv.lab.id : null, lv: lv.lab ? (lv.lab.v || 1) : null, build: BUILD,
    res: result, stars: result === 'win' ? G.stars : 0, lives: G.lives, max: G.maxLives, wave: G.waveNum, waves: G.waves.length,
    g0: R.g0, earned: Math.round(G.earned || 0), spent: Math.round(G.spent || 0), refund: Math.round(R.refund), left: Math.floor(G.gold), peak: Math.floor(R.peakGold),
    lo: R.lo, built: R.built, ups: R.ups, sold: R.sold, burned: R.burned, spend: R.spend,
    board: G.towers.map(t => t.type + (t.lv + 1)), peakTowers: Math.max(R.peakTowers, G.towers.length),
    dmg: round(R.dmg), killBy: R.killBy, kills: G.kills, combo: G.bestCombo, leaks: G.leaks, leakTypes: round(G.leakTypes),
    early: R.early, earlyGold: R.earlyGold, shields: R.shields, ignited: R.ignited, doused: R.doused,
    wv: R.waves.map(x => x.concat(Math.round((G.waveStats[x[0]] && G.waveStats[x[0]].leaked) || 0))),
    secs: Math.round((Date.now() - R.t0) / 1000), sim: Math.round(G.time),
  };
}
function recordRun(result) {
  if (G.demo || !G.level || !G.run || G.run.recorded) return;
  G.run.recorded = true;
  const s = runSummary(result);
  if (isLab(G.levelNum)) {
    const r = Save.labRec(G.levelNum), a = r.runs = r.runs || [];
    a.push(s); if (a.length > RUNS_PER_LAB) a.splice(0, a.length - RUNS_PER_LAB);
    if (result === 'quit') r.quits = (r.quits || 0) + 1;
  } else {
    const a = Save.d.runs = Save.d.runs || [];
    a.push(s); if (a.length > RUNS_KEPT) a.splice(0, a.length - RUNS_KEPT);
  }
  Save.store();
}
// leaving a level part-way (restart, or back to the map) still counts once a wave has been sent
function abandonRun() { if (G.state === 'play' && !G.over && !G.demo && G.waveNum > 0) recordRun('quit'); }

// The report (always in English, for the developer)
const TNAME = t => TOWERS[t] ? TOWERS[t].name : t, ENAME = t => ENEMIES[t] ? ENEMIES[t].name : t;
const kfmt = v => v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
function fmtDate(t) { const d = new Date(t), p = x => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
const fmtSecs = s => `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
const starStr = n => '★'.repeat(n || 0) + '☆'.repeat(3 - (n || 0));
function countStr(o, name = TNAME) {
  const e = Object.entries(o || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  return e.length ? e.map(([k, v]) => `${name(k)} ${v}`).join(' · ') : '-';
}
function boardStr(board) {
  const c = {}; for (const b of board || []) c[b] = (c[b] || 0) + 1;
  const e = Object.entries(c).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
  return e.length ? e.map(([k, v]) => `${TNAME(k.replace(/\d+$/, ''))} L${k.match(/\d+$/)[0]}${v > 1 ? ' x' + v : ''}`).join(', ') : '-';
}
function dmgStr(dmg) {
  const e = Object.entries(dmg || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), tot = e.reduce((a, [, v]) => a + v, 0);
  return tot ? e.map(([k, v]) => `${TNAME(k)} ${Math.round(v / tot * 100)}% (${kfmt(v)})`).join(' · ') : '-';
}
function runLines(r, label) {
  const res = r.res === 'win' ? `WON ${starStr(r.stars)}` : r.res === 'lose' ? 'LOST' : 'QUIT';
  return [
    `-- ${label} · ${fmtDate(r.t)} · ${res} · lives ${r.lives}/${r.max} · wave ${r.wave}/${r.waves} · ${fmtSecs(r.secs)}${r.build !== BUILD ? ' · game ' + r.build : ''}`,
    `gold: start ${r.g0} · earned ${r.earned} · spent ${r.spent} · refunds ${r.refund} · left ${r.left} · peak ${r.peak}`,
    `loadout: ${(r.lo || []).map(TNAME).join(', ') || '-'}`,
    `built: ${countStr(r.built)} | upgrades: ${countStr(r.ups)} | sold: ${countStr(r.sold)} | burned down: ${countStr(r.burned)}`,
    `gold into: ${countStr(r.spend)}`,
    `board at end (${(r.board || []).length}, most ${r.peakTowers}): ${boardStr(r.board)}`,
    `damage: ${dmgStr(r.dmg)}`,
    `kills ${r.kills}: ${countStr(r.killBy)} · best combo ${r.combo}`,
    `lives leaked ${r.leaks}: ${countStr(r.leakTypes, ENAME)}`,
    `early calls ${r.early} (+${r.earlyGold} gold) · shields/domes broken ${r.shields} · towers set alight ${r.ignited} · fires put out ${r.doused}`,
    `waves (wave:gold/lives/towers at its start, -N lives leaked in it, e = called early): ${(r.wv || []).map(w => `${w[0]}:${w[1]}/${w[2]}/${w[3]}${w[5] ? '-' + w[5] : ''}${w[4] ? 'e' : ''}`).join(' ') || '-'}`,
  ];
}
function labReport() {
  const labs = Save.d.lab || {}, out = [];
  const runs = LAB.reduce((a, lv) => a + ((labs[lv.n] && labs[lv.n].runs) || []).length, 0);
  out.push('SHATTERLINE LAB ANALYTICS');
  out.push(`game ${BUILD} · sent ${fmtDate(Date.now())} · ${LAB.filter(labDone).length}/${LAB.length} labs completed · ${runs} run${runs === 1 ? '' : 's'} saved (last ${RUNS_PER_LAB} per lab)`);
  LAB.forEach((lv, i) => {
    const r = labs[lv.n], d = lv.lab, econ = lv.econ.key === 'payday' ? 'PAYDAY' : `LEAN ${Math.round(lv.econ.bounty * 100)}%`;
    out.push('');
    out.push(`== LAB ${i + 1} · ${STR.en['lab_name_' + d.id]} [${d.id}${d.v ? ' v' + d.v : ''}] · ${econ} · ${lv.waves.length} waves · start ${lv.gold} gold${labDone(lv) ? ' · COMPLETED' : ''}`);
    if (!r || (!r.plays && !(r.runs || []).length)) { out.push('not played yet'); return; }
    out.push(`this version: ${r.wins} wins / ${r.plays} plays${r.quits ? ` · quit ${r.quits}x` : ''} · best ${starStr(r.stars)}${!r.plays ? ' (older runs below are from before the reset)' : ''}`);
    const a = r.runs || [];
    if (!a.length && r.last) out.push(`last (before tracking): ${r.last.win ? 'WON' : 'LOST'} · lives ${r.last.lives} · wave ${r.last.wave}/${r.last.waves} · gold earned ${r.last.earned} spent ${r.last.spent} left ${Math.floor(r.last.left)}`);
    a.slice().reverse().forEach((x, k) => out.push(...runLines(x, k === 0 ? 'latest run' : `${k + 1} runs back`)));
  });
  const camp = (Save.d.runs || []).slice(-10).reverse();
  if (camp.length) {
    out.push('');
    out.push(`== RECENT CAMPAIGN LEVELS (last ${camp.length})`);
    for (const x of camp) {
      out.push(`L${x.n} · ${fmtDate(x.t)} · ${x.res === 'win' ? 'WON ' + starStr(x.stars) : x.res === 'lose' ? 'LOST' : 'QUIT'} · lives ${x.lives}/${x.max} · wave ${x.wave}/${x.waves} · gold earned ${x.earned} spent ${x.spent} left ${x.left} peak ${x.peak} · ${fmtSecs(x.secs)}`);
      out.push(`   board: ${boardStr(x.board)} · damage: ${dmgStr(x.dmg)} · leaked: ${countStr(x.leakTypes, ENAME)}`);
    }
  }
  return out.join('\n');
}
// The copy box: a real DOM textarea + COPY button, so copying works on phones and inside the Claude app
function showAnalytics() {
  if (document.getElementById('an-box')) return;

    ctx.globalAlpha = 0.13;
    drawGlyph(ENEMIES[d.k], d.x + Math.sin(G.clock * d.sp + d.ph) * 10, y, { rot: G.clock * d.sp, rot2: -G.clock, scale: d.s, dir: d.ph, t: G.clock + d.ph });

  const reach = Math.min(Save.d.max, LEVELS.length) - 1;

function drawNode(lv, x, y) {

  const unlocked = n <= Save.open(), current = n === Save.d.max && !Save.d.done && st === 0;

function toggleLoadout(t) {
  const lo = Save.lo(), slots = slotsFor(Save.open());
  const i = lo.indexOf(t), lv = SAGA.card && levelOf(SAGA.card.n);
  if (i < 0 && lv && lv.banned.includes(t)) { Sound.play('deny'); SAGA.shake = 1; SAGA.info = { kind: 'msg', text: tr('banned', tName(t)) }; return; }
  if (i >= 0) {
    if (lo.length <= 1) { Sound.play('deny'); SAGA.shake = 1; SAGA.info = { kind: 'msg', text: tr('min_one') }; return; }
    lo.splice(i, 1); Sound.play('tap');
  } else if (lo.length >= slots) {
    Sound.play('deny'); SAGA.shake = 1; SAGA.info = { kind: 'msg', text: tr('loadout_full') }; return;

}

    const missing = needs.find(cd => needOf(cd).length && !needMet(cd, Save.lo()));
    if (missing) { SAGA.confirm = missing; Sound.play('deny'); } else go();

}

function badgeIcon(kind, x, y, color) {
  ctx.lineWidth = 1.3; ctx.strokeStyle = color; ctx.lineCap = 'round';
  if (kind === 'shield') { polyPath(x, y, 4.2, 6, 0); ctx.stroke(); }
  else if (kind === 'elec') { ctx.beginPath(); ctx.moveTo(x + 1.5, y - 4.5); ctx.lineTo(x - 2, y + 0.5); ctx.lineTo(x + 2, y + 0.5); ctx.lineTo(x - 1.5, y + 4.5); ctx.stroke(); }
  else if (kind === 'fire') { ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.quadraticCurveTo(x + 5, y, x + 3, y + 4); ctx.quadraticCurveTo(x, y + 6, x - 3, y + 4); ctx.quadraticCurveTo(x - 5, y, x, y - 5); ctx.stroke(); }
  else { ctx.beginPath(); for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; ctx.moveTo(x - Math.cos(a) * 4.5, y - Math.sin(a) * 4.5); ctx.lineTo(x + Math.cos(a) * 4.5, y + Math.sin(a) * 4.5); } ctx.stroke(); }
  ctx.lineCap = 'butt';
}

// "Are you sure?" when a level needs a tower that isn't in the loadout
function drawNeedConfirm(cd, x0, y0, cw, ch, go) {
  roundRect(x0, y0, cw, ch, 18); ctx.fillStyle = 'rgba(5,4,14,0.78)'; ctx.fill();
  hit(x0, y0, cw, ch, () => {});
  const bw = cw - 36, bh = 230, bx = x0 + 18, by = y0 + (ch - bh) / 2, cx = x0 + cw / 2, first = needOf(cd)[0], name = tName(first);
  additive(true); glow(cx, by + bh / 2, bw * 0.8, cd.color, 0.3); additive(false);
  roundRect(bx, by, bw, bh, 16); ctx.fillStyle = '#0b0918'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = cd.color; ctx.stroke();
  conditionIcon(cd.key, cx, by + 30, cd.color);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText(condTag(cd.key), cx, by + 60, 20, cd.color, FONT_D, 10);
  setFont(11.5, FONT_UI, 500); ctx.fillStyle = '#e8e6ff';
  const msg = tr('confirm_' + cd.key, needNames(cd));
  wrapText(msg, cx, by + 88, bw - 30, 15);
  pillButton(cx, by + 150, bw - 40, 46, `${tr('add')} ${name}`, cd.color, () => {
    const lo = Save.lo(), slots = slotsFor(Save.open());
    if (!lo.includes(first)) {
      if (lo.length >= slots) {                    // drop the last tower that isn't needed by another condition
        const keep = levelNeeds(levelOf(SAGA.card.n)).flatMap(needOf);
        let i = lo.length - 1; while (i > 0 && keep.includes(lo[i])) i--;
        lo.splice(i, 1);
      }
      lo.push(first);
    }
    Save.store(); SAGA.confirm = null; SAGA.info = { kind: 'tower', key: first }; Sound.play('build');
  }, { size: 16, pulse: true });
  pillButton(cx, by + 202, bw - 90, 36, tr('play_without'), '#8a84b8', go, { size: 11 });
}

function updateSaga(rdt) {
  if (G.mapAnim) {
    const a = G.mapAnim, before = a.t;
    a.t += rdt;
    if (before < 0.3 && a.t >= 0.3) {
      const p = nodePos(a.level); Sound.play('pop');
      FX.ring(p.x, p.y - SAGA.scroll, 10, 70, THEMES[LEVELS[a.level - 1].world].flow, 0.6, 4);
      FX.shards(p.x, p.y - SAGA.scroll, THEMES[LEVELS[a.level - 1].world].flow, 16, 200, 4);
    }
    if (a.t > 1.2) G.mapAnim = null;
  }
  if (!SAGA.drag) {
    if (SAGA.target != null) {
      SAGA.scroll += (SAGA.target - SAGA.scroll) * Math.min(1, rdt * 6);
      if (Math.abs(SAGA.target - SAGA.scroll) < 0.5) SAGA.target = null;
    } else if (Math.abs(SAGA.vel) > 1) {
      SAGA.scroll = clampScroll(SAGA.scroll + SAGA.vel * rdt);
      SAGA.vel *= Math.pow(0.04, rdt);
    }
  }
  FX.update(rdt);
}

// ---------------------------------------------------------- dispatcher
function drawUI(rdt) {
  hits.length = 0;
  if (G.state === 'title') { drawTitle(); drawFlash(); return; }
  if (G.state === 'lab') { drawLab(); drawCard(rdt); drawFlash(); return; }
  if (G.state === 'map') {
    ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, LW, LH);
    drawSaga(rdt);
    FX.draw();
    drawMapHud();
    drawCard(rdt);
    return;
  }
  drawPlayUI();
  drawFlash();
}
// =====================================================================
//  MAIN LOOP + INPUT
// =====================================================================
function toLogical(ev) {
  const r = cvs.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / SCALE, y: (ev.clientY - r.top) / SCALE };
}
cvs.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  Sound.init();
  const p = toLogical(ev);
  if (G.state === 'map' && !SAGA.card) {          // the level map scrolls with a drag
    SAGA.drag = { id: ev.pointerId, y0: p.y, s0: SAGA.scroll, x: p.x, y: p.y, moved: false, ly: p.y, lt: performance.now() };
    SAGA.vel = 0; SAGA.target = null;
    try { cvs.setPointerCapture(ev.pointerId); } catch (e) {}
    return;
  }
  G.pointerType = ev.pointerType;
  handleTap(p.x, p.y);
  if (G.press) { G.press.pid = ev.pointerId; try { cvs.setPointerCapture(ev.pointerId); } catch (e) {} }
}, { passive: false });
cvs.addEventListener('pointermove', ev => {
  if (G.press && G.press.pid === ev.pointerId) { const p = toLogical(ev); pressMove(p.x, p.y); return; }
  const d = SAGA.drag; if (!d || d.id !== ev.pointerId) return;
  const p = toLogical(ev), now = performance.now();
  if (Math.abs(p.y - d.y0) > 7) d.moved = true;
  if (d.moved) {
    SAGA.scroll = clampScroll(d.s0 - (p.y - d.y0));
    const dt = Math.max(1, now - d.lt);
    SAGA.vel = lerp(SAGA.vel, -(p.y - d.ly) / dt * 1000, 0.5);
  }
  d.ly = p.y; d.lt = now;
});
const endDrag = ev => {
  if (G.press && G.press.pid === ev.pointerId) {
    if (ev.type === 'pointercancel') { G.press = null; if (G.menu) G.menu.sel = null; return; }
    const p = toLogical(ev); pressEnd(p.x, p.y); return;
  }
  const d = SAGA.drag; if (!d || d.id !== ev.pointerId) return;
  SAGA.drag = null;
  if (!d.moved) handleTap(d.x, d.y);
  else if (performance.now() - d.lt > 80) SAGA.vel = 0;
};
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('wheel', ev => { if (G.state === 'map' && !SAGA.card) { ev.preventDefault(); SAGA.target = null; SAGA.scroll = clampScroll(SAGA.scroll + ev.deltaY); } }, { passive: false });
cvs.addEventListener('contextmenu', ev => ev.preventDefault());

window.addEventListener('keydown', ev => {
  if (G.state !== 'play' || G.over) return;
  if (ev.code === 'Space') { ev.preventDefault(); if (G.awaiting) startWave(false); else if (G.nextTimer !== null) startWave(true); }
  else if (ev.key === 'p' || ev.key === 'Escape') { if (G.pauseMenu) G.pauseMenu = false; else G.paused = !G.paused; G.confirm = null; }
  else if (ev.key === 'm') { Sound.setMuted(!Sound.muted); saveMute(); }
  else if (ev.key === 'f') G.speed = G.speed === 1 ? 2 : 1;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play' && !G.over) { G.paused = true; G.menu = null; } Sound.suspend(); }
  else Sound.resume();
});

// Watch the frame time during play. It learns this device's normal speed at the start of a level
// (so a phone capped at 30fps isn't mistaken for a slow one) and steps quality down if a busy wave
// keeps it well below that: fewer particles first, then fewer pixels.
function tuneQuality(rdt) {
  const Q = QUALITY;
  if (G.state !== 'play' || G.paused || G.over || document.hidden || rdt <= 0) return;
  Q.t += rdt; Q.ema += (rdt * 1000 - Q.ema) * 0.06;
  if (Q.t < 2.5) { Q.base = Q.ema; return; }
  if (Q.ema > Math.max(24, Q.base * 1.35)) Q.slow += rdt; else Q.slow = Math.max(0, Q.slow - rdt * 0.5);
  if (Q.slow > 1.2) {
    Q.slow = 0; Q.ema = Q.base;
    if (Q.fx > 0.5) Q.fx = 0.5;
    else if (DPR > 1.01) { Q.dpr = Math.max(1, DPR - 0.25); layout(); }
  }
}
let lastT = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  tuneQuality(rdt);
  G.clock += rdt;
  const k = DPR * SCALE;
  if (G.state === 'map') {
    updateSaga(rdt);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawUI(rdt);
    requestAnimationFrame(frame);
    return;
  }
  let ts = 1; if (G.slowT > 0) { G.slowT -= rdt; ts = 0.3; }
  const running = G.state === 'title' || G.state === 'lab' || (G.state === 'play' && !G.paused);
  const gdt = running ? rdt * ts * (G.state === 'play' ? G.speed : 1) : 0;
  if (gdt > 0) {
    const steps = Math.max(1, Math.ceil(gdt / (1 / 60)));
    for (let i = 0; i < steps; i++) update(gdt / steps);
  }
  if (G.state === 'play' && G.over) { G.endT -= rdt; if (G.endT <= 0) { G.state = 'end'; G.endShow = 0; G.unlockSnd = false; } }
  if (G.state === 'end') G.endShow += rdt;
  const planning = G.state === 'play' && G.paused && !G.over;
  if (planning) for (const tw of G.towers) { tw.spawn = Math.min(1, tw.spawn + rdt * 4); tw.kick = Math.max(0, tw.kick - rdt * 5); }
  updateVisuals(G.state === 'end' ? rdt * ts : planning ? rdt : gdt, rdt);
  if (G.menu) G.menu.t = Math.min(1, G.menu.t + rdt * 7);
  drawWorld();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawUI(rdt);
  requestAnimationFrame(frame);
}

// ---- boot ------------------------------------------------------------
function snapshot() { return { muted: Sound.muted }; }
function start(data) {
  data = data || {};
  Save.load();
  try { if (localStorage.getItem('shatterline.muted') === '1') Sound.setMuted(true); } catch (e) {}
  if (data.muted) Sound.setMuted(true);
  G.theme = LEVELS[Save.d.max - 1].world;
  layout();
  startDemo(); G.state = 'title';
  buildBackground(theme());
  window.addEventListener('resize', () => { layout(); if (G.state !== 'map') buildBackground(theme()); SAGA.deco = null; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildBackground(theme()));
  requestAnimationFrame(frame);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(snapshot); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

// handles for automated playtests
window.__TD = { G, Save, LEVELS, LAB, levelOf, toLab, startLevel, buildTower, upgradeTower, sellTower, upgradeCost, startWave, update, isBuildable, MAP, TOWERS, ENEMIES, ECON, LEVEL_CAL, toMap, openCard, spawnEnemy, FIRE, ELEC, igniteTower, labReport, recordRun, showAnalytics, labDone, LABFX };
