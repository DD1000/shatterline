<canvas id="game" tabindex="0" aria-label="Shatterline: a tower defense game. Tap tiles to build towers."></canvas>
<script>
'use strict';
// =====================================================================
//  SHATTERLINE: a Glowforms tower defense
//  Everything on screen is drawn from "recipes" (plain numbers), not image files.
//  Add an enemy  -> add one line to ENEMIES (intro = first level it appears).
//  Add a tower   -> add one entry to TOWERS (unlock = first level you can bring it).
//  Add a world   -> add one entry to THEMES.   Levels live in 15_levels.js.
// =====================================================================

const W = 360;                 // logical playfield width (px)
const TILE = 40;               // tile size (px)
const COLS = 9, ROWS = 13;     // map grid
const HUD_H = 50, BAR_H = 78;  // top HUD + bottom control bar
const MIN_H = HUD_H + ROWS * TILE + BAR_H;
const LEVELS_PER_WORLD = 10;
const BUILD = 'v37';          // the game's version: shown on the title screen, the lab screen and in lab analytics reports

// Title-screen showcase map
const DEMO_PATH = [[1,0],[1,2],[7,2],[7,5],[1,5],[1,8],[7,8],[7,10],[4,10],[4,12]];

// A world is just a palette. Every 10 levels you move to the next one.
const THEMES = [
  { name:'VOID',  bg:'#07060f', bg2:'#110d2a', grid:'#2a2358', tile:'rgba(130,110,255,0.05)', path:'#0f0b26', edge:'#5a48e0', flow:'#a08fff' },
  { name:'ABYSS', bg:'#020d16', bg2:'#06243a', grid:'#12425c', tile:'rgba(60,200,255,0.055)', path:'#03172a', edge:'#1f9fcc', flow:'#7ae8ff' },
  { name:'EMBER', bg:'#100505', bg2:'#2a0f07', grid:'#52200f', tile:'rgba(255,120,60,0.05)',  path:'#1a0705', edge:'#d84e20', flow:'#ffb07a' },
  { name:'CANDY', bg:'#12081a', bg2:'#2c1240', grid:'#522a70', tile:'rgba(255,140,220,0.06)', path:'#1e0c2e', edge:'#ff5fc8', flow:'#ffd6f2' },
  { name:'AURORA',  bg:'#03110f', bg2:'#06302a', grid:'#0f4a40', tile:'rgba(60,255,200,0.05)',  path:'#041a17', edge:'#19c8a0', flow:'#9dffe6' },
  { name:'SOLAR',   bg:'#110c02', bg2:'#2e2006', grid:'#4d3a0c', tile:'rgba(255,200,60,0.05)',  path:'#1a1203', edge:'#e0a21c', flow:'#ffe08a' },
  { name:'GLACIER', bg:'#060b12', bg2:'#15233a', grid:'#2d4561', tile:'rgba(200,230,255,0.06)', path:'#0b1522', edge:'#a9d4ff', flow:'#ffffff' },
  { name:'TOXIC',   bg:'#070d03', bg2:'#172a06', grid:'#2f4a0e', tile:'rgba(170,255,60,0.05)',  path:'#0c1604', edge:'#8ee01a', flow:'#e2ff8a' },
];

// ---- Enemy recipes -------------------------------------------------
// sides: 0 = circle, 3 = triangle, 4 = square...   star: spiky version
// r: radius px   spin: rad/s   point: face direction of travel
// inner: nested shape   orbit: # of satellites   eye: has an eye
// speed: tiles/s   hp/gold/armor are base values   leak: lives lost at the core
const ENEMIES = {
  grunt:    { name:'Block',   sides:4, r:9,   color:'#ff3d9a', speed:1.15, hp:34,  gold:4,  armor:0, leak:1, spin:0.8, eye:true, intro:1,
              desc:'The basic walker.' },
  scout:    { name:'Dart',    sides:3, r:7.5, color:'#8cff3d', speed:2.0,  hp:16,  gold:3,  armor:0, leak:1, spin:0, eye:true, point:true, trail:true, intro:2,
              desc:'Fast but fragile.' },
  splitter: { name:'Spore',   sides:0, r:11,  color:'#35ffb5', speed:0.95, hp:70,  gold:6,  armor:0, leak:1, spin:0, eye:true, orbit:3, split:{ type:'mite', n:3 }, intro:4,
              desc:'Splits into 3 Mites when destroyed. Reaching your core costs 4 lives: itself plus the 3 Mites inside.' },
  mite:     { name:'Mite',    sides:3, r:5,   color:'#35ffb5', speed:1.75, hp:12,  gold:1,  armor:0, leak:1, spin:3, child:true },
  brute:    { name:'Bulwark', sides:6, r:13,  color:'#a066ff', speed:0.72, hp:140, gold:11, armor:4, leak:2, spin:0.3, eye:true, thick:true, inner:{ sides:6, scale:0.55, spin:-0.6 }, intro:7,
              desc:'Armored. Small hits barely hurt it.' },
  boss:     { name:'Warden',  sides:5, star:true, r:22, color:'#ff2e4d', speed:0.5, hp:728, gold:120, armor:6, leak:5, spin:0.5, eye:true, boss:true, orbit:4, inner:{ sides:5, scale:0.45, spin:-1.2 }, intro:10,
              summon:{ every:4, types:['grunt', 'scout'] }, shareHp:520,   // v22: +40% health and summons (shareHp keeps each level's shield picks as they were)
              desc:'Boss. Heavy armor and huge health. Calls in more enemies as it walks.' },
  aegis:    { name:'Aegis',   sides:5, r:11,  color:'#4aa8ff', speed:0.85, hp:80,  gold:10, armor:0, leak:1, spin:0.5, eye:true, intro:12, dome:{ r:1.6, hp:170 },
              desc:'Projects a dome that travels with it. Enemies inside take 20% damage. EMP pops it.' },
  blink:    { name:'Blink',   sides:4, r:8.5, color:'#f4f2ff', speed:0.9,  hp:44,  gold:8,  armor:0, leak:1, spin:0, eye:true, blink:{ every:3.0, dist:1.5 }, intro:16,
              desc:'Teleports forward every few seconds.' },
  mender:   { name:'Mender',  sides:0, r:10,  color:'#ff9ce0', speed:0.85, hp:60,  gold:10, armor:0, leak:1, spin:0, plus:true, heal:{ every:2.6, radius:1.8, pct:0.12 }, intro:21,
              desc:'Heals nearby enemies. Take it out first.' },
  glider:   { name:'Glider',  sides:3, r:9,   color:'#9fe8ff', speed:0.95, hp:36,  gold:5,  armor:0, leak:1, spin:0, eye:true, point:true, flying:true, intro:32,
              desc:'Flies straight over the path. Only FLAK can hit it.' },
  titan:    { name:'Titan',   sides:8, r:17,  color:'#ff8a3d', speed:0.45, hp:420, gold:28, armor:7, leak:3, spin:0.2, eye:true, thick:true, inner:{ sides:4, scale:0.5, spin:0.8 }, intro:25,
              desc:'Huge, slow and heavily armored.' },
  volt:     { name:'Volt',    sides:3, star:true, r:10, color:'#f6ff3d', speed:1.0, hp:48, gold:8, armor:0, leak:1, spin:1.6, eye:true, elec:true, intro:37,
              desc:'Electrified: towers right next to it shut down for 4s. ARC gets supercharged instead. EMP shorts it out. A LIVE WIRE road charges it up.' },
  yeti:     { name:'Yeti',    sides:6, star:true, r:13, color:'#6fd8ff', speed:0.7, hp:130, gold:13, armor:2, leak:2, spin:0.35, eye:true, thick:true, ice:true, inner:{ sides:6, scale:0.45, spin:-0.8 }, intro:45,
              desc:'Throws snowballs at every tower in range each second. Hit towers fire much slower for 5s. FROST gets supercharged instead.' },
};
ENEMIES.scorch = { name:'Scorch', sides:4, star:true, r:10.5, color:'#ff7a1a', speed:1.05, hp:55, gold:9, armor:0, leak:1, spin:1.2, eye:true, fire:true, intro:52,
              desc:'On fire: tosses a fireball at a nearby tower every few seconds. A hit tower burns down (25% refund) unless TIDE or a FROST next to it puts it out.' };
// Carriers pay for what's inside (user, v27): a Spore that reaches the core costs its own life plus one per Mite in it (1 + 3 = 4)
const coreDamage = rc => rc.leak + (rc.split ? rc.split.n * ENEMIES[rc.split.type].leak : 0);
const ENEMY_ORDER = ['grunt', 'scout', 'splitter', 'brute', 'boss', 'aegis', 'blink', 'mender', 'titan', 'glider', 'volt', 'yeti', 'scorch'];

// ---- Electric and ice -----------------------------------------------
// ELECTRIFIED enemies (the Volt, plus a random enemy type on some levels) short out every tower
// within ELEC.r tiles: it stops working until 4s after the last electrified enemy touched it.
// ARC is the exception: it gets supercharged instead (fires faster, chains further).
// EMP lasers short out an electrified enemy for ELEC.off seconds.
const ELEC = { r: 1.3, time: 4, off: 4, arcRate: 1.6, arcChains: 3, arcJump: 2.2,
  wireR: 2, wireSpeed: 1.2, wireHp: 1.2 };   // v37: on a LIVE WIRE road an electrified enemy reaches 2 more tiles, moves 20% faster and gains 20% health (once)
// ICED enemies (the Yeti, plus a random type on some levels) throw a snowball at every tower within
// ICE.r tiles once a second. A hit tower fires at 40% speed for 5s. FROST is the exception: it gets
// supercharged, and each of its blasts adds a frost mark; 3 marks freeze the enemy solid for 0.5s
// (the marks reset once it thaws).
const ICE = { r: 2.0, every: 1, time: 5, slow: 0.4, marks: 3, freeze: 0.5 };
// BURNING enemies (the Scorch, plus a random type on some levels) toss a fireball, one at a time, every
// FIRE.every seconds at a tower within FIRE.r tiles (v26: 1.5x the old aura). A hit tower catches fire: it keeps
// working but loses health and burns down after FIRE.burn seconds, refunding 25% of what was spent on it.
// FROST never catches fire. Only water puts a tower out: a TIDE jet, or a FROST blast from a tile right next to it.
// TIDE's water also puts an enemy's flames out for good.
const FIRE = { r: 1.95, every: 3.5, burn: 30, refund: 0.25 };

// ---- Tower recipes -------------------------------------------------
// lv[0] is the base tower, lv[1..3] are upgrades (with their own cost).
// range in tiles, rate = shots per second. unlock = first level you can bring it.
// v31 (user): upgrades no longer make a tower fire faster. Range, splash, chains, beams, FROST's slow and PRISM's
// heat-up still improve; costs are unchanged. (Before v31 each upgrade added about +70-100% damage per second.)
// v32 (user): every tower's base damage is 25% higher than in v31, and each upgrade adds 10% of the tower's
// current damage: level 2 = x1.1, level 3 = x1.21, level 4 = x1.331 of the level-1 damage.
const TOWERS = {
  // v29 (user): BOLT does 20% less damage per second. It fires 20% slower (was 2.8 / 3.2 / 3.8 / 4.4 shots a second);
  // the damage per hit stays, so armor doesn't hit it any harder than before
  // v35 (user): crits follow a pattern instead of a 10% chance. crits = how many of every 4 shots crit (the last ones
  // in each group of 4): level 1 every 4th shot, level 2 the 3rd and 4th, level 3 the 2nd to 4th. A crit does x2.5 damage.
  // v36 (user): level 4 is the MASTER BOLT: it keeps 3 of 4 crits, fires 35% faster and looks different (gold, twin barrels).
  bolt:   { name:'BOLT',   color:'#2ef2ff', sides:4, cost:50,  critMul:2.5, unlock:1, desc:'Rapid laser. Every 4th shot crits; each upgrade crits one more. Level 4: MASTER BOLT, 35% faster.',
            lv:[ { dmg:7.5,  rate:2.24, range:2.3, crits:1 },
                 { cost:60,  dmg:8.25, rate:2.24, range:2.5, crits:2 },
                 { cost:120, dmg:9.08, rate:2.24, range:2.8, crits:3 },
                 { cost:200, dmg:9.98, rate:3.02, range:3.0, crits:3, master:true } ] },
  frost:  { name:'FROST',  color:'#a3b8ff', sides:6, star:true, cost:70, unlock:3, pulse:true, desc:'Freezing pulse that slows all nearby. Never burns, and puts out fires right next to it.',
            lv:[ { dmg:5,  rate:1.0, range:1.8, slow:0.35 },
                 { cost:80,  dmg:5.5,  rate:1.0, range:2.0, slow:0.45 },
                 { cost:140, dmg:6.05, rate:1.0, range:2.2, slow:0.55, brittle:true },
                 { cost:220, dmg:6.66, rate:1.0, range:2.4, slow:0.65, brittle:true } ] },
  // v27 (user): NOVA fires 35% slower (was 0.52 / 0.57 / 0.63 / 0.7 shots a second)
  // v30 (user): 30% less damage per hit (was 26 / 46 / 78 / 120) and 15% slower again (was 0.34 / 0.37 / 0.41 / 0.46)
  nova:   { name:'NOVA',   color:'#ff7a2e', sides:6, cost:110, unlock:6, desc:'Plasma bomb. Splash, pierces armor.',
            lv:[ { dmg:22.5, rate:0.29, range:3.0, splash:0.9 },
                 { cost:120, dmg:24.75, rate:0.29, range:3.2, splash:1.02 },
                 { cost:200, dmg:27.23, rate:0.29, range:3.5, splash:1.2 },
                 { cost:300, dmg:29.95, rate:0.29, range:3.8, splash:1.35 } ] },
  // v37 (user): each upgrade fires 20% faster (0.9 / 1.08 / 1.3 zaps a second). Level 4 transforms into the LIVE WIRE:
  // no more chain zaps; it electrifies the whole route(s) passing through its range and hits every ground enemy on
  // them, always at level 3's rate (supercharge and snow don't change it). Electrified enemies feed on it instead (ELEC.wire*).
  arc:    { name:'ARC',    color:'#ffe23d', sides:3, cost:85,  unlock:9, desc:'Chain lightning; each upgrade fires faster. Electrified enemies supercharge it. Level 4: LIVE WIRE, electrifies its whole road.',
            lv:[ { dmg:17.5, rate:0.9,  range:2.3, chains:3 },
                 { cost:100, dmg:19.25, rate:1.08, range:2.4, chains:4 },
                 { cost:170, dmg:21.18, rate:1.3, range:2.6, chains:6 },
                 { cost:260, dmg:23.29, rate:1.3, range:2.8, wire:true } ] },
  mint:   { name:'MINT',   color:'#ffd23d', sides:6, cost:80,  unlock:13, eco:true, desc:'Pulses out gold while waves run.',
            lv:[ { gold:7,  every:3 },
                 { cost:90,  gold:11, every:2.5 },
                 { cost:140, gold:15, every:2 },
                 { cost:220, gold:20, every:1.8 } ] },
  prism:  { name:'PRISM',  color:'#ff5cf0', sides:4, star:true, cost:120, unlock:17, desc:'Beam heats up on one target. Goes through armor and shields.',
            // v29 (user): PRISM does 20% less damage per second (was 16 / 27 / 44 / 68 before heating up)
            lv:[ { dps:16, range:2.3, heat:3 },
                 { cost:130, dps:17.6, range:2.5, heat:3.5 },
                 { cost:200, dps:19.36, range:2.7, heat:4 },
                 { cost:300, dps:21.3, range:2.9, heat:4.5 } ] },
  rail:   { name:'RAIL',   color:'#6dff8e', sides:4, cost:130, unlock:22, line:true, desc:'Fires down one fixed line, piercing all on it.',
            lv:[ { dmg:80,  rate:0.46, range:4.5 },
                 { cost:140, dmg:88, rate:0.46,  range:5.0 },
                 { cost:210, dmg:96.8, rate:0.46, range:5.5 },
                 { cost:320, dmg:106.48, rate:0.46,  range:6.0 } ] },
  beacon: { name:'BEACON', color:'#f4f0ff', sides:8, cost:90, unlock:27, support:true, desc:'Boosts damage of towers next to it.',
            lv:[ { buff:0.3,  range:1.5 },
                 { cost:100, buff:0.5,  range:1.5 },
                 { cost:160, buff:0.75, range:2.3 },
                 { cost:240, buff:1.0,  range:2.3 } ] },
};
TOWERS.flak = { name:'FLAK', color:'#ff6f61', sides:3, cost:90, unlock:32, air:true, desc:'Anti-air missiles. The only tower that hits flyers.',
            lv:[ { dmg:20, rate:1.3, range:3.2, splash:0.6 },
                 { cost:100, dmg:22, rate:1.3, range:3.5, splash:0.7 },
                 { cost:160, dmg:24.2, rate:1.3, range:3.8, splash:0.8 },
                 { cost:240, dmg:26.62, rate:1.3, range:4.1, splash:0.9 } ] };
// EMP: up to 4 lasers per shot that go for shields first (personal shields, Aegis domes, electrified
// enemies). A hit strips the shield for good, pops the dome, or shorts out the electricity. Tiny damage.
TOWERS.emp = { name:'EMP', color:'#3d7bff', sides:5, cost:75, unlock:12, shieldBreak:true, beams:4, desc:'Up to 4 lasers that hunt shields. Strips them, pops domes, shorts out electrified enemies. Barely any damage.',
            lv:[ { dmg:1.25,   rate:1.1, range:2.4, beams:4 },
                 { cost:85,  dmg:1.38, rate:1.1, range:2.7, beams:4 },
                 { cost:140, dmg:1.51,   rate:1.1, range:3.0, beams:4 },
                 { cost:200, dmg:1.66,   rate:1.1, range:3.3, beams:4 } ] };
// PYRO (fire): a short flame jet with a little splash; burns cold enemies (Yetis, iced enemies) for triple damage.
TOWERS.pyro = { name:'PYRO', color:'#ff4a12', sides:3, cost:95, unlock:47, cold:3, desc:'Flame jet with a little splash. Triple damage to cold enemies.',
            lv:[ { dmg:11.25,  rate:2.0, range:2.0, splash:0.6 },
                 { cost:90,  dmg:12.38, rate:2.0, range:2.1, splash:0.65 },
                 { cost:150, dmg:13.61, rate:2.0, range:2.3, splash:0.7 },
                 { cost:230, dmg:14.97, rate:2.0, range:2.5, splash:0.8 } ] };
// TIDE (water): water jets that go for burning enemies first and put their flames out for good. Tiny damage.
TOWERS.tide = { name:'TIDE', color:'#1ec8a5', sides:6, cost:80, unlock:52, douse:true, beams:2, desc:'Water jets that put out burning towers, and burning enemies for good. Barely any damage.',
            lv:[ { dmg:3.75,  rate:1.0, range:2.4, beams:2 },
                 { cost:80,  dmg:4.12,  rate:1.0, range:2.6, beams:2 },
                 { cost:130, dmg:4.54,  rate:1.0, range:2.8, beams:3 },
                 { cost:200, dmg:4.99, rate:1.0, range:3.0, beams:3 } ] };
// Shields shrug off ordinary hits: only 20% of normal damage gets into a shield.
// Two kinds: personal shields (random enemy types per level, worth 60% of their HP)
// and the Aegis dome (covers every ground enemy near the Aegis while it lives).
// An EMP laser strips both for good; PRISM's beam goes straight through.
// Light shield levels use thinner shields (25% of HP) so you can get by without a shield buster.
const SHIELD_FACTOR = 0.2, SHIELD_PCT = 0.9, SHIELD_PCT_LIGHT = 0.25;
const TOWER_ORDER = ['bolt', 'frost', 'nova', 'arc', 'emp', 'mint', 'prism', 'rail', 'beacon', 'flak', 'pyro', 'tide'];

// ---- Level conditions ------------------------------------------------
// NO BOUNTY: enemies drop no gold (Mint is your income). AIR RAID: Gliders fly in (only FLAK hits them).
const NO_BOUNTY_LEVELS = [14, 23, 29, 36, 43, 48, 55, 62, 67, 74, 79];
const AIR_LEVELS = [32, 34, 38, 41, 44, 46, 50, 53, 57, 60, 64, 66, 69, 72, 75, 78, 80];
// HEATWAVE: FROST can't be used. RAINSTORM: PYRO can't be used, and lightning strikes every new ARC (a free upgrade).
const HEAT_LEVELS = [24, 28, 35, 42, 56, 65, 71, 77];
const RAIN_LEVELS = [49, 51, 54, 58, 61, 63, 68, 73, 76];
const CONDITIONS = {
  noBounty: { tag:'NO BOUNTY', color:'#ffd23d', need:'mint', line:'Enemies drop no gold. MINT is your only income.' },
  air:      { tag:'AIR RAID',  color:'#9fe8ff', need:'flak', line:'Gliders fly over the path. Only FLAK can hit them.' },
  shielded: { tag:'HEAVY SHIELDS', color:'#4aa8ff', need:['emp', 'prism'], line:'Lots of shielded enemies. Bring EMP or PRISM.' },
  heat:     { tag:'HEATWAVE',  color:'#ff8a3d', ban:'frost', line:'Too hot for FROST: it can\'t be used here.' },
  rain:     { tag:'RAINSTORM', color:'#7fb6ff', ban:'pyro',  line:'No PYRO in the rain. Lightning strikes each new ARC: a free upgrade.' },
  // Playtest Lab economy rules (shown like conditions, nothing required)
  lean:     { tag:'LEAN ECONOMY', color:'#ffd23d', line:'Kills pay {0}%. Clear a wave with no leaks for a bonus.' },
  payday:   { tag:'PAYDAY', color:'#ffd23d', line:'Kills pay nothing. Each wave pays a wage, less if anything leaks.' },
};
const slotsFor = level => level >= 20 ? 4 : 3;     // loadout slots
const SLOT_UNLOCK_LEVEL = 20;

// ---- Economy -------------------------------------------------------
const ECON = {
  startLives: 10, sellRate: 0.7,
  hpScale: 1.1,           // global difficulty knob (1.2 = 20% tougher enemies). v30 (user): every enemy +10% health
  nextDelay: 12,          // seconds before the next wave auto-starts
  earlyBonus: 1.5,        // gold per second left when you call a wave early
  clearBonus: w => 6 + 2 * w,
  goldRate: 0.9,          // v24 (user): every gold income (kills, combos, wave clears, early calls, Mint) pays 10% less
  groupGap: 1.4,
};
// Stars: 3 = no lives lost, 2 = lost 3 or fewer, 1 = survived
const starsForLives = (lives, max) => lives <= 0 ? 0 : lives >= max ? 3 : lives >= max - 3 ? 2 : 1;
// =====================================================================
//  LANGUAGES: English + 简体中文. tr('id', args...) looks up a line.
// =====================================================================
const LANGS = { en: 'English', zh: '中文', es: 'Español' };
let LANG = 'en', LANG_CHOSEN = false;
try { const l = localStorage.getItem('shatterline.lang'); if (LANGS[l]) { LANG = l; LANG_CHOSEN = true; } } catch (e) {}
function setLang(l) {
  LANG = l; LANG_CHOSEN = true;

function tr(id, ...a) {
  const s = (STR[LANG] && STR[LANG][id]) || STR.en[id] || id;
  return s.replace(/\{(\d)\}/g, (_, i) => a[i] != null ? a[i] : '');
}

function seeded(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
function expandTiles(pts) {
  const out = [pts[0].slice()];
  for (let i = 1; i < pts.length; i++) {
    const [c0, r0] = pts[i - 1], [c1, r1] = pts[i], n = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0));
    for (let k = 1; k <= n; k++) out.push([c0 + Math.sign(c1 - c0) * k, r0 + Math.sign(r1 - r0) * k]);
  }
  return out;
}
function compressTiles(t) {
  const out = [t[0]];
  for (let i = 1; i < t.length - 1; i++) {
    const a = t[i - 1], b = t[i], c = t[i + 1];
    if (b[0] - a[0] !== c[0] - b[0] || b[1] - a[1] !== c[1] - b[1]) out.push(b);
  }
  out.push(t[t.length - 1]);
  return out;
}

function shieldPlan(L, noBounty, air) {
  if (L < 12) return null;
  if (L === 12) return { heavy: true, aegis: true, types: 0 };        // Aegis + EMP arrive together
  if (L === 17) return { heavy: false, types: 1 };                    // first light shields (Prism unlocks too)
  const R = seeded(L * 104729 + 77);
  const pHeavy = noBounty || air ? (L > 40 ? 0.25 : 0) : L >= 21 ? 0.4 : 0.45;
  if (R() < pHeavy) {
    if (L < 17 || R() < 0.5) return { heavy: true, aegis: true, types: L >= 30 ? 1 : 0 };

      const n = pick(g.ch); tone({ type:'sine', f0:nf(n, 2), dur:0.07, vol:0.055, at:g.at }); tone({ type:'sine', f0:nf(n, 3), dur:0.12, vol:0.03, at:g.at + 0.04 });

    sell()   { const g = grid(32), sp = sixteenth() / 2; [g.ch[2] + 12, g.ch[1] + 12, g.ch[0] + 12].forEach((n, i) => tone({ type:'triangle', f0:nf(n, 1), dur:0.09, vol:0.1, at:g.at + i * sp })); },
    leak()   { const g = grid(16), f = nf(g.ch[0], -2); tone({ type:'sawtooth', f0:f * 1.5, f1:f / 2, dur:0.42, vol:0.22, at:g.at }); noise({ dur:0.32, vol:0.2, type:'lowpass', f0:700, f1:90, at:g.at }); },
    wave()   { const g = grid(4), f = nf(g.ch[0], -2); noise({ dur:0.65, vol:0.12, type:'bandpass', f0:260, f1:3200, q:2, at:g.at }); tone({ type:'sawtooth', f0:f, f1:f * 4, dur:0.55, vol:0.07, at:g.at }); },
    boss()   {

    bossDie(){

    combo(level) {

      g.ch.forEach(n => tone({ type:'square', f0:nf(n, 1 + (level >= 2 ? 1 : 0)), dur:0.24, vol:0.045, at:g.at }));

    },
    clear()  { const g = grid(4), sp = sixteenth(); [g.ch[0], g.ch[1], g.ch[2], g.ch[0] + 12].forEach((n, i) => tone({ type:'triangle', f0:nf(n, 1), dur:0.18, vol:0.08, at:g.at + i * sp })); },
    tap()    { if (!ok('tap', 40)) return; const g = grid(0), f = nf(g.ch[2], 1); tone({ type:'sine', f0:f * 2, f1:f * 1.5, dur:0.045, vol:0.05 }); },
    deny()   { if (!ok('deny', 120)) return; const g = grid(0), f = nf(g.ch[0], -2); tone({ type:'square', f0:f * 1.5, f1:f, dur:0.12, vol:0.06 }); },
    lose()   { tone({ type:'sawtooth', f0:220, f1:38, dur:1.5, vol:0.24 }); noise({ dur:1.3, vol:0.35, type:'lowpass', f0:3000, f1:70 }); },
    rail()   {

      noise({ dur:0.3, vol:0.28, type:'bandpass', f0:5000, f1:600, q:1.5, at:g.at });
      tone({ type:'sawtooth', f0:nf(g.ch[2], 2), f1:nf(g.ch[0], -2), dur:0.28, vol:0.09, at:g.at });

    },
    beam(h)  { hum(h); },
    blink()  { if (!ok('blink', 60)) return; const g = grid(32); if (!slot('blink', g.at)) return; const f = nf(pick(g.ch), 2); tone({ type:'sine', f0:f, f1:f / 4, dur:0.12, vol:0.055, at:g.at }); noise({ dur:0.08, vol:0.045, type:'highpass', f0:5000, at:g.at }); },
    heal()   { if (!ok('heal', 160)) return; const g = grid(16); tone({ type:'sine', f0:nf(g.ch[0], 1), f1:nf(g.ch[2], 1), dur:0.25, vol:0.05, at:g.at }); tone({ type:'sine', f0:nf(g.ch[2], 1), f1:nf(g.ch[0], 2), dur:0.25, vol:0.04, at:g.at + 0.08 }); },
    shield() { if (!ok('shield', 70)) return; const g = grid(32); if (!slot('shield', g.at)) return; noise({ dur:0.25, vol:0.2, type:'highpass', f0:2500, f1:6000, at:g.at }); tone({ type:'triangle', f0:nf(g.ch[0], 3), f1:nf(g.ch[0], 2), dur:0.2, vol:0.06, at:g.at }); },
    mint()   {                                 // gold generating: a chord arpeggio on the next 8th

      [g.ch[0], g.ch[1], g.ch[2]].forEach((n, i) => tone({ type:'sine', f0:nf(n, 2), dur:0.1, vol:0.05, at:g.at + i * sp }));
    },
    flak()   { if (!ok('flak', 50)) return; const g = grid(16); if (!slot('flak', g.at)) return; noise({ dur:0.16, vol:0.13, type:'bandpass', f0:900, f1:2600, q:1.4, at:g.at }); const f = nf(pick(g.ch), -1); tone({ type:'triangle', f0:f, f1:f * 2, dur:0.1, vol:0.05, at:g.at }); },
    flakHit(){ if (!ok('flakHit', 40)) return; const g = grid(32); if (!slot('flakHit', g.at)) return; noise({ dur:0.14, vol:0.17, type:'lowpass', f0:3200, f1:400, at:g.at }); const f = nf(pick(g.ch), 1); tone({ type:'square', f0:f, f1:f / 2, dur:0.06, vol:0.04, at:g.at }); },
    emp()    {
      if (!ok('emp', 70)) return; const g = grid(16); if (!slot('emp', g.at)) return;
      noise({ dur:0.22, vol:0.17, type:'bandpass', f0:600, f1:4200, q:3, at:g.at });
      const f = nf(g.ch[0], -3); tone({ type:'square', f0:f, f1:f * 2, dur:0.18, vol:0.06, at:g.at }); tone({ type:'sine', f0:nf(g.ch[2], 2), f1:nf(g.ch[2], 1), dur:0.12, vol:0.04, at:g.at + 0.03 });
    },
    flame()  {                                 // PYRO: a breathy whoosh with a low chord-root growl, on 16ths
      if (!ok('flame', 45)) return; const g = grid(16); if (!slot('flame', g.at)) return;
      noise({ dur:0.16, vol:0.1, type:'bandpass', f0:700, f1:1600, q:0.8, at:g.at });
      const f = nf(g.ch[0], -2); tone({ type:'sawtooth', f0:f, f1:f * 0.9, dur:0.12, vol:0.035, at:g.at });
    },
    splash() {                                 // TIDE: a watery splash with a chord-tone bubble
      if (!ok('splash', 60)) return; const g = grid(16); if (!slot('splash', g.at)) return;
      noise({ dur:0.18, vol:0.09, type:'lowpass', f0:2400, f1:500, at:g.at });
      const f = nf(pick(g.ch), 1); tone({ type:'sine', f0:f * 0.8, f1:f * 1.3, dur:0.09, vol:0.04, at:g.at + 0.02 });
    },
    ignite() {                                 // a tower catches fire
      if (!ok('ignite', 150)) return; const g = grid(16);
      noise({ dur:0.4, vol:0.14, type:'bandpass', f0:400, f1:1800, q:0.9, at:g.at });
      tone({ type:'sawtooth', f0:nf(g.ch[0], -1), f1:nf(g.ch[2], 0), dur:0.3, vol:0.05, at:g.at });
    },
    burnDown() {                               // a tower burns out: a crumbling thump
      const g = grid(8), f = nf(g.ch[0], -3);
      noise({ dur:0.6, vol:0.22, type:'lowpass', f0:1400, f1:120, at:g.at }); tone({ type:'sine', f0:f * 2, f1:f / 2, dur:0.5, vol:0.2, at:g.at });
    },
    stamp() {                                  // lab COMPLETED stamp: a sharp crack and a heavy thud
      noise({ dur:0.05, vol:0.4, type:'highpass', f0:2800 });
      noise({ dur:0.55, vol:0.5, type:'lowpass', f0:1900, f1:70, q:0.8 });
      tone({ type:'sine', f0:160, f1:36, dur:0.5, vol:0.75 }); tone({ type:'square', f0:95, f1:44, dur:0.12, vol:0.12 });
    },
    thunder() {                                // RAINSTORM: a crack and a long rumble
      if (!ok('thunder', 400)) return;
      noise({ dur:0.12, vol:0.25, type:'highpass', f0:2500 }); noise({ dur:1.6, vol:0.3, type:'lowpass', f0:500, f1:60, at:0.05, attack:0.05 });
    },
    summon() {                                 // the Warden calls in enemies: a dark swell on the beat
      if (!ok('summon', 300)) return; const g = grid(8), f = nf(g.ch[0], -2);
      tone({ type:'sawtooth', f0:f / 2, f1:f, dur:0.45, vol:0.1, at:g.at, attack:0.08 });
      noise({ dur:0.4, vol:0.1, type:'bandpass', f0:300, f1:1400, q:1.5, at:g.at });
    },
    snow()   {                                 // a soft snowball thump with a chord-tone glint
      if (!ok('snow', 120)) return; const g = grid(16); if (!slot('snow', g.at)) return;
      noise({ dur:0.14, vol:0.07, type:'bandpass', f0:1400, f1:500, q:0.9, at:g.at });
      tone({ type:'sine', f0:nf(pick(g.ch), 2), f1:nf(g.ch[0], 1), dur:0.12, vol:0.035, at:g.at });
    },
    freeze() {                                 // frozen solid: an icy chime
      if (!ok('freeze', 90)) return; const g = grid(32); if (!slot('freeze', g.at)) return;
      tone({ type:'triangle', f0:nf(g.ch[2], 3), dur:0.22, vol:0.05, at:g.at }); tone({ type:'sine', f0:nf(g.ch[0], 3), dur:0.3, vol:0.04, at:g.at + 0.04 });
      noise({ dur:0.18, vol:0.08, type:'highpass', f0:7000, at:g.at });
    },
    short()  {                                 // a tower shorts out: a falling buzz
      if (!ok('short', 150)) return; const g = grid(16);
      noise({ dur:0.2, vol:0.12, type:'bandpass', f0:2400, f1:300, q:2, at:g.at });
      const f = nf(g.ch[0], -2); tone({ type:'square', f0:f * 2, f1:f / 2, dur:0.25, vol:0.05, at:g.at });
    },
    charge() {                                 // ARC or FROST supercharged: a rising zap and two chord notes
      if (!ok('charge', 150)) return; const g = grid(16);
      noise({ dur:0.2, vol:0.1, type:'bandpass', f0:600, f1:4000, q:2, at:g.at });
      [g.ch[0], g.ch[2]].forEach((n, i) => tone({ type:'square', f0:nf(n, 1), dur:0.08, vol:0.04, at:g.at + i * sixteenth() / 2 }));
    },
    unlock() { const g = grid(0); [g.ch[0], g.ch[1], g.ch[2], g.ch[0] + 12, g.ch[1] + 12, g.ch[2] + 12].forEach((n, i) => tone({ type:'square', f0:nf(n, 1), dur:0.16, vol:0.05, at:i * 0.07 })); tone({ type:'sine', f0:nf(g.ch[0], 3), dur:0.6, vol:0.05, at:0.42 }); },
    star(i)  { const f = [1047, 1319, 1568][i] || 1568; tone({ type:'triangle', f0:f, dur:0.25, vol:0.12 }); tone({ type:'sine', f0:f * 2, dur:0.3, vol:0.05, at:0.03 }); noise({ dur:0.15, vol:0.08, type:'highpass', f0:6000 }); },
    pop()    { tone({ type:'sine', f0:523, f1:1047, dur:0.12, vol:0.1 }); noise({ dur:0.1, vol:0.06, type:'highpass', f0:3000 }); },
    swoosh() { if (!ok('swoosh', 120)) return; noise({ dur:0.22, vol:0.08, type:'bandpass', f0:600, f1:2400, q:1.2 }); },
    win()    { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone({ type:'square', f0:f, dur:0.2, vol:0.055, at:i * 0.11 })); },
    kill(combo) {
      if (!ok('kill', 30)) return;

  function play(name, ...args) {
    if (!ac || muted || !enabled || ac.state !== 'running') return;
    try { fx[name](...args); } catch (e) { if (window.__TD_DEBUG) console.error('sound ' + name, e.message); }
  }

  // ---- Music: a step sequencer that follows the fight ---------------------------------
  // `int` (0..1) rises as the wave swells (later, bigger waves and more enemies on screen):
  // layers join, the filter opens, the beat speeds up and the pads pump against the kick.
  // While a boss is alive the boss theme takes over at full power: darker chords, faster,
  // heavier bass, a lead line and snare rolls.
  const SONGS = {
    main: { chords: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]], roots: [0, -4, 3, -2] },     // Am  F  C  G
    boss: { chords: [[0, 3, 7], [1, 5, 8], [-2, 2, 5], [-5, -1, 2]], roots: [0, 1, -2, -5] },      // Am  Bb G  E
  };
  const BOSS_LEAD = [12, null, 15, 12, 19, null, 17, 15, 13, null, 12, 10, 11, null, 14, null];   // per 8th, per bar pair
  const seq = { on:false, next:0, step:0, timer:null, int:0, target:0, boss:false, bpm:100, slots:{} };
  let pump = null, padF = null, echo = null, echoFb = null, mel = null;
  function musicBus() {
    if (pump) return;
    pump = ac.createGain(); pump.gain.value = 1; pump.connect(music);                // sidechain pump
    bassF.disconnect(); bassF.connect(pump); arpF.disconnect(); arpF.connect(pump);
    padF = ac.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 700; padF.Q.value = 0.7; padF.connect(pump);
    // melody bus with a dotted-8th echo, so kill notes ring out like a lead line
    mel = ac.createGain(); mel.gain.value = 1; mel.connect(sfx);
    echo = ac.createDelay(1); echoFb = ac.createGain(); echoFb.gain.value = 0.28;
    const echoOut = ac.createGain(); echoOut.gain.value = 0.35;
    mel.connect(echo); echo.connect(echoFb); echoFb.connect(echo); echo.connect(echoOut); echoOut.connect(sfx);
  }
  const song = () => seq.boss ? SONGS.boss : SONGS.main;
  const spbNow = () => 60 / seq.bpm / 4;

  function schedStep(s, t) {
    const bar = Math.floor(s / 16) % 4, st = s % 16, S = song(), root = S.roots[bar], ch = S.chords[bar];
    const I = seq.boss ? 1 : seq.int, B = seq.boss, at = t - ac.currentTime, spb = spbNow();
    if (window.__sfxLog) (window.__stepLog = window.__stepLog || []).push({ t, ch });                // test hook
    humStep(t, st, spb);
    const kick = I >= 0.15 && (st % 4 === 0 || (I >= 0.75 && st === 14) || (B && st === 10));
    if (kick) {
      tone({ type:'sine', f0: B ? 170 : 150, f1:40, dur:0.16, vol:0.85, at, bus:music });
      if (I >= 0.3) { pump.gain.setValueAtTime(0.35, t); pump.gain.linearRampToValueAtTime(1, t + spb * 2.6); }
    }
    // hats: offbeat 8ths, then 16ths
    if (I >= 0.3 && st % 4 === 2) noise({ dur:0.035, vol:0.22, type:'highpass', f0:7200, at, bus:music });
    else if (I >= 0.6 && st % 2 === 1) noise({ dur:0.02, vol:0.09, type:'highpass', f0:8500, at, bus:music });
    // snare / clap on 2 and 4, rolls into the next loop when it's hot
    if (I >= 0.45 && (st === 4 || st === 12)) noise({ dur:0.13, vol:0.32, type:'bandpass', f0:1500, q:1.2, at, bus:music });
    if ((I >= 0.85 || B) && bar === 3 && st >= 12) noise({ dur:0.06, vol:0.1 + (st - 12) * 0.05, type:'bandpass', f0:1700, q:1.2, at, bus:music });
    if (B && st % 4 === 3) noise({ dur:0.04, vol:0.08, type:'bandpass', f0:1900, q:1, at, bus:music });     // ghost notes
    // pad: the chord held through the bar
    if (st === 0) for (const n of ch) for (const d of [-7, 7]) {
      const f = 220 * Math.pow(2, n / 12) * Math.pow(2, d / 1200);
      tone({ type:'sawtooth', f0:f, dur:spb * 16, vol: (B ? 0.05 : 0.035) * (0.6 + I * 0.6), at, bus:padF, attack: spb * 3 });
    }
    // bass: the groove, doubling up to 16th-note octave bounce when intense
    const bassHit = [0, 3, 6, 8, 11, 14].includes(st) || (I >= 0.65 && st % 2 === 0) || B;
    if (bassHit) {
      const up = st === 8 || (I >= 0.65 && st % 4 === 2) || (B && st % 2 === 1);
      const f = 55 * Math.pow(2, (root + (up ? 12 : 0)) / 12);
      tone({ type: B ? 'square' : 'sawtooth', f0:f, dur:spb * (B ? 0.9 : 1.7), vol: I >= 0.15 ? 0.22 : 0.15, at, bus:bassF });
      if (B) tone({ type:'sawtooth', f0:f * 0.5, dur:spb * 0.9, vol:0.12, at, bus:bassF });
    }
    // arp: 8ths, then 16ths
    if (I >= 0.55 && (st % 2 === 0 || I >= 0.8)) {
      const n = ch[(st >> (I >= 0.8 ? 0 : 1)) % 3] + (st >= 8 ? 12 : 0);
      tone({ type:'square', f0:440 * Math.pow(2, n / 12), dur:0.08, vol: B ? 0.05 : 0.04, at, bus:arpF });
    }
    // lead: a hook on top, only at the peak and in boss fights
    if ((B || I >= 0.92) && st % 2 === 0) {
      const n = B ? BOSS_LEAD[((bar % 2) * 16 + st) / 2 % 16] : [ch[2] + 12, null, ch[0] + 24, null][(st / 2) % 4];
      if (n != null) tone({ type:'sawtooth', f0:440 * Math.pow(2, n / 12), dur:spb * 1.8, vol:0.035, at, bus:arpF, attack:0.01 });
    }
  }
  function tick() {
    if (!ac || !seq.on) return;
    // intensity eases toward its target: quick to rise, slow to fall
    const d = seq.target - seq.int;
    seq.int += d > 0 ? Math.min(d, 0.012) : Math.max(d, -0.004);
    const bpmT = seq.boss ? 132 : 100 + 18 * seq.int;
    seq.bpm += (bpmT - seq.bpm) * 0.05;
    const spb = spbNow();
    padF.frequency.setTargetAtTime(seq.boss ? 3200 : 600 + seq.int * 3000, ac.currentTime, 0.3);
    arpF.frequency.setTargetAtTime(seq.boss ? 3600 : 1400 + seq.int * 2400, ac.currentTime, 0.3);
    echo.delayTime.setTargetAtTime(spb * 3, ac.currentTime, 0.1);
    if (seq.next < ac.currentTime - 0.2) seq.next = ac.currentTime + 0.05;
    while (seq.next < ac.currentTime + 0.15) { schedStep(seq.step, seq.next); seq.next += spb; seq.step++; }
  }

  // ---- Kills play the melody ------------------------------------------------------------
  // Each kill's note lands on the next 16th of the beat and is a tone of the chord playing
  // right then; a combo climbs the arpeggio. (The click of the hit itself stays instant.)
  function killNote(combo) {
    musicBus();
    const now = ac.currentTime;
    let t = now, step = 0;
    if (seq.on) {
      const spb = spbNow(), j = Math.floor((seq.next - now - 0.004) / spb);
      t = seq.next - j * spb; step = seq.step - j;
      // at most two notes per 16th; extra kills spill onto the next steps as a little run
      for (let k = 0; k < 3 && (seq.slots[step] || 0) >= 2; k++) { step++; t += spb; }
      seq.slots[step] = (seq.slots[step] || 0) + 1;
      if (Object.keys(seq.slots).length > 64) seq.slots = { [step]: seq.slots[step] };
    }
    const ch = song().chords[Math.floor(step / 16) % 4];
    const arp = [ch[0], ch[1], ch[2], ch[0] + 12, ch[1] + 12, ch[2] + 12, ch[0] + 24, ch[1] + 24];
    const n = Math.max(0, combo - 1), idx = n < arp.length ? n : 5 + (n % 3);
    const f = 440 * Math.pow(2, arp[idx] / 12);
    tone({ type:'triangle', f0:f, f1:f * 0.985, dur:0.16, vol:0.14, at:t - now, bus:mel });
    (seq.notes = seq.notes || []).push({ at: t, step, semi: arp[idx], chord: ch }); if (seq.notes.length > 40) seq.notes.shift();
    tone({ type:'sine', f0:f * 2, dur:0.1, vol:0.035, at:t - now + 0.01, bus:mel });
  }

  return {
    init, play,
    get ready() { return !!ac && ac.state === 'running'; },
    get muted() { return muted; },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.85, ac.currentTime, 0.02); },
    setEnabled(e) { enabled = e; },
    _hum() { return HUM; },              // test hook: Prism hum voice
    musicOn() { if (!ac || seq.on) return; musicBus(); seq.on = true; seq.next = ac.currentTime + 0.06; if (!seq.timer) seq.timer = setInterval(tick, 30); },
    musicOff() { seq.on = false; },
    setIntensity(x, snap) { seq.target = Math.max(0, Math.min(1, x)); if (snap) seq.int = seq.target; },
    setBoss(b) { seq.boss = !!b; },
    setLevel(w, boss) { seq.target = Math.min(1, w / 20); seq.boss = !!boss; },     // old API (title demo)
    _music() { return seq; },            // test hooks

      ctx.moveTo(x + nx * sd - ax * back, y + ny * sd - ay * back);
      ctx.lineTo(x + nx * sd + ax * (13 - back) * s, y + ny * sd + ay * (13 - back) * s);
      ctx.lineCap = 'round'; ctx.lineWidth = 4.5 * s; ctx.strokeStyle = '#0b0a1a'; ctx.stroke(); neon(c, 2.6 * s); ctx.lineCap = 'butt';
    }
    shapePath(x, y, 9 * s * k, 3, false, aim + Math.PI / 2);
    ctx.fillStyle = '#0b0a1a'; ctx.fill(); ctx.fillStyle = hexA(c, 0.28); ctx.fill(); neon(c, 1.8);
    ctx.beginPath(); ctx.arc(x, y, 2.4 + lv * 0.5, 0, TAU); ctx.fillStyle = '#ffe4e0'; ctx.fill();
  } else if (type === 'emp') {
    polyPath(x, y, 10 * s * k, 5, t * 0.3);
    ctx.fillStyle = '#0b0a1a'; ctx.fill(); ctx.fillStyle = hexA(c, 0.25); ctx.fill(); neon(c, 1.8);
    for (let i = 0; i < 3; i++) {                        // spinning coil arcs
      const a = t * 3 + i * TAU / 3;
      ctx.beginPath(); ctx.arc(x, y, 6.5 * s, a, a + 1.2); ctx.lineWidth = 1.8; ctx.strokeStyle = '#b8d0ff'; ctx.stroke();
    }
    additive(true); glow(x, y, 10 + (o.kick || 0) * 14, c, 0.8); additive(false);
    ctx.beginPath(); ctx.arc(x, y, 2.6 + lv * 0.5, 0, TAU); ctx.fillStyle = '#e8f0ff'; ctx.fill();
  } else if (type === 'mint') {
    if (o.charge != null) {
      ctx.beginPath(); ctx.arc(x, y, 15.5 * s, -Math.PI / 2, -Math.PI / 2 + TAU * o.charge);
      ctx.lineWidth = 2.2; ctx.strokeStyle = hexA(c, 0.35 + 0.6 * o.charge); ctx.stroke();
    }
    polyPath(x, y, 10 * s * k, 6, t * 0.4);
    ctx.fillStyle = '#2a1e02'; ctx.fill(); ctx.fillStyle = hexA(c, 0.25); ctx.fill(); neon(c, 2);
    ctx.beginPath(); ctx.arc(x, y, 4.5 * s, 0, TAU); ctx.fillStyle = hexA(c, 0.85); ctx.fill();
    const gl = (t * 0.7) % 1;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, 4.5 * s, 0, TAU); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x - 6 + gl * 12, y - 6, 2.5, 12); ctx.restore();
  } else if (type === 'prism') {
    const heat = o.heat || 0;
    additive(true); glow(x, y, 14 + heat * 10, c, 0.3 + heat * 0.5); additive(false);
    starPath(x, y, 11 * s * k, 4.5 * s, 4, aim + Math.PI / 4);
    ctx.fillStyle = hexA(c, 0.25 + heat * 0.3); ctx.fill(); neon(c, 1.8);
    ctx.beginPath(); ctx.arc(x, y, 2.6 + heat * 1.5, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
  } else if (type === 'rail') {
    const back = (o.kick || 0) * 5, nx = -ay, ny = ax;
    ctx.lineCap = 'round';
    for (const sd of [-2.6, 2.6]) {
      ctx.beginPath();
      ctx.moveTo(x + nx * sd - ax * back, y + ny * sd - ay * back);
      ctx.lineTo(x + nx * sd + ax * (17 - back) * s, y + ny * sd + ay * (17 - back) * s);
      neon(c, 2.2);
    }
    ctx.lineCap = 'butt';
    polyPath(x, y, 7.5 * s * k, 4, aim + Math.PI / 4);
    ctx.fillStyle = '#0b0a1a'; ctx.fill(); ctx.fillStyle = hexA(c, 0.3); ctx.fill(); neon(c, 1.8);
  } else if (type === 'beacon') {
    const p = (t * 0.8) % 1;
    ctx.beginPath(); ctx.arc(x, y, 6 + p * 12, 0, TAU); ctx.lineWidth = 1.5; ctx.strokeStyle = hexA(c, 0.7 * (1 - p)); ctx.stroke();
    polyPath(x, y, 9 * s * k, 8, Math.PI / 8);
    ctx.fillStyle = hexA(c, 0.15); ctx.fill(); neon(c, 1.8);
    ctx.beginPath(); ctx.arc(x, y, 3.2 + Math.sin(t * 4) * 0.8, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
  } else if (type === 'pyro') {                           // a flame-shaped body behind a short nozzle
    const back = (o.kick || 0) * 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + ax * (13 - back) * s, y + ay * (13 - back) * s);
    ctx.lineCap = 'round'; ctx.lineWidth = 6 * s; ctx.strokeStyle = '#0b0a1a'; ctx.stroke(); neon(c, 3.4 * s); ctx.lineCap = 'butt';
    const h = 11 * s * k;
    ctx.beginPath(); ctx.moveTo(x, y - h); ctx.quadraticCurveTo(x + 10 * s, y - 2 * s, x + 6 * s, y + 8 * s);
    ctx.quadraticCurveTo(x, y + 11 * s, x - 6 * s, y + 8 * s); ctx.quadraticCurveTo(x - 10 * s, y - 2 * s, x, y - h); ctx.closePath();
    ctx.fillStyle = '#0b0a1a'; ctx.fill(); ctx.fillStyle = hexA(c, 0.3); ctx.fill(); neon(c, 1.8);
    additive(true); glow(x, y + 2, 12 + lv * 2, '#ffb347', 0.5 + (o.kick || 0) * 0.4); additive(false);
    ctx.beginPath(); ctx.arc(x, y + 2, 2.6 + lv * 0.5 + Math.sin(t * 18) * 0.5, 0, TAU); ctx.fillStyle = '#ffe08a'; ctx.fill();
  } else if (type === 'tide') {                           // a water drop with a nozzle
    const back = (o.kick || 0) * 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + ax * (13 - back) * s, y + ay * (13 - back) * s);
    ctx.lineCap = 'round'; ctx.lineWidth = 5 * s; ctx.strokeStyle = '#0b0a1a'; ctx.stroke(); neon(c, 3 * s); ctx.lineCap = 'butt';
    const h = 11 * s * k;
    ctx.beginPath(); ctx.moveTo(x, y - h); ctx.bezierCurveTo(x + 9 * s, y - 1 * s, x + 8 * s, y + 9 * s, x, y + 9 * s);
    ctx.bezierCurveTo(x - 8 * s, y + 9 * s, x - 9 * s, y - 1 * s, x, y - h); ctx.closePath();
    ctx.fillStyle = '#0b0a1a'; ctx.fill(); ctx.fillStyle = hexA(c, 0.28); ctx.fill(); neon(c, 1.8);
    const wv = Math.sin(t * 3) * 1.5;
    ctx.beginPath(); ctx.moveTo(x - 5 * s, y + 3 + wv); ctx.quadraticCurveTo(x, y + 0.5 - wv, x + 5 * s, y + 3 + wv);
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#d8fff6'; ctx.stroke();
  }
  // LV3: orbiting shards
  if (lv >= 2 && !master && !wire) {
    for (let i = 0; i < 3; i++) {
      const a = t * 1.8 + i * TAU / 3, ox = x + Math.cos(a) * 19, oy = y + Math.sin(a) * 19;
      polyPath(ox, oy, 3, 4, a); ctx.fillStyle = c; ctx.fill();
    }
  }
  // MASTER BOLT: a spiked gold crown, a cyan dashed halo and four white shards
  if (master) {
    additive(true); glow(x, y, 36, c, 0.32 + Math.sin(t * 3) * 0.1); additive(false);
    for (let i = 0; i < 4; i++) {
      const a = t * 0.9 + i * TAU / 4;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a - 0.24) * 17, y + Math.sin(a - 0.24) * 17);
      ctx.lineTo(x + Math.cos(a) * 24, y + Math.sin(a) * 24); ctx.lineTo(x + Math.cos(a + 0.24) * 17, y + Math.sin(a + 0.24) * 17); ctx.closePath();
      ctx.fillStyle = hexA(c, 0.95); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, 20.5, 0, TAU); ctx.setLineDash([2, 3]); ctx.lineDashOffset = t * 14;
    ctx.lineWidth = 1.3; ctx.strokeStyle = hexA(d.color, 0.8); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 0; i < 4; i++) {
      const a = -t * 1.6 + i * TAU / 4 + Math.PI / 4, ox = x + Math.cos(a) * 20.5, oy = y + Math.sin(a) * 20.5;
      polyPath(ox, oy, 2.2, 4, a); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  // LIVE WIRE: three blue pylons joined by a crackling ring, inside a dashed yellow crown
  if (wire) {
    additive(true); glow(x, y, 38, c, 0.3 + Math.sin(t * 4) * 0.1); glow(x, y, 26, WIRE_BLUE, 0.16); additive(false);
    ctx.beginPath(); ctx.arc(x, y, 25, 0, TAU); ctx.setLineDash([4, 3]); ctx.lineDashOffset = -t * 20;
    ctx.lineWidth = 1.4; ctx.strokeStyle = hexA(c, 0.8); ctx.stroke(); ctx.setLineDash([]);
    const py = [];
    for (let i = 0; i < 3; i++) { const a = t * 0.6 + i * TAU / 3 - Math.PI / 2; py.push([x + Math.cos(a) * 21.5, y + Math.sin(a) * 21.5, a]); }
    additive(true); ctx.lineWidth = 1.1; ctx.strokeStyle = hexA(WIRE_BLUE, 0.75);
    for (let i = 0; i < 3; i++) {                          // jagged current running round the ring between the pylons
      const a0 = py[i][2];
      ctx.beginPath(); ctx.moveTo(py[i][0], py[i][1]);
      for (let j = 1; j <= 8; j++) {
        const a = a0 + j / 8 * TAU / 3, rr = 21.5 + (j < 8 ? Math.sin(t * 37 + i * 3 + j * 5) * 1.8 : 0);
        ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      ctx.stroke();
    }
    additive(false);
    for (const [ox, oy, a] of py) { polyPath(ox, oy, 3.4, 4, a); ctx.fillStyle = WIRE_BLUE; ctx.fill(); ctx.beginPath(); ctx.arc(ox, oy, 1.2, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); }
  }
  // LV4: a bright crown ring and a second, counter-turning set of shards
  if (lv >= 3 && !master && !wire) {
    additive(true); glow(x, y, 30, c, 0.25 + Math.sin(t * 3) * 0.08); additive(false);
    ctx.beginPath(); ctx.arc(x, y, 23, 0, TAU); ctx.setLineDash([3, 4]); ctx.lineDashOffset = -t * 12;
    ctx.lineWidth = 1.4; ctx.strokeStyle = hexA(c, 0.75); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 0; i < 3; i++) {
      const a = -t * 1.3 + i * TAU / 3 + Math.PI / 3, ox = x + Math.cos(a) * 23, oy = y + Math.sin(a) * 23;
      polyPath(ox, oy, 2.4, 4, a); ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }
  // level pips
  if (!o.ghost) {
    for (let i = 0; i <= lv; i++) {
      ctx.beginPath(); ctx.arc(x + (i - lv / 2) * 6, y + 19.5, 1.7, 0, TAU);
      ctx.fillStyle = c; ctx.fill();
    }
  }
  ctx.globalAlpha = pa;
}

function drawCoin(x, y, r, a = 1) {
  const pa = ctx.globalAlpha;
  ctx.globalAlpha = pa * a;
  additive(true); glow(x, y, r * 3, '#ffd23d', 0.5); additive(false);
  polyPath(x, y, r, 6, 0); ctx.fillStyle = '#3a2a05'; ctx.fill(); neon('#ffd23d', 1.6);
  ctx.globalAlpha = pa;
}

// jagged lightning between points
function drawLightning(pts, color, a) {
  const seg = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p = pts[i], q = pts[i + 1];
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
    const n = Math.max(2, Math.floor(len / 11)), nx = -dy / len, ny = dx / len;
    seg.push([p.x, p.y]);
    for (let j = 1; j < n; j++) {
      const off = rand(-7, 7) * Math.sin(Math.PI * j / n);
      seg.push([p.x + dx * j / n + nx * off, p.y + dy * j / n + ny * off]);
    }
  }
  const e = pts[pts.length - 1]; seg.push([e.x, e.y]);
  additive(true);
  ctx.beginPath(); seg.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.lineJoin = 'round';
  ctx.globalAlpha = a * 0.45; ctx.lineWidth = 6; ctx.strokeStyle = color; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  ctx.globalAlpha = 1;
  for (const p of pts) glow(p.x, p.y, 14, color, a * 0.8);
  additive(false);
}

// =====================================================================
//  MAP GEOMETRY (one or more lanes into one core)
// =====================================================================
function makeLane(turnPts) {
  const pts = turnPts.map(([c, r]) => ({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 }));
  const segs = []; let len = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], l = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, l, start: len, ang: Math.atan2(b.y - a.y, b.x - a.x) }); len += l;
  }
  function at(d) {
    d = clamp(d, 0, len);
    for (const s of segs) {
      if (d <= s.start + s.l) { const t = (d - s.start) / s.l; return { x: lerp(s.a.x, s.b.x, t), y: lerp(s.a.y, s.b.y, t), ang: s.ang }; }
    }
    const s = segs[segs.length - 1]; return { x: s.b.x, y: s.b.y, ang: s.ang };
  }
  return { tp: turnPts, pts, segs, len, at, start: pts[0], end: pts[pts.length - 1] };
}
// paths: full routes enemies walk (portal -> core). lanes: what gets drawn (branches stop at the merge).
const MAP = { paths: [], lanes: [], tiles: new Set(), core: { x: 0, y: 0 }, portals: [] };
function setMap(paths, lanes) {
  lanes = lanes || paths;
  MAP.paths = paths.map(makeLane);
  MAP.lanes = lanes.map(makeLane);
  MAP.tiles = new Set();
  for (const p of lanes) for (const [c, r] of expandTiles(p)) MAP.tiles.add(r * COLS + c);
  MAP.core = MAP.paths[0].end;
  MAP.portals = MAP.paths.map(p => p.start);
  // flyers ignore the track: a straight flight line from each portal to the core
  MAP.flights = MAP.paths.map(p => makeLane([p.tp[0], p.tp[p.tp.length - 1]]));
}

// =====================================================================
//  EFFECTS: particles, rings, lightning, floating text
// =====================================================================
const FX = {
  parts: [], rings: [], zaps: [], texts: [], lines: [],
  add(p) {                                  // particle budget (smaller when the device is struggling)
    const n = this.parts.length;
    if (n >= 340 * QUALITY.fx || (QUALITY.fx < 1 && n > 120 && Math.random() > QUALITY.fx)) return;
    this.parts.push(p);
  },
  spark(x, y, color, n, sp = 160, life = 0.35) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(sp * 0.3, sp);
      this.add({ k: 0, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * 0.5, life), max: life, color, w: rand(1, 2) });
    }
  },
  shards(x, y, color, n, sp = 150, size = 4) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(sp * 0.35, sp);
      this.add({ k: 1, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rand(0, TAU), vr: rand(-12, 12), s: rand(size * 0.5, size), life: rand(0.45, 0.8), max: 0.8, color });
    }
  },
  dot(x, y, color, size = 3, life = 0.3, vx = 0, vy = 0) {
    this.add({ k: 2, x, y, vx, vy, s: size, life, max: life, color });
  },
  flash(x, y, r, color, life = 0.18) { this.add({ k: 3, x, y, r, life, max: life, color }); },
  ring(x, y, r0, r1, color, life = 0.4, w = 3) { if (this.rings.length > 80) this.rings.shift(); this.rings.push({ x, y, r0, r1, color, life, max: life, w }); },
  line(x1, y1, x2, y2, color, life = 0.3, w = 5) { this.lines.push({ x1, y1, x2, y2, color, life, max: life, w }); },
  zap(pts, color, life = 0.16) { this.zaps.push({ pts, color, life, max: life, t: 0 }); },
  text(x, y, str, color, size = 11, opts = {}) {
    if (this.texts.length > 36) this.texts.shift();
    this.texts.push({ x, y, str, color, size, life: opts.life || 0.75, max: opts.life || 0.75, vy: opts.vy || -38, pop: 1, font: opts.font || FONT_UI });
  },
  shatter(x, y, color, r, big) {
    this.flash(x, y, r * (big ? 7 : 4.2), color, big ? 0.45 : 0.2);
    this.ring(x, y, r * 0.6, r * (big ? 6 : 3), color, big ? 0.7 : 0.35, big ? 5 : 2.5);
    this.shards(x, y, color, big ? 46 : Math.round(7 + r * 0.5), big ? 300 : 150, big ? 7 : Math.max(3, r * 0.45));
    this.spark(x, y, '#ffffff', big ? 24 : 4, big ? 380 : 190, 0.3);
  },
  update(dt) {
    const P = this.parts; let j = 0;                 // update and compact in one pass (no splice)
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
      if (p.k === 0) { p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; }
      else if (p.k === 1) { p.vx *= 1 - 3.2 * dt; p.vy *= 1 - 3.2 * dt; p.rot += p.vr * dt; }
      else if (p.k === 2) { p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt; }
      P[j++] = p;
    }
    P.length = j;
    for (let i = this.rings.length - 1; i >= 0; i--) { const r = this.rings[i]; r.life -= dt; if (r.life <= 0) this.rings.splice(i, 1); }
    for (let i = this.zaps.length - 1; i >= 0; i--) { const z = this.zaps[i]; z.life -= dt; if (z.life <= 0) this.zaps.splice(i, 1); }
    for (let i = this.lines.length - 1; i >= 0; i--) { const l = this.lines[i]; l.life -= dt; if (l.life <= 0) this.lines.splice(i, 1); }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i]; t.life -= dt; t.y += t.vy * dt; t.vy *= 1 - 2.2 * dt; t.pop = Math.max(0, t.pop - dt * 6);
      if (t.life <= 0) this.texts.splice(i, 1);
    }
  },
  draw() {
    additive(true);
    ctx.lineCap = 'round';
    for (const l of this.lines) {
      const a = l.life / l.max;
      ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2);
      ctx.globalAlpha = a * 0.35; ctx.lineWidth = l.w * 2.6 * (0.5 + a * 0.5); ctx.strokeStyle = l.color; ctx.stroke();
      ctx.globalAlpha = a; ctx.lineWidth = l.w * a; ctx.stroke();
      ctx.lineWidth = Math.max(0.8, l.w * 0.35 * a); ctx.strokeStyle = '#ffffff'; ctx.stroke();
    }
    ctx.lineCap = 'butt'; ctx.globalAlpha = 1;
    for (const r of this.rings) {
      const f = 1 - r.life / r.max, rad = lerp(r.r0, r.r1, easeOut(f));
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU);
      ctx.globalAlpha = (1 - f) * 0.9; ctx.lineWidth = r.w * (1 - f * 0.6); ctx.strokeStyle = r.color; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const p of this.parts) {
      const a = p.life / p.max;
      if (p.k === 0) {
        ctx.globalAlpha = a; ctx.lineWidth = p.w; ctx.strokeStyle = p.color;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
      } else if (p.k === 1) {
        ctx.globalAlpha = Math.min(1, a * 1.4); ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(p.rot) * p.s, p.y + Math.sin(p.rot) * p.s);
        ctx.lineTo(p.x + Math.cos(p.rot + 2.3) * p.s * 0.6, p.y + Math.sin(p.rot + 2.3) * p.s * 0.6);
        ctx.lineTo(p.x + Math.cos(p.rot + 3.9) * p.s * 0.7, p.y + Math.sin(p.rot + 3.9) * p.s * 0.7);
        ctx.closePath(); ctx.fill();
      } else if (p.k === 2) {
        glow(p.x, p.y, p.s * 2.2, p.color, a * 0.9);
      } else if (p.k === 3) {
        glow(p.x, p.y, p.r * (0.6 + 0.4 * (1 - a)), p.color, a);
      }
    }
    ctx.globalAlpha = 1;
    additive(false);
    for (const z of this.zaps) drawLightning(z.pts, z.color, z.life / z.max);
    for (const t of this.texts) {
      const a = Math.min(1, t.life / (t.max * 0.4)), sc = 1 + t.pop * 0.5, sp = textSprite(t.str, t.size, t.color, t.font, true);
      ctx.globalAlpha = a; ctx.drawImage(sp.cv, t.x - sp.w * sc / 2, t.y - sp.h * sc / 2, sp.w * sc, sp.h * sc);
    }
    ctx.globalAlpha = 1;
  },
  clear() { this.parts.length = 0; this.rings.length = 0; this.zaps.length = 0; this.texts.length = 0; this.lines.length = 0; },
};

// =====================================================================
//  BACKGROUND (pre-rendered once per layout / world)
// =====================================================================
let bgCanvas = document.createElement('canvas');
function buildBackground(theme) {
  bgCanvas.width = cvs.width; bgCanvas.height = cvs.height;
  const g = bgCanvas.getContext('2d'), k = DPR * SCALE;
  g.setTransform(k, 0, 0, k, 0, 0);
  const cx = MAP_X + W / 2, cy = MAP_Y + ROWS * TILE / 2;
  const gr = g.createRadialGradient(cx, cy, 20, cx, cy, Math.max(LW, LH) * 0.75);
  gr.addColorStop(0, theme.bg2); gr.addColorStop(1, theme.bg);
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  // lattice of dots across the whole screen, aligned to the map grid
  g.fillStyle = hexA(theme.grid, 0.55);
  const ox = MAP_X % TILE, oy = MAP_Y % TILE;
  for (let x = ox - TILE; x < LW + TILE; x += TILE)
    for (let y = oy - TILE; y < LH + TILE; y += TILE) g.fillRect(x - 1, y - 1, 2, 2);
  // buildable tiles
  g.save(); g.translate(MAP_X, MAP_Y);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (MAP.tiles.has(r * COLS + c)) continue;

const Save = {
  d: { max: 1, stars: {}, loadout: ['bolt'], known: ['bolt'], done: false, lab: {}, labLoadout: ['nova', 'bolt', 'arc', 'frost'] },
  lab: null,             // the Playtest Lab level being set up or played (not saved): everything is unlocked for it
  load() {
    try {
      const d = JSON.parse(localStorage.getItem('shatterline.save') || 'null');
      if (d && d.max) this.d = Object.assign(this.d, d);
    } catch (e) {}
    this.d.max = clamp(this.d.max | 0, 1, LEVELS.length);
    this.freshLabs(); this.store();
    // players who had cleared the old final level carry on into the new ones
    if (this.d.done && this.d.max < LEVELS.length && this.stars(this.d.max) > 0) { this.d.max += 1; this.d.done = false; }
  },
  // highest level you can open: your progress, or everything while test mode is on
  open() { return this.lab ? LEVELS.length : this.d.testAll ? LEVELS.length : this.d.max; },
  lo() { return this.lab ? this.d.labLoadout : this.d.loadout; },     // the lab keeps its own loadout
  store() { try { localStorage.setItem('shatterline.save', JSON.stringify(this.d)); } catch (e) {} },
  // start over: levels, stars, towers and loadout go back to a fresh install (language and settings stay)
  reset() { this.d = { max: 1, stars: {}, loadout: ['bolt'], known: ['bolt'], done: false, lab: this.d.lab || {}, labLoadout: this.d.labLoadout || ['nova', 'bolt', 'arc', 'frost'] }; this.store(); },
  stars(n) { return isLab(n) ? (this.labRec(n).stars || 0) : this.d.stars[n] || 0; },
  labRec(n) { this.d.lab = this.d.lab || {}; return this.d.lab[n] || (this.d.lab[n] = { stars: 0, plays: 0, wins: 0, v: labVer(n) }); },
  // v33 (user: "the playtests still aren't cleared"): a lab whose version changed starts over completely.
  // Stars, wins, plays, last result and the COMPLETED stamp reset; the old runs stay for the analytics report.
  freshLabs() {
    const L = this.d.lab || {};
    for (const lv of LAB) {
      const r = L[lv.n], v = lv.lab.v || 1;
      if (r && (r.v || 1) !== v) L[lv.n] = { stars: 0, plays: 0, wins: 0, v, runs: r.runs || [] };
    }
    this.d.lab = L;
  },
  total() { return Object.values(this.d.stars).reduce((a, b) => a + b, 0); },
  unlockedTowers() { return TOWER_ORDER.filter(t => TOWERS[t].unlock <= this.open()); },
  complete(n, stars) {
    const prev = this.stars(n);
    if (isLab(n)) {                   // lab: remember the result, never touch campaign progress
      const r = this.labRec(n); r.plays++; if (stars > 0) r.wins++; r.stars = Math.max(r.stars || 0, stars);
      const v = levelOf(n).lab.v || 1; if (stars > 0 && r.doneV !== v) { r.doneV = v; r.stamped = false; }   // v28: COMPLETED (the stamp slams down next time you see the lab)
      r.last = { win: G.result === 'win', lives: G.lives, wave: G.waveNum, waves: G.waves.length, earned: G.earned, spent: G.spent, left: G.gold };
      this.store(); return { first: false, prev };
    }
    if (stars > prev) this.d.stars[n] = stars;
    let first = false;
    if (stars > 0 && n === this.d.max) { first = true; if (n < LEVELS.length) this.d.max = n + 1; else this.d.done = true; }
    this.store();
    return { first, prev };
  },
  // new towers go straight into the loadout so you try them
  syncLoadout() {
    if (this.lab) {                   // lab: every tower is open; keep the lab loadout valid and full
      const all = TOWER_ORDER, slots = slotsFor(LEVELS.length);
      let lo = (this.d.labLoadout || []).filter(t => TOWERS[t] && !this.lab.banned.includes(t));
      for (const t of ['nova', 'bolt', 'arc', 'frost', 'rail', 'prism']) if (lo.length < slots && !lo.includes(t)) lo.push(t);
      this.d.labLoadout = lo.slice(0, slots); this.store();
      return [];
    }
    const slots = slotsFor(this.open()), fresh = [];
    for (const t of this.unlockedTowers()) if (!this.d.known.includes(t)) { this.d.known.push(t); fresh.push(t); }
    let lo = this.d.loadout.filter(t => TOWERS[t] && TOWERS[t].unlock <= this.open());
    for (const t of fresh) { if (lo.includes(t)) continue; if (lo.length >= slots) lo.pop(); lo.push(t); }
    for (const t of this.unlockedTowers()) if (lo.length < Math.min(slots, this.unlockedTowers().length) && !lo.includes(t)) lo.push(t);
    this.d.loadout = lo.slice(0, slots);
    this.store();
    return fresh;
  },
};

function buildSpawns(w) {
  const list = [], nl = MAP.paths.length, tl = new Array(nl).fill(0);
  for (const [type, count, gap, lane, mods] of G.waves[w - 1]) {
    const lanes = lane < 0 ? [...Array(nl).keys()] : [Math.min(lane, nl - 1)];
    const t0 = Math.max(...lanes.map(i => tl[i]));
    for (let i = 0; i < count; i++) list.push({ type, at: t0 + i * gap, lane: lanes[i % lanes.length], mods });
    const end = t0 + (count - 1) * gap + ECON.groupGap;
    for (const i of lanes) tl[i] = end;

}
// How hard the music should push (0..1): bigger waves later in the level, more enemies on

function musicIntensity() {

  let alive = 0; for (const e of G.enemies) if (e.alive) alive += e.rc.boss ? 6 : coreDamage(e.rc);
  for (const sp of G.spawners) alive += (sp.list.length - sp.i) * 0.5;          // the rest of the wave is coming

    kick: 0, spawn: 0, mode: 'first', spent: TOWERS[type].cost, retT: 0, target: null, idleT: rand(0, 2),
    buff: 0, heat: 0, beamT: null, acc: 0, accT: 0, dir: 1, tube: 0, zapT: 0, chillT: 0, hp: 100, burning: false };

// ---- Rail: fires down one fixed line (up / right / down / left) ----
const RAIL_DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

function bestRailDir(c, r, range) {

    const n = railTiles(c, r, d, range).filter(([cc, rr]) => MAP.tiles.has(rr * COLS + cc)).length;
    if (n > bv) { bv = n; best = d; }
  }
  return best;
}

  const range = TOWERS.rail.lv[tw.lv].range * TILE, [ax, ay] = RAIL_DIRS[tw.dir], v = [];
  for (const e of G.enemies) {
    if (!e.alive || e.rc.flying || e.age < 0.15) continue;
    const px = e.x - tw.x, py = e.y - tw.y, along = px * ax + py * ay;
    if (along < 0 || along > range + e.rc.r) continue;
    if (Math.abs(px * ay - py * ax) <= e.rc.r + 6) v.push(e);

  for (const e of victims) { FX.spark(e.x, e.y, c, 5, 200, 0.3); damage(e, L.dmg * (1 + tw.buff), { big: true }); }
  FX.line(mx, my, tw.x + ax * range, tw.y + ay * range, c, 0.34, 5);
  FX.flash(mx, my, 30, c, 0.15);

function drawWire(t) {

  let pulse = 0;
  for (const tw of G.towers) {
    if (!isWireTw(tw)) continue;

    pulse = Math.max(pulse, tw.wirePulse || 0);

      const L = MAP.paths[i].len, reach = e * L;
      (spans.get(i) || spans.set(i, []).get(i)).push([tw.wireD0[i] - reach, tw.wireD0[i] + reach]);
    }

  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  additive(true);

    const pth = MAP.paths[i], step = 9, lines = [];

// ------------------------------------------------------------- update
function update(dt) {
  G.time += dt; DMG_SRC = null;
  if (G.over) return;
  if (G.demo) {
    G.demoT -= dt;
    if (G.demoT <= 0 && G.enemies.length < 14) {
      const pool = ['grunt', 'grunt', 'scout', 'scout', 'brute', 'splitter', 'aegis', 'blink', 'mender', 'titan', 'volt', 'yeti'];
      spawnEnemy(pool[Math.floor(Math.random() * pool.length)], 3);
      G.demoT = rand(0.35, 0.9);
    }
  }
  // wave spawners
  for (let i = G.spawners.length - 1; i >= 0; i--) {
    const sp = G.spawners[i]; sp.t += dt;
    while (sp.i < sp.list.length && sp.list[sp.i].at <= sp.t) {
      const s = sp.list[sp.i];
      spawnEnemy(s.type, sp.wave, s.lane, 0, 0, s.mods); sp.i++; waveStat(sp.wave).toSpawn--;
    }
    if (sp.i >= sp.list.length) {
      G.spawners.splice(i, 1);
      if (sp.wave === G.waveNum && G.waveNum < G.waves.length && !G.demo) G.nextTimer = ECON.nextDelay;
    }
  }
  if (G.nextTimer !== null) { G.nextTimer -= dt; if (G.nextTimer <= 0) startWave(false); }
  G.musT = (G.musT || 0) - dt;
  if (G.musT <= 0 && !G.demo) { G.musT = 0.25; Sound.setIntensity(musicIntensity()); }
  // enemies
  G.domes = G.enemies.filter(a => a.alive && a.domeMax > 0);
  G.wire = wireTiles();
  for (const e of G.enemies) {
    if (!e.alive) continue;
    e.age += dt;
    if (e.elecOff > 0) e.elecOff -= dt;
    // v37: a live electrified enemy on a LIVE WIRE road feeds on it: bigger reach and +20% speed while on it, +20% health once
    e.charged = !!G.wire && !e.rc.flying && isLiveElec(e) && G.wire.has(tileKey(e));
    if (e.charged && !e.fed) {
      e.fed = true; e.maxHp *= ELEC.wireHp; e.hp *= ELEC.wireHp;
      FX.text(e.x, e.y - e.rc.r - 8, tr('charged'), '#fff36a', 10, { font: FONT_D, life: 0.8 });
      FX.ring(e.x, e.y, e.rc.r, elecReach(e), '#f6ff3d', 0.4, 2);
    }
    if (e.iceLock > 0) {                              // frozen solid: stays put, then thaws and its frost marks reset
      e.iceLock -= dt;
      if (e.iceLock <= 0) { e.marks = 0; FX.shards(e.x, e.y, '#e8fbff', 5, 90, 2.5); }
    }
    const held = e.iceLock > 0;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) { e.slowAmt = 0; e.brittle = false; } }
    const sl = e.slowT > 0 ? 1 - e.slowAmt : 1;
    if (!held) e.dist += e.speed * sl * dt * (e.charged ? ELEC.wireSpeed : 1);
    // Blink: teleport ahead
    let warped = false;
    if (e.rc.blink && e.age > 0.8 && !held) {
      e.warpT -= dt;
      if (e.warpT <= 0) {
        e.warpT = e.rc.blink.every * rand(0.8, 1.2);
        const nd = Math.min(e.path.len - 30, e.dist + e.rc.blink.dist * TILE);
        if (nd > e.dist) {
          FX.flash(e.x, e.y, 26, e.rc.color, 0.25); FX.ring(e.x, e.y, 3, 18, e.rc.color, 0.3, 2);
          for (let i = 0; i < 5; i++) FX.dot(e.x + rand(-5, 5), e.y + rand(-5, 5), e.rc.color, 2, 0.4);
          e.dist = nd; warped = true; snd('blink');
        }
      }
    }
    if (e.dist >= e.path.len) { leak(e); continue; }
    const p = e.path.at(e.dist);
    const k = e.off && !warped ? Math.min(1, dt * 10) : 1;
    e.x = lerp(e.x, p.x, k); e.y = lerp(e.y, p.y, k);
    if (warped) { FX.flash(e.x, e.y, 30, e.rc.color, 0.25); FX.ring(e.x, e.y, 18, 3, '#ffffff', 0.25, 2); }
    let da = p.ang - e.dir; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    e.dir += da * Math.min(1, dt * 12);

    if (e.slowT > 0 && Math.random() < dt * 6) FX.dot(e.x + rand(-8, 8), e.y + rand(-8, 8), '#dfe8ff', 1.6, 0.35, 0, -15);

      if (e.sumT <= 0) {

        e.sumT = Math.max(2.5, S.every - ref / 40) * (e.enraged ? 0.55 : 1);
        const n = ref >= 50 ? 3 : 2;
        for (let i = 0; i < n; i++) {
          e.sumI = (e.sumI || 0) + 1;
          const m = spawnEnemy(S.types[e.sumI % S.types.length], e.wave, e.lane, Math.max(0, e.dist - 16 - i * 12), 1);
          m.x = e.x + rand(-6, 6); m.y = e.y + rand(-6, 6);
        }
        FX.ring(e.x, e.y, e.rc.r, e.rc.r * 3.2, e.rc.color, 0.5, 3); FX.flash(e.x, e.y, e.rc.r * 3, e.rc.color, 0.2);

  if (volts) {
    for (const tw of G.towers) {
      if (isWireTw(tw)) continue;                                                  // the LIVE WIRE runs at a fixed rate
      if (!volts.some(e => (e.x - tw.x) ** 2 + (e.y - tw.y) ** 2 <= elecReach(e) ** 2)) continue;
      if (tw.zapT <= 0) towerZapped(tw);
      tw.zapT = ELEC.time;
    }
  }
  // Burning enemies toss a fireball, one at a time, at the nearest tower in reach that isn't burning (never FROST)
  for (const e of G.enemies) {
    if (!e.alive || !e.fire || e.doused || e.iceLock > 0 || e.age < 0.5) continue;
    e.fireT -= dt;
    if (e.fireT > 0) continue;
    const R2 = (FIRE.r * TILE) ** 2; let best = null, bd = R2;
    for (const tw of G.towers) {
      if (tw.burning || tw.type === 'frost' || G.fireballs.some(f => f.tw === tw)) continue;
      const dd = (tw.x - e.x) ** 2 + (tw.y - e.y) ** 2; if (dd <= bd) { bd = dd; best = tw; }
    }

  for (const tw of G.towers) {

    if (tw.burning) { tw.hp -= 100 / FIRE.burn * dt; if (tw.hp <= 0) { (burnt = burnt || []).push(tw); continue; } }
    if (tw.zapT > 0) tw.zapT -= dt;
    if (tw.chillT > 0) tw.chillT -= dt;
    const off = tw.zapT > 0 && tw.type !== 'arc';                                   // shorted out
    const rm = off ? 0 : (tw.zapT > 0 ? ELEC.arcRate : 1) * (tw.chillT > 0 && tw.type !== 'frost' ? ICE.slow : 1);
    tw.cd -= dt * rm; tw.kick = Math.max(0, tw.kick - dt * 5); tw.spawn = Math.min(1, tw.spawn + dt * 4);
    const d = TOWERS[tw.type];
    if (d.eco) {
      if (G.awaiting || G.waveNum === 0 || G.demo) tw.cd += dt * rm;     // only pays while waves run
      else if (tw.cd <= 0 && tw.spawn >= 1 && !off) mintPulse(tw);
      continue;
    }
    if (d.support) continue;
    if (off) { tw.beamT = null; tw.heat = 0; continue; }
    if (isWireTw(tw)) { wireUpdate(tw, dt); continue; }
    if (tw.type === 'rail') {

    if (tw.type === 'prism') {

  // snowballs: arc over to their tower
  for (let i = G.snow.length - 1; i >= 0; i--) {
    const b = G.snow[i]; b.t += dt;
    const f = Math.min(1, b.t / b.dur);
    b.x = lerp(b.sx, b.tw.x, f); b.y = lerp(b.sy, b.tw.y, f); b.h = Math.sin(Math.PI * f) * b.arc;

  }
  // fireballs: arc over to their tower and set it alight
  for (let i = G.fireballs.length - 1; i >= 0; i--) {
    const b = G.fireballs[i]; b.t += dt;
    const f = Math.min(1, b.t / b.dur);
    b.x = lerp(b.sx, b.tw.x, f); b.y = lerp(b.sy, b.tw.y, f); b.h = Math.sin(Math.PI * f) * b.arc;
    if (Math.random() < 0.6) FX.dot(b.x + rand(-2, 2), b.y - b.h, Math.random() < 0.5 ? '#ff8a1a' : '#ffd23d', 2.2, 0.3, rand(-10, 10), rand(-20, 0));
    if (f >= 1) { G.fireballs.splice(i, 1); if (G.towers.includes(b.tw)) { FX.flash(b.tw.x, b.tw.y, 26, '#ff8a3d', 0.15); igniteTower(b.tw); } }
  }
  // bolts
  for (let i = G.shots.length - 1; i >= 0; i--) {
    const s = G.shots[i];
    if (s.tg.alive) { s.lx = s.tg.x; s.ly = s.tg.y; }
    const dx = s.lx - s.x, dy = s.ly - s.y, dd = Math.hypot(dx, dy), step = s.sp * dt;
    if (dd <= step + (s.tg.alive ? s.tg.rc.r * 0.6 : 2)) {

        if (s.crit) { FX.flash(s.lx, s.ly, 26, '#fff36a', 0.12); snd('crit'); } else snd('hit');

  for (let i = G.shells.length - 1; i >= 0; i--) {
    const s = G.shells[i]; s.t += dt;
    const f = Math.min(1, s.t / s.dur);
    s.x = lerp(s.sx, s.tx, f); s.y = lerp(s.sy, s.ty, f); s.h = Math.sin(Math.PI * f) * 46;
    if (Math.random() < 0.7) FX.dot(s.x, s.y - s.h, '#ff9a5c', 2.4, 0.3);
    if (f >= 1) {
      G.shells.splice(i, 1); DMG_SRC = s.src;
      for (const e of G.enemies) {
        if (!e.alive || e.rc.flying) continue;
        const d = Math.hypot(e.x - s.tx, e.y - s.ty);
        if (d <= s.splash + e.rc.r * 0.5) damage(e, s.dmg * (1 - 0.4 * Math.min(1, d / s.splash)), { pierce: true, big: true });
      }
      FX.flash(s.tx, s.ty, s.splash * 2.2, s.color, 0.3);
      FX.ring(s.tx, s.ty, 4, s.splash, s.color, 0.4, 4);
      FX.ring(s.tx, s.ty, 2, s.splash * 0.55, '#ffffff', 0.25, 2);
      FX.spark(s.tx, s.ty, '#ffc08a', 12, 240, 0.4);

  if (!G.demo) {
    for (let w = 1; w <= G.waveNum; w++) {
      const ws = G.waveStats[w];
      if (ws && !ws.cleared && ws.toSpawn <= 0 && ws.alive <= 0) {
        ws.cleared = true;

        const clean = !ws.leaked;
        const b = G.noBounty ? 0 : G.econ ? (clean ? G.econ.clean(w) : G.econ.dirty(w)) : Math.round(ECON.clearBonus(w) * ECON.goldRate);

          : { text: b ? tr('wave_clear_gold', w, b) : tr('wave_clear', w), color: '#7dffb0', t: 0, dur: 1.6 };
        snd('clear');
      }
    }
  }
  if (G.comboT > 0) G.comboT -= dt;
}

// visual-only timers that should run even when the sim is paused/over
function updateVisuals(dt, rdt) {
  FX.update(dt);
  // RAINSTORM: now and then the sky lights up and thunder rolls
  if (G.level && G.level.rain && G.state === 'play' && !G.paused && !G.over) {
    G.thunderT -= rdt;
    if (G.thunderT <= 0) { G.thunderT = rand(7, 14); G.flashA = Math.max(G.flashA, 0.22); G.flashCol = '#dfe8ff'; snd('thunder'); }
  }
  G.shake = Math.max(0, G.shake - rdt * 1.8);
  G.flashA = Math.max(0, G.flashA - rdt * 1.6);
  G.coreHit = Math.max(0, G.coreHit - rdt * 3);
  G.portalPulse = Math.max(0, G.portalPulse - rdt * 4);
  G.goldBump = Math.max(0, G.goldBump - rdt * 5);
  G.livesBump = Math.max(0, G.livesBump - rdt * 3);
  G.comboPop = Math.max(0, G.comboPop - rdt * 5);
  G.dispGold += (G.gold - G.dispGold) * Math.min(1, rdt * 12);
  if (Math.abs(G.gold - G.dispGold) < 0.5) G.dispGold = G.gold;
  for (const k of ['banner', 'toast', 'shout']) { const b = G[k]; if (b) { b.t += rdt; if (b.t >= b.dur) G[k] = null; } }
  const tx = MAP_X + 20, ty = HUD_H / 2;
  for (let i = G.coins.length - 1; i >= 0; i--) {
    const c = G.coins[i]; c.t += rdt;
    if (c.t < 0) continue;
    if (c.t < 0.3) { c.vy += 620 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; }
    else {
      const k = Math.min(1, rdt * (5 + (c.t - 0.3) * 30));
      c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
      if (Math.hypot(tx - c.x, ty - c.y) < 7 || c.t > 1.6) {
        G.coins.splice(i, 1);
        G.goldBump = 1; snd('coin');
      }
    }
  }
}
// =====================================================================
//  WORLD RENDER (map space)
// =====================================================================
function layout() {
  const rect = cvs.getBoundingClientRect();
  const vw = Math.max(1, rect.width), vh = Math.max(1, rect.height);
  DPR = Math.min(2, window.devicePixelRatio || 1, QUALITY.dpr);
  glyphCache.clear(); textCache.clear(); if (typeof glowTextCache !== 'undefined') glowTextCache.clear();   // sprites are per pixel density
  cvs.width = Math.round(vw * DPR); cvs.height = Math.round(vh * DPR);
  SCALE = Math.min(vw / W, vh / MIN_H);
  LW = vw / SCALE; LH = vh / SCALE;
  MAP_X = (LW - W) / 2;
  const avail = LH - HUD_H - BAR_H;
  MAP_Y = HUD_H + Math.max(0, (avail - ROWS * TILE) / 2);
  buildBackground(theme());
}

let drawMenuUnder = null;   // hook: the UI draws range previews under towers

function drawWorld() {

  ctx.setTransform(k, 0, 0, k, (MAP_X + sx) * k, (MAP_Y + sy) * k);

  drawPathFlow(th, G.time);
  drawWire(G.time);

  drawPortals(G.time, G.portalPulse);

  if (drawMenuUnder) drawMenuUnder();

    drawTowerGlyph(tw.type, tw.x, tw.y, { lv: tw.lv, aim: tw.aim, kick: tw.kick, t: G.time, heat: tw.heat, charge, scale: 1 + (1 - easeOut(sp)) * 0.8, alpha: Math.min(1, sp * 1.5) * (tw.zapT > 0 && tw.type !== 'arc' ? 0.3 : 1) });

function drawCombo() {

  if (t < 0.3) off = (1 - easeOut(t / 0.3)) * LW; else if (t > d - 0.3) off = -easeOut((t - (d - 0.3)) / 0.3) * LW;

const hits = [];

function bestHintTile() {
  let best = null, bv = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!isBuildable(c, r)) continue;
    let n = 0; for (const k of MAP.tiles) { const tc = k % COLS, tr = (k - tc) / COLS; if ((tc - c) ** 2 + (tr - r) ** 2 <= 2.3 * 2.3) n++; }
    if (n > bv) { bv = n; best = { c, r }; }
  }
  return best;
}

// Line-wraps centered text. Latin words stay whole; each Chinese character can break,
// but closing punctuation (，。) never starts a line.
function wrapTokens(str) {
  const out = [], re = /[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g;
  let m;
  while ((m = re.exec(str))) {
    const t = m[0];
    if (/^\s+$/.test(t)) { out.push({ t: ' ', sp: true }); continue; }
    if (/^[，。、；：？！）」』]$/.test(t) && out.length && !out[out.length - 1].sp) { out[out.length - 1].t += t; continue; }
    out.push({ t });
  }
  return out;
}
function wrapLines(str, maxW) {                     // v37: word-wrap into lines with the current font
  const out = []; let line = '';
  for (const k of wrapTokens(String(str))) {
    if (k.sp) { if (line) line += ' '; continue; }
    const t = line + k.t;
    if (ctx.measureText(t.trim()).width > maxW && line.trim()) { out.push(line.trim()); line = k.t; } else line = t;
  }
  if (line.trim()) out.push(line.trim());
  return out.length ? out : [''];
}
function wrapText(str, cx, y, maxW, lh) {
  let line = '', yy = y;
  ctx.textAlign = 'center';
  for (const k of wrapTokens(str)) {
    if (k.sp) { if (line) line += ' '; continue; }
    const t = line + k.t;
    if (ctx.measureText(t.trim()).width > maxW && line.trim()) { ctx.fillText(line.trim(), cx, yy); line = k.t; yy += lh; } else line = t;
  }

const SAGA = { scroll: 0, vel: 0, drag: null, card: null, info: null, fresh: [], shake: 0, deco: null, target: null };
const NODE_GAP = 96;

const WORLD_GAP = 46;          // extra room between worlds for the world banner
function sagaHeight() { return 250 + (LEVELS.length - 1) * NODE_GAP + (THEMES.length - 1) * WORLD_GAP + 250; }
function nodePos(n) {
  const amp = Math.min(104, LW * 0.27);
  return { x: LW / 2 + Math.sin((n - 1) * 0.9) * amp, y: sagaHeight() - 250 - (n - 1) * NODE_GAP - Math.floor((n - 1) / LEVELS_PER_WORLD) * WORLD_GAP };
}
function clampScroll(s) { return clamp(s, 0, Math.max(0, sagaHeight() - LH)); }
function scrollToLevel(n, instant) {
  const s = clampScroll(nodePos(n).y - LH * 0.56);
  if (instant) { SAGA.scroll = s; SAGA.target = null; } else SAGA.target = s;
}
function worldBand(w) {        // y-range (content space) of a world's section
  const first = w * LEVELS_PER_WORLD + 1, last = Math.min(LEVELS.length, first + LEVELS_PER_WORLD - 1);
  const bottom = w === 0 ? sagaHeight() : nodePos(first).y + (NODE_GAP + WORLD_GAP) / 2;
  const top = last >= LEVELS.length ? 0 : nodePos(last).y - (NODE_GAP + WORLD_GAP) / 2;

const DEV_HASH = 2860617095;

function withPassword(then) { if (DEV_OK) then(); else askPassword(then); }
